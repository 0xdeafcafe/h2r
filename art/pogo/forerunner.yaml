# The Forerunner "strut" (art/pogo/README.md): a six-sided strut of
# machined alloy with blades standing off it, a core of light for a piston
# and three rings over a pad for a foot. Model space, world units
# (1 = 3.048 m): +X forward, +Y left, +Z up, the origin the right grip. The
# shaft's axis is x 0, y 0.059.
name: pogo_forerunner
atlas: forerunner
nodes:
  - { name: frame, at: [0, 0, 0] }
  - { name: piston, parent: frame, at: [0, 0.059, -0.2] }
markers:
  - { name: grip_right, node: frame, at: [0, 0, 0] }
  - { name: grip_left, node: frame, at: [0, 0.118, 0] }
  - { name: peg_right, node: frame, at: [0, 0.023, -0.279] }
  - { name: peg_left, node: frame, at: [0, 0.095, -0.279] }
  - { name: foot, node: piston, at: [0, 0.059, -0.361] }
parts:
  - sweep:
      what: the bar, a flat beam between the grips
      node: frame
      region: body_dark
      section: { polygon: [[0.005, 0.004], [-0.005, 0.004], [-0.005, -0.004], [0.005, -0.004]] }
      path: [[0, 0.013, 0], [0, 0.105, 0]]
      caps: false
      shade: flat
  - lathe:
      what: the right grip, six-sided
      node: frame
      region: grip
      origin: [0, 0, 0]
      axis: [0, 1, 0]
      segments: 6
      caps: true
      shade: flat
      profile: [[0.006, -0.016], [0.0085, -0.013], [0.0085, 0.013], [0.006, 0.016]]
  - lathe:
      what: the left grip
      node: frame
      region: grip
      origin: [0, 0.118, 0]
      axis: [0, 1, 0]
      segments: 6
      caps: true
      shade: flat
      profile: [[0.006, -0.016], [0.0085, -0.013], [0.0085, 0.013], [0.006, 0.016]]
  - box:
      what: the head
      node: frame
      region: body_dark
      min: [-0.012, 0.043, -0.016]
      max: [0.012, 0.075, 0.014]
      bevel: 0.004
  - box:
      what: the crown on the head, lit
      node: frame
