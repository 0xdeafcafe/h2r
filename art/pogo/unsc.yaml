# The UNSC "field spring" (art/pogo/README.md): stamped olive steel over a
# gunmetal sleeve, a coil over the sleeve, a chromed piston and a tread
# rubber foot. Model space, world units (1 = 3.048 m): +X forward, +Y left,
# +Z up, the origin the right grip. The shaft's axis is x 0, y 0.059.
name: pogo_unsc
atlas: unsc
nodes:
  - { name: frame, at: [0, 0, 0] }
  - { name: piston, parent: frame, at: [0, 0.059, -0.2] }
markers:
  - { name: grip_right, node: frame, at: [0, 0, 0] }
  - { name: grip_left, node: frame, at: [0, 0.118, 0] }
  - { name: peg_right, node: frame, at: [0, 0.023, -0.279] }
  - { name: peg_left, node: frame, at: [0, 0.095, -0.279] }
  - { name: foot, node: piston, at: [0, 0.059, -0.361] }
parts:
  - sweep:
      what: the handlebar, between the grips
      node: frame
      region: body_dark
      section: { circle: { radius: 0.0055, sides: 8 } }
      path: [[0, 0.014, 0], [0, 0.104, 0]]
      caps: false
  - lathe:
      what: the right grip
      node: frame
      region: grip
      origin: [0, 0, 0]
      axis: [0, 1, 0]
      segments: 10
      caps: true
      profile: [[0.0085, -0.016], [0.0095, -0.014], [0.0075, -0.011], [0.0075, 0.011], [0.0095, 0.014], [0.0085, 0.016]]
  - lathe:
      what: the left grip
      node: frame
      region: grip
      origin: [0, 0.118, 0]
      axis: [0, 1, 0]
      segments: 10
      caps: true
      profile: [[0.0085, -0.016], [0.0095, -0.014], [0.0075, -0.011], [0.0075, 0.011], [0.0095, 0.014], [0.0085, 0.016]]
  - box:
      what: the head clamp, painted, with the stencil numerals
      node: frame
      region: accent
      min: [-0.013, 0.044, -0.014]
      max: [0.013, 0.074, 0.012]
      bevel: 0.003
  - lathe:
      what: the upper tube, with its collar under the clamp
      node: frame
      region: body
      origin: [0, 0.059, 0]
      segments: 12
      profile: [[0.0105, -0.150], [0.0105, -0.040], [0.0125, -0.036], [0.0125, -0.022], [0.0105, -0.018], [0.0105, -0.012]]
  - lathe:
      what: the sleeve the piston slides in, with the coil's upper perch
      node: frame
      region: body_dark
      origin: [0, 0.059, 0]
      segments: 12
      caps: true
      profile: [[0.012, -0.292], [0.0135, -0.288], [0.0135, -0.262], [0.0125, -0.258], [0.0125, -0.168], [0.0145, -0.164], [0.0145, -0.154], [0.0115, -0.150]]
  - sweep:
      what: the coil over the sleeve, six turns
      node: frame
      region: glow
      section: { circle: { radius: 0.003, sides: 4 } }
      path: [
          [0.0185, 0.0590, -0.1720], [0.0150, 0.0699, -0.1735], [0.0057, 0.0766, -0.1750],
