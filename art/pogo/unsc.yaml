          [-0.0057, 0.0414, -0.2575], [0.0057, 0.0414, -0.2590], [0.0150, 0.0481, -0.2605],
          [0.0185, 0.0590, -0.2620]
        ]
  - lathe:
      what: the collar the pegs are clamped to
      node: frame
      region: body
      origin: [0, 0.059, 0]
      segments: 12
      profile: [[0.0135, -0.290], [0.0165, -0.288], [0.0165, -0.274], [0.0135, -0.272]]
  - box:
