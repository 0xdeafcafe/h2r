          [0.0150, 0.0481, -0.1855], [0.0185, 0.0590, -0.1870], [0.0150, 0.0699, -0.1885],
          [0.0057, 0.0766, -0.1900], [-0.0057, 0.0766, -0.1915], [-0.0150, 0.0699, -0.1930],
          [-0.0185, 0.0590, -0.1945], [-0.0150, 0.0481, -0.1960], [-0.0057, 0.0414, -0.1975],
          [0.0057, 0.0414, -0.1990], [0.0150, 0.0481, -0.2005], [0.0185, 0.0590, -0.2020],
          [0.0150, 0.0699, -0.2035], [0.0057, 0.0766, -0.2050], [-0.0057, 0.0766, -0.2065],
          [-0.0150, 0.0699, -0.2080], [-0.0185, 0.0590, -0.2095], [-0.0150, 0.0481, -0.2110],
          [-0.0057, 0.0414, -0.2125], [0.0057, 0.0414, -0.2140], [0.0150, 0.0481, -0.2155],
          [0.0185, 0.0590, -0.2170], [0.0150, 0.0699, -0.2185], [0.0057, 0.0766, -0.2200],
