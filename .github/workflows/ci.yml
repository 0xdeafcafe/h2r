name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CC: clang
  CXX: clang++
  RUSTC_WRAPPER: ""
  CARGO_BUILD_JOBS: 4

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # `emit` tests compile Apple targets and invoke Apple's `libtool`.
        # Add Linux once the archive helper supports GNU toolchains.
        os: [macos-latest]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast
