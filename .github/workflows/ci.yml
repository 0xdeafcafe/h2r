name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CC: clang
  CXX: clang++
  RUSTC_WRAPPER: ""
  CARGO_BUILD_JOBS: 4

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # `emit` tests compile Apple targets and invoke Apple's `libtool`.
        # Add Linux once the archive helper supports GNU toolchains.
        os: [macos-latest]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true # images, the app icon among them
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
      # Style lints the workspace doesn't follow: guest-shaped code keeps wide
      # signatures, tuple results and index loops that mirror the original.
      - run: >-
          cargo clippy --workspace --all-targets -- -D warnings
          -A clippy::type_complexity -A clippy::too_many_arguments
          -A clippy::needless_range_loop -A clippy::identity_op
          -A clippy::chunks_exact_to_as_chunks -A clippy::manual_is_multiple_of
          -A clippy::large_enum_variant -A clippy::collapsible_if
      - run: cargo test --workspace --no-fail-fast

  # The Linux desktop host (docs/runtime/linux.md): the workspace and its
  # tests check with the lockfile as committed, and the tests that need no
  # GPU, audio device or disc run, as the Windows desktop job does.
  linux:
    name: ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true # images, the app icon among them
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      # ALSA (cpal) and udev (gilrs) link through pkg-config; Wayland and
      # xkbcommon cover winit and rfd. LLVM 22 is the clang, ld.lld and
      # llvm-ar the generated C is built with, as on Windows.
      - name: Install system libraries and LLVM 22
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
          curl -fLsS --retry 3 https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          sudo bash "$RUNNER_TEMP/llvm.sh" 22
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"
      - run: clang --version
      - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          cache-on-failure: true
      - name: Check workspace and tests
        run: cargo check --locked --workspace --tests
      - name: Run synthetic unit tests
        run: cargo test --locked -p ir -p runtime -p asf -p xiso -p snapshot -p host-dirs --lib
      - name: Check the guest C ABI
        run: cargo test --locked -p runtime --test layout
      - name: Check local agent connections
        run: cargo test --locked -p agent --test socket --test tcp
      - name: Exercise host fault dispatch
        run: cargo test --locked -p hostfault
      - name: Compare the Cranelift and C tiers
        run: cargo test --locked -p clif --test differential
      - name: Compile and load a generated Linux module
        run: cargo test --locked -p emit --test linux_host_import -- --nocapture
      - name: Pick GPU backends and surface modes per host
        run: 'cargo test --locked -p gfx -p app --lib -- context:: surface::'
      - name: Link and start h2
        run: cargo run --locked -p cli -- settings list
