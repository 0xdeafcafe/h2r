name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CC: clang
  CXX: clang++
  RUSTC_WRAPPER: ""
  CARGO_BUILD_JOBS: 4

jobs:
  # Repo checks that need python3 only (docs/dev/crate-structure.md,
  # docs/meta/docs-style.md): no Rust toolchain, a few seconds.
  repo-checks:
    name: repo checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Fails on a dependency the domain rules in scripts/crate-domains.toml
      # refuse, a crate outside its domain directory, a crate no domain
      # claims and a stale exception.
      - name: Crate layers
        run: python3 scripts/crate-graph.py layers --check
      - name: Crate table
        run: python3 scripts/crate-table.py --check
      # --strict: every finding fails the run (links, index, cited docs and
      # sections, names, paths, style, undocumented H2_* switches).
      - name: Docs
        run: python3 scripts/docs-check.py --strict

  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # `emit` tests compile Apple targets and invoke Apple's `libtool`.
        # Add Linux once the archive helper supports GNU toolchains.
        os: [macos-latest]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true # images, the app icon among them
      # The compiler rust-toolchain.toml pins, with clippy; see the script.
      - name: Install Rust
        run: scripts/ci/install-rust.sh clippy
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      # Style lints the workspace doesn't follow: guest-shaped code keeps wide
      # signatures, tuple results and index loops that mirror the original.
      - run: >-
          cargo clippy --workspace --all-targets -- -D warnings
          -A clippy::type_complexity -A clippy::too_many_arguments
          -A clippy::needless_range_loop -A clippy::identity_op
          -A clippy::chunks_exact_to_as_chunks -A clippy::manual_is_multiple_of
          -A clippy::large_enum_variant -A clippy::collapsible_if
      - run: cargo test --workspace --no-fail-fast
