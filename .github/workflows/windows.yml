name: Windows desktop

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: ""

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true # images, the app icon among them
      # The pinned compiler, and the job pinned to it, so rustup never
      # installs rust-toolchain.toml's clippy and rustfmt on top.
      - name: Install Rust
        shell: pwsh
        run: |
          $channel = (Select-String -Path rust-toolchain.toml -Pattern '^channel\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          rustup toolchain install $channel --profile minimal --target x86_64-pc-windows-msvc
          "RUSTUP_TOOLCHAIN=$channel" >> $env:GITHUB_ENV
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        with:
          arch: x64
      - name: Install LLVM 22
        shell: pwsh
        run: |
          $bin = "$env:ProgramFiles\LLVM\bin"
          if (!(Test-Path "$bin\clang.exe") -or ((& "$bin\clang.exe" --version)[0] -notmatch 'clang version 22\.')) {
            $url = 'https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-win64.exe'
            $installer = "$env:RUNNER_TEMP\llvm.exe"
            curl.exe -fLsS --retry 3 $url -o $installer
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $result = Start-Process $installer -ArgumentList '/S' -Wait -PassThru
            if ($result.ExitCode) { exit $result.ExitCode }
          }
          & "$bin\clang.exe" --version
          $bin >> $env:GITHUB_PATH
      - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        with:
          cache-on-failure: true
      - name: Check workspace and tests
        run: cargo check --locked --workspace --tests --keep-going
      - name: Run synthetic unit tests
        run: cargo test --locked -p ir -p runtime -p asf -p xiso -p snapshot --lib
      - name: Verify input mapping and audio mixing
        run: cargo test --locked -p input -p audio --lib
      - name: Check the guest C ABI
        run: cargo test --locked -p runtime --test layout
      - name: Check local agent connections
        run: cargo test --locked -p agent --test socket --test tcp
      - name: Exercise host fault dispatch
        run: cargo test --locked -p hostfault
      - name: Compare the Cranelift and C tiers
        run: cargo test --locked -p clif --test differential
      - name: Compile and load a generated DLL
        run: cargo test --locked -p emit --test windows -- --nocapture
      - name: Prepare and load both desktop tiers
        run: cargo test --locked -p recomp --features desktop-runtime --lib windows_play_prepares_and_loads_both_tiers
      - name: Link and start h2.exe
        run: cargo run --locked -p cli -- settings list
