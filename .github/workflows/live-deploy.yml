name: Live deploy

# Deploys the Live Worker, the web and the dedicated host image to
# production on each push to master (docs/live/live-worker.md, "Deploy from
# CI"). The host image holds public code only: this job builds the Linux h2
# (deploy/host/build.sh --h2, glibc 2.36 through cargo-zigbuild) and
# deploy.sh pushes the image by content tag. The game module compiled from
# the owner's disc never comes near CI: hosts take it from the private
# host-data bundle (docs/live/dedicated-host-build.md#the-game-module).
# Skips until the CLOUDFLARE_API_TOKEN secret is set.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      H2_WORKER_HOME: ${{ github.workspace }}/.worker-home
      RUSTC_WRAPPER: ""
    steps:
      - name: Skip without a Cloudflare token
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN is not set; nothing deployed"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          lfs: true # web/public/art
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        if: env.CLOUDFLARE_API_TOKEN != ''
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          path: .worker-home
          key: worker-home-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: worker-home-
      # The Linux host: Rust from rust-toolchain.toml with the glibc target,
      # and cargo-zigbuild with Zig, the same tools build.sh uses on a Mac.
      - name: Install Rust, Zig and cargo-zigbuild for the Linux host
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          channel=$(awk -F'"' '/^channel/ { print $2 }' rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --target x86_64-unknown-linux-gnu
          # Pin the job to that toolchain, so rustup never installs
          # rust-toolchain.toml's clippy and rustfmt here: on the runner that
          # install collides with the image's own cargo-fmt.
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install --quiet cargo-zigbuild==0.24.1 ziglang==0.17.1
          printf '#!/bin/sh\nexec "%s" -m ziglang "$@"\n' "$RUNNER_TEMP/zig/bin/python3" > "$RUNNER_TEMP/zig/bin/zig"
          chmod +x "$RUNNER_TEMP/zig/bin/zig"
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          shared-key: live-host
          cache-on-failure: true
      - name: Stage the Linux h2
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: deploy/host/build.sh --h2
      - name: Deploy production
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: crates/live/live-worker/deploy.sh production --yes-production
