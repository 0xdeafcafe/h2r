# The crate domains (docs/dev/crate-structure.md).
#
# A domain is a directory: crates/<domain>/<crate>. `uses` is the full list
# of other domains its crates may depend on; a domain always may use itself.
# `scripts/crate-graph.py layers --check` enforces it on normal and build
# dependencies (dev-dependencies are free).
#
# `crates` places every crate, including ones that have not landed yet.
# Once a crate sits in a domain directory the directory is the truth, and
# this list is checked against it.

[formats]
about = "Disc, tag and file formats, ours and the game's: plain data, no guest, no host"
uses = []
crates = [
    "asf", "content", "firefight", "font", "forge-doc", "game-markers", "h1-contract", "host-dirs", "host-log", "hs", "map", "pogo",
    "mopp", "movies", "pathfind", "rules", "settings", "shaders", "tags", "variants", "xbe", "xiso",
]

[recompiler]
about = "XBE to host code: analysis, lifting, IR, the C and Cranelift back ends, their oracles"
uses = ["formats"]
crates = [
    "analyze", "clif", "emit", "hostfault", "ir", "lift", "opt", "oracle",
    "sim-tier", "simd", "sse-oracle", "symbols", "x87",
]

[runtime]
about = "The machine the lifted code runs on: memory, CPU state, kernel, filesystem, snapshots, the build-and-load driver"
uses = ["formats", "recompiler"]
crates = [
    "background", "kernel", "lifted", "mem-watch", "recomp", "runtime", "runtime-test-probe",
    "snapshot", "timeline", "vfs",
]
# Guest-free: no workspace dependencies, no guest memory. `background`
# names and lowers worker threads; `timeline` records trace events;
# `mem-watch` counts footprint (serde, backtrace, libc only). Any
# guest-free crate may use them.
guest_free = ["background", "mem-watch", "timeline"]

[platform]
about = "Platform HLE: the Xbox's devices and libraries on the host (Direct3D 8, DirectSound, XAPI, pads, Bink, voice) and the host graphics and audio under them"
uses = ["formats", "runtime"]
crates = [
    "assets", "audio", "bink-hle", "d3d", "dsound", "frame-types", "gfx", "hot-render",
    "input", "sound-clips", "voice", "wma", "xapi",
]

[hooking]
about = "How our code meets guest code: the hook engine, named points, typed guest layouts, switches"
uses = ["formats", "runtime"]
crates = ["guest-layout", "hooks", "switches"]

[rewrites]
about = "Rust that replaces a guest subsystem: the native simulation, FrameScene, the native renderer, ported engine functions, and the bridge that installs each one"
uses = ["formats", "recompiler", "runtime", "platform", "hooking"]
crates = [
    "engine", "frame-scene", "hud-kit-core", "native-render", "render-bridge",
    "scene-extract", "sim-anim", "sim-bridge", "sim-collision", "sim-core", "sim-effects", "sim-ext", "sim-objects", "sim-script", "sim-sound",
    "sim-state",
]
# Guest-free: these take typed values and may use only `formats`,
# `platform` and each other (in any domain). No guest memory, no hook, no
# lifted code. `scene-extract` is not: it is the one render crate that
# reads guest offsets, through `engine`, to fill a FrameScene.
guest_free = ["frame-scene", "hud-kit-core", "native-render", "sim-anim", "sim-collision", "sim-core", "sim-ext", "sim-script"]

[live]
about = "Live, co-op transport, bots, films, cloud saves, the dedicated host's data, the service itself (another session owns this domain)"
uses = ["formats", "runtime", "platform", "hooking", "rewrites"]
crates = [
    "actor-net", "bots", "cloud-saves", "coop", "film", "host-data", "live-hle", "live-proto", "show-lan",
    "live-server", "live-telemetry", "live-worker", "sim-bench",
]

[extensions]
about = "Features we add to the game: menus and settings screens, skulls, the campaign picker, Halo 1 in game, Live and bots in game, theater, the agent API, the debug menu"
uses = ["formats", "runtime", "platform", "hooking", "rewrites", "live"]
crates = [
    "agent", "agent-proto", "bot-glue", "debug-menu", "game", "h1-runtime",
    "hot-tags", "lockstep", "net-glue", "theater", "ui-kit",
]
# Crates here that the Live owner's session owns.
live_owned = ["bot-glue", "net-glue", "theater"]

[tools]
about = "Offline work on game data: the Halo 1 converters, the editor cores, the profiler; and xtask, the workspace's test runner"
uses = ["formats", "recompiler", "runtime", "platform", "rewrites", "live"]
crates = [
    "editor-core", "firefight-kit", "forge-build", "geometry-edit", "h1-assets", "h1campaign",
    "h1convert", "h1map", "h1objects", "hopper-edit", "hud-edit", "hud-kit", "live-art", "mesh-edit",
    "perf",
    "scenario-edit", "xtask",
]
live_owned = ["live-art"]

[apps]
about = "What links a binary: the composition root, the desktop shell, the command line and its command crates, the editor, the embedded hosts"
uses = ["formats", "recompiler", "runtime", "platform", "hooking", "rewrites", "live", "extensions", "tools"]
crates = [
    "app", "app-icon", "boot", "cli", "cli-common", "cmd", "cmd-dev",
    "cmd-drive", "cmd-h1", "cmd-host", "cmd-live", "cmd-play", "cmd-recomp",
    "cmd-tags", "h2-tools", "h2host", "live-mirror", "studio", "studio-proto", "uwp-host",
]
live_owned = ["cmd-drive", "cmd-live"]

# A dependency the rules refuse and the tree still has. Each names the step
# that removes it; `layers --check` fails on a refused dependency that is
# not listed, and on an entry whose dependency is gone.

[[exception]]
from = "native-render"
to = "scene-extract"
until = "the guest readers native-render re-exports (src/camera.rs, the `layout` modules in src/lib.rs, decorators_load.rs, object_streams.rs) are reached from render-bridge or scene-extract instead (docs/graphics/framescene.md, slices 3 to 6)"

[[exception]]
from = "sim-core"
to = "simd"
until = "simd's exact SSE lanes move to a guest-free crate sim-core may use"

[[exception]]
from = "sim-anim"
to = "simd"
until = "simd's exact SSE lanes move to a guest-free crate sim-anim may use (manager_channels.rs's masked scalar ops)"

[[exception]]
from = "game"
to = "hud-edit"
until = "hud-edit's render module (Art, Fonts, sprite_at: the map's bitmaps and the disc's fonts) moves to a crate extensions may use; hud_overlay.rs and hud_overlay/menu_text.rs read them behind the `gpu` feature"

[[exception]]
from = "game"
to = "perf"
until = "the sampler is a hook boot installs: sampling.rs reaches the profiler behind `perf`, and agent_glue answers profile.sample.* with it"

[[exception]]
from = "workspace"
to = "game"
until = "the screen document parser, layout resolver and tag generator can be shared without constructing a game UI sample (docs/editor/studio-redesign.md, PK5)"

[[exception]]
from = "host-data"
to = "firefight-kit"
until = "a host bundle's Firefight kits are built by `h2 host bundle` in cli and handed to host-data as bytes: bundle/kits.rs calls firefight_kit::build_package behind the `firefight` feature"
