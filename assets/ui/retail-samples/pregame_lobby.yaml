# The pregame lobby as the leader of a four-player party sees it
# (docs/game/ui-builder.md "Retail screens in a believable state").
# Every name, number and option here is made up; a `string:` names one of
# the screen's own strings, read from the disc when the picture is drawn.
screen: ui\screens\game_shell\pregame_lobby\pregame_lobby

tokens:
  e416: Kestrel            # the party leader
  e425: "4"                # players in the party
  e40a: Team Skirmish      # the game variant
  e408: Glasshouse         # the map
  e41f: SYSTEM LINK        # the network the party is on
  e426: Low Orbit          # the campaign level (pane 1)
  e427: Hold the relay station until the dropships return.
  e43a: Weekend Doubles    # the matchmaking playlist (pane 2)
  e43b: Two teams of two on the small maps.

# The leader's legend.
footer: { string: button_key_squad_leader_teams_disabled }

cells:
  - text: Kestrel
    blocks:
      ui\screens\game_shell\pregame_lobby\item_background: { tint: [176, 44, 40] }
      ui\list_skins\profile_picker2\item_background: { tint: [176, 44, 40] }
      ui\global_bitmaps\rank_icons_sm: { image: 14 }
  - text: Marlow
    blocks:
      ui\screens\game_shell\pregame_lobby\item_background: { tint: [176, 44, 40] }
      ui\list_skins\profile_picker2\item_background: { tint: [176, 44, 40] }
      ui\global_bitmaps\rank_icons_sm: { image: 9 }
  - text: Quillon
    blocks:
      ui\screens\game_shell\pregame_lobby\item_background: { tint: [44, 84, 176] }
      ui\list_skins\profile_picker2\item_background: { tint: [44, 84, 176] }
      ui\global_bitmaps\rank_icons_sm: { image: 21 }
  - text: Ibis
    blocks:
      ui\screens\game_shell\pregame_lobby\item_background: { tint: [44, 84, 176] }
      ui\list_skins\profile_picker2\item_background: { tint: [44, 84, 176] }
      ui\global_bitmaps\rank_icons_sm: { image: 4 }

panes:
  # A custom game.
  0:
    blocks:
      # The leader has the two buttons; everyone else has this line in
      # their place.
      party_leader: { hide: true }
      # The status line: the tag's own string is for a party with no
      # session.
      game_cant_start_no_session: { string: game_start_when_you_get_off_your_ass }
      # Shown once a game has been played.
      view_postgame: { hide: true }
      # The variant's quick options, one per line.
      text.4: { text: "Score to Win: 50" }
      text.5: { text: "Time Limit: 12 Minutes" }
      text.6: { text: "Team Play: On" }
      # One per player slot, lit while that player talks.
      ui\screens\game_shell\pregame_lobby\speaker: { hide: true }
  # Co-op.
  1:
    blocks:
      party_leader: { hide: true }
      game_cant_start_no_session: { string: game_start_when_you_get_off_your_ass }
      view_postgame: { hide: true }
      ui\screens\game_shell\pregame_lobby\speaker: { hide: true }
  # Matchmaking.
  2:
    blocks:
      party_leader: { hide: true }
      game_cant_start_no_session: { string: game_start_when_you_get_off_your_ass }
      view_postgame: { hide: true }
      ui\screens\game_shell\pregame_lobby\speaker: { hide: true }
