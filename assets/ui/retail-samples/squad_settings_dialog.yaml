# Game Setup, opened from a custom game's lobby with the first row
# focused (docs/game/ui-builder.md "Retail screens in a believable
# state"). The tag has the frame, the panel and its texts; the game's code
# adds the rows. A `string:` names one of the screen's own strings, read
# from the disc when the picture is drawn.
screen: ui\screens\game_shell\pregame_lobby\squad_settings_dialog

# The lobby is still drawn under the dialog.
over: ui\screens\game_shell\pregame_lobby\pregame_lobby

tokens:
  e41f: SYSTEM LINK        # the network the party is on
  e408: Glasshouse         # the map

footer: { string: key_offline }

panes:
  0:
    blocks:
      # The panel under the map's name. The tag's bitmap is another
      # screen's art; the game puts the focused row's picture here (the
      # map's for Change Map). The map's name is made up, so the picture
      # is another map's.
      ui\screens\game_shell\xbox_live\xbox_live_main_menu\xbox_live: { level: lockout }
    lists:
      0:
        focus: 0
        rows:
          - { string: change_map }
          - { string: change_variant }
          - { string: quick_options }
          - { string: switch_to_coop }
          - { string: switch_to_playlist }
