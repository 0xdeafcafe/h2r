[package]
name = "forge-build"
description = "Deterministic local Forge map materialisation over the user's Halo 2 maps"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
# Block-out definitions as tags, the dev set and what each costs.
content-kit = { path = "../content-kit" }
content.workspace = true
firefight-kit = { path = "../firefight-kit" }
forge-doc.workspace = true
# The areas record a built map carries.
game-markers = { path = "../../formats/game-markers" }
# The block-out definitions and the starter set.
forge-shapes = { path = "../../formats/forge-shapes" }
map.workspace = true
scenario-edit = { path = "../scenario-edit" }
tags.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The invented map the block-out pieces build on.
content-kit = { path = "../content-kit", features = ["fixture"] }
# The bots' teleporter reader, to check a link is one the generator pairs.
bots = { path = "../../live/bots" }
firefight-kit = { path = "../firefight-kit", features = ["testkit"] }

[lints]
workspace = true
