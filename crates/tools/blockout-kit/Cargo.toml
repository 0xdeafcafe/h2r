[package]
name = "blockout-kit"
description = "Forge block-out pieces as tags: a definition's crate, model, render model with cut-out dev plates, collision BSP and fixed physics body, the dev textures as bitmaps and shaders, and what each costs"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[package.metadata.h2]
doc = ["game/forge-blockout.md"]
status = "in progress"

[dependencies]
anyhow.workspace = true
# The definitions, their shells and hulls.
forge-shapes = { path = "../../formats/forge-shapes" }
# The dev tiles, the font atlas and the plate layout.
dev-texture = { path = "../../formats/dev-texture" }
# The collision BSP compiled from the shell, and its acceptance check.
collision-build = { path = "../collision-build" }
# The render model writer (h1-assets), the shader templates and the
# global materials (h1convert), the hlmt and phmo writers (h1objects).
h1-assets = { path = "../h1-assets" }
h1convert = { path = "../h1convert" }
h1map = { path = "../h1map" }
h1objects = { path = "../h1objects" }
# A mip chain boxed down and the DXT5 tag layout, as the pogo stick's atlas
# and the stage's textures are written.
content-kit = { path = "../content-kit" }
map.workspace = true
# The structure BSPs' drawn parts, for the palette survey.
scenario-edit = { path = "../scenario-edit", default-features = false }
tags.workspace = true

[features]
# The invented multiplayer map (`blockout_kit::fixture`) for other crates' tests.
fixture = []

[lints]
workspace = true
