# Open ground under the sun with dynamic shadow casters of different
# sizes ahead of a spawn: a vehicle and a row of weapons.
# docs/game/test-maps.md
name = "shadow-rig"
title = "Shadow rig"
purpose = "Open ground under the base's sun with a vehicle and weapons ahead of the spawn: dynamic object shadows on terrain, at several sizes."
base = "coagulation"
fidelity = "approximate"
note = "The sun and the ground are the base map's; no light or receiver geometry is added. Casters are what the map's palettes and tag index hold."
clear = "all"

[[place]]
block = "starting_locations"

[[place]]
block = "netgame_equipment"
at = [8, 0, 0]
facing = 45
each = { group = "vehi", contains = ["warthog"], max = 1 }

[[place]]
block = "netgame_equipment"
at = [4, -3, 0]
step = [0, 1.5, 0]
each = { group = "weap", contains = ['weapons\'], exclude = ['\multiplayer\'], max = 5 }
