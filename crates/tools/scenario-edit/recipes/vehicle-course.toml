# One of every vehicle the base map's tag index names, in a row seven
# units apart ahead of a single spawn, on the base's open ground.
# docs/game/test-maps.md
name = "vehicle-course"
title = "Vehicle course"
purpose = "One of every vehicle the map has, side by side on open ground ahead of the spawn: entering, seats, driving and vehicle physics."
base = "coagulation"
fidelity = "approximate"
note = "The course is the base map's own terrain: no ramps, gates or checkpoints are added, since placement edits can't make geometry."
clear = "all"

[[place]]
block = "starting_locations"

[[place]]
block = "netgame_equipment"
at = [12, -14, 0]
step = [0, 7, 0]
each = { group = "vehi" }
