[package]
name = "scenario-edit"
description = "Sapien-style scenario placement editor: typed scnr placement blocks, undoable edits written as patched .map files, a UI-free session and an offscreen wgpu viewport"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
map.workspace = true
assets.workspace = true
content.workspace = true
# The game type markers' shapes, palette and areas (src/marker_view.rs).
game-markers = { path = "../../formats/game-markers" }
tags.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
# Test-map recipes (recipe.rs, recipes/*.toml).
toml = { workspace = true }
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
xiso.workspace = true
# The native renderer's world path: an instance's own lightmap coordinates
# (the lightmap group's buckets) and a pass's blend from its render states.
native-render = { path = "../../rewrites/native-render" }
# The native world's upload ring (native_view.rs) and the tests' wgpu
# instance, with the backends per host (gfx::GpuHost).
gfx = { path = "../../platform/gfx", default-features = false, features = ["gpu"] }
# The Halo 2 `sky ` reader: the sky's lights and fog for the viewport.
h1-assets = { path = "../h1-assets" }
# The layered test map's invented pixel and vertex shaders (fixture.rs).
shaders = { path = "../../formats/shaders" }

[dev-dependencies]
pollster = "1"

[lints]
workspace = true
