[package]
name = "viewer"
description = "Render-model (mode) viewer: decodes model geometry from a disc map and draws it with gfx"
edition.workspace = true
version.workspace = true
license.workspace = true
default-run = "viewer"

[dependencies]
map.workspace = true
tags.workspace = true
shaders = { path = "../../formats/shaders" }
scenario-edit = { path = "../scenario-edit" }
h1-assets = { path = "../h1-assets" }
xiso.workspace = true
# Installed mods: their packages resolved to the patched map (disc.rs).
content.workspace = true
gfx = { path = "../../platform/gfx" }
anyhow.workspace = true
assets.workspace = true
wgpu = "30"
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
winit = "0.30"
