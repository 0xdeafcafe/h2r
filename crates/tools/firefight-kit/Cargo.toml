[package]
name = "firefight-kit"
description = "Offline Firefight map kit"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
bots = { path = "../../live/bots" }
content.workspace = true
# The kit version the game and session data share.
firefight = { path = "../../formats/firefight" }
h1-assets = { path = "../h1-assets" }
h1campaign = { path = "../h1campaign" }
h1convert = { path = "../h1convert" }
content-kit = { path = "../content-kit" }
hs.workspace = true
libm = "0.2"
map.workspace = true
pathfind = { path = "../../formats/pathfind" }
scenario-edit = { path = "../scenario-edit", default-features = false }
serde.workspace = true
tags.workspace = true

[features]
# `testkit`: an invented map the kit builds on, for other crates' tests
# (host data's kit bundle, the server-map strip).
testkit = []

[lints]
workspace = true

[dev-dependencies]
# The disc-tier tests read the maps off the disc.
vfs.workspace = true
