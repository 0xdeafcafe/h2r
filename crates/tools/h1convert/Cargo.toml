[package]
name = "h1convert"
edition.workspace = true
version.workspace = true
license.workspace = true
# The test files build as one binary, tests/it.rs (docs/dev/build-speed.md).
autotests = false

[dependencies]
# The package manifest of a converted map.
content.workspace = true
h1map = { path = "../h1map" }
# The structure's lightmap pages, converted to a Halo 2 bitmap.
h1-assets = { path = "../h1-assets" }
# The level's own sky.
# The map list's names and descriptions (ui.map).
# The sound gestalt, rebuilt for a fresh map.
# The names the game's Halo 1 hooks read back (docs/dev/crate-structure.md).
h1-contract.workspace = true
map.workspace = true
# The structure's Havok MOPP code.
mopp = { path = "../../formats/mopp" }
tags.workspace = true
thiserror.workspace = true
# Writing placements into the base scenario. Without its egui panel.
scenario-edit = { path = "../scenario-edit", default-features = false }

# NV2A pixel programs for rebuilt scopes and terrain.
shaders = { path = "../../formats/shaders" }

[dev-dependencies]
# Converted maps' bitmaps decoded against the base's (tests/disc_maps.rs).
assets.workspace = true
xiso.workspace = true
# The player representation reader, checked in the retail XBE (tests/h2_globals.rs).
xbe.workspace = true
iced-x86 = { version = "1", default-features = false, features = ["std", "decoder"] }

[[test]]
name = "it"
path = "tests/it.rs"
