[package]
name = "stage-kit"
description = "The content stage: Studio's test map of ours, its layout, geometry, collision and textures built from art/stage (docs/editor/content-stage.md)"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[package.metadata.h2]
doc = ["editor/content-stage.md"]
status = "in progress"

[dependencies]
# The layout (art/stage/stage.yaml) and its report form.
serde.workspace = true
serde_yaml_ng.workspace = true
# The stage's collision BSP, compiled from the same faces it draws.
collision-build = { path = "../collision-build" }
tags.workspace = true
thiserror.workspace = true
# The map: the structure writer, shaders, MOPP, the fresh keep lists and
# the sound gestalt cut (h1convert), the bitmaps (h1-assets, h1map,
# content-kit), the tag set and builder (map), the package (content).
map.workspace = true
h1convert = { path = "../h1convert" }
h1-assets = { path = "../h1-assets" }
h1map = { path = "../h1map" }
content-kit = { path = "../content-kit" }
# The lightmap page's Xbox swizzle.
gfx = { path = "../../platform/gfx" }
content.workspace = true
# The `fresh` adapter: `workspace::Fresh` over `map::build`, so the stage is
# a package's `map` item (src/fresh.rs).
workspace = { path = "../workspace" }
# The project file and the build report.
toml.workspace = true
serde_json.workspace = true

[dev-dependencies]
# The built map read back as the scenario editor reads it.
scenario-edit = { path = "../scenario-edit", default-features = false }
# tests/disc.rs: the base map from the owner's disc.
xiso.workspace = true

[lints]
workspace = true
