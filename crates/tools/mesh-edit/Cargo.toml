[package]
name = "mesh-edit"
description = "The modeling kernel of h2-editor: a radial-edge mesh in index arenas, selection, MeshOp operations as values, import and stable export (docs/editor/modeling.md)"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[package.metadata.h2]
doc = ["editor/modeling.md"]
status = "in progress"

# No crate of the workspace: the kernel knows nothing of Halo formats.
# `serde` makes `MeshOp` a value the op log, `doc.diff` and agents carry.
[dependencies]
serde.workspace = true

[dev-dependencies]
serde_json.workspace = true
