[package]
name = "editor-core"
description = "UI-free parts of h2-editor shared by its tools: map sources, the snapshot undo stack, status messages, where game variants come from"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
map.workspace = true
tags.workspace = true
xiso.workspace = true
xbe.workspace = true
# The runtime's default data root (variant saves live under it).
content.workspace = true
variants = { path = "../../formats/variants" }
# Halo 1 maps, read-only, and converted packages' manifests read as plain TOML.
h1map = { path = "../h1map" }
# Halo 1 base maps and lightmap pages for the viewport.
h1-assets = { path = "../h1-assets" }
toml = "0.9"
