[package]
name = "workspace"
description = "The package build: the builder registry, Layered tag sources and the build of a package set onto a map's TagSet (docs/editor/studio-redesign.md, \"Packages\")"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[package.metadata.h2]
doc = ["editor/studio-redesign.md", "editor/tag-workspace.md"]
status = "in progress"

[dependencies]
# Manifest, lock, PackageId and the set's order (PK1), Sha256 and canonical JSON.
content.workspace = true
# The tag set the build changes.
map.workspace = true
# Tag definitions (`defs`), the loose tag sources (`repo`), the relocator
# and the bitmap writer.
tags.workspace = true
serde.workspace = true
serde_json.workspace = true
# The `tag` and `edits` item files.
serde_yaml_ng.workspace = true
# The `bitmap` builder's input.
png = { workspace = true }
thiserror.workspace = true
# The `hud` builder reads a HUD kit YAML (`hud_kit_core::data`).
hud-kit-core.workspace = true
# `PackageRewrite` is the VFS's rewrite of the game's maps.
vfs.workspace = true
# The `model` builder: the primitive YAML's mesh, the atlas and the tags a
# look is built into.
pogo-kit = { path = "../pogo-kit" }

[dev-dependencies]
# An invented multiplayer map and the kit built on it (PK4's test).
pogo-kit = { path = "../pogo-kit", features = ["fixture"] }

[lints]
workspace = true
