[package]
name = "h1campaign"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
# The campaign manifest a converted level is listed in.
content.workspace = true
engine = { path = "../../rewrites/engine" }
h1map = { path = "../h1map" }
# Structure BSP, collision, lightmap and shader choice, shared with the
# multiplayer converter.
h1convert = { path = "../h1convert" }
h1-assets = { path = "../h1-assets" }
h1objects = { path = "../h1objects" }
map.workspace = true
tags.workspace = true
# Generated AI pathfinding for each converted structure BSP.
pathfind = { path = "../../formats/pathfind" }
mopp = { path = "../../formats/mopp" }
hs.workspace = true
# Halo 1's and Halo 2's builtin tables, for the scripts layer.
xbe.workspace = true
# The base's shader templates, for the shader choice; without its egui panel.
scenario-edit = { path = "../scenario-edit", default-features = false }
thiserror.workspace = true
h1-contract.workspace = true
xiso.workspace = true

[dev-dependencies]

[[test]]
name = "ai_convert"
path = "tests/ai/convert.rs"

[[test]]
name = "ai_disc"
path = "tests/ai/disc.rs"

[[test]]
name = "scripts_conversations_disc"
path = "tests/scripts/conversations_disc.rs"

[[test]]
name = "scripts_disc"
path = "tests/scripts/disc.rs"

[[test]]
name = "scripts_survey"
path = "tests/scripts/survey.rs"
