[package]
name = "h1objects"
edition.workspace = true
version.workspace = true
license.workspace = true
# The test files build as one binary, tests/it.rs (docs/dev/build-speed.md).
autotests = false

[dependencies]
h1map = { path = "../h1map" }
# Converted render models and animation graphs.
h1models = { path = "../h1models" }
# The collision BSP narrowing copy, shared with the structure.
h1convert = { path = "../h1convert" }
# Halo 1's own bitmaps on the converted models' shaders.
h1bitmaps = { path = "../h1bitmaps" }
# Halo 1 sounds and looping sounds the converted effects and attachments play.
h1sounds = { path = "../h1sounds" }
map.workspace = true
# The Halo 2 collision BSP form, and the object decoders the proof reads back through.
tags.workspace = true
# Havok MOPP code over converted collision BSPs (the bsp-physics slots).
mopp = { path = "../../formats/mopp" }
thiserror.workspace = true

[dev-dependencies]
xiso.workspace = true
# The Halo 1 sandbox proof (tests/sandbox_disc.rs): the converted map's
# source hash and its netgame equipment read back.
content.workspace = true
scenario-edit = { path = "../scenario-edit", default-features = false }
# The motion sensor's alpha-scaled copy decoded back from the built map.
assets.workspace = true
# Halo 2's motion sensor table read from the disc's XBE.
xbe.workspace = true
# The built-in game variants' starting weapons (tests/sandbox_disc.rs).
variants = { path = "../../formats/variants" }
# Halo 2's HUD text font measured against Halo 1's digits (tests/hud_layout_disc.rs).
font = { path = "../../formats/font" }

[[test]]
name = "it"
path = "tests/it.rs"
