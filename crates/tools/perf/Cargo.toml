[package]
name = "perf"
description = "Performance tooling: guest-aware sampling profiler, timeline capture, benchmark harness"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
mem-watch.workspace = true
timeline = { path = "../../runtime/timeline" }
runtime.workspace = true
kernel = { path = "../../runtime/kernel" }
gfx = { path = "../../platform/gfx" }
emit.workspace = true
lift.workspace = true
ir.workspace = true
anyhow.workspace = true
libloading = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
# Host-PC symbolization: per-image symbol and DWARF line tables, macOS
# debug maps (images are found with dladdr, so late-loaded dylibs resolve).
addr2line = { version = "0.27", default-features = false, features = ["loader"] }
rustc-demangle = "0.1"
# Assembling the synthetic guest loops of the hot-loop benchmarks.
iced-x86 = { version = "1", default-features = false, features = ["std", "decoder", "code_asm"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[lints]
workspace = true
