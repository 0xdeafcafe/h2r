[package]
name = "gfx"
description = "Direct3D 8 (Xbox flavour) replacement on wgpu: texture decoding, state model, presenter"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
# `serde`: pipeline keys are persisted (d3d::pipeline_store).
wgpu = { version = "30", features = ["serde"] }
bytemuck = "1"
# Borrowed pipeline entries avoid cloning keys and hashing twice on hits.
hashbrown = { version = "0.17", default-features = false, features = ["default-hasher", "inline-more"] }
# Pipeline and program keys are persisted (d3d::pipeline_store).
serde = { version = "1", features = ["derive"] }
pollster = "1"
thiserror.workspace = true
# Pipeline-creation spans (docs/perf/perf.md); no dependencies of its own.
timeline = { path = "../timeline" }

[dev-dependencies]
winit = "0.30"
anyhow.workspace = true

[[example]]
name = "window"
path = "examples/window.rs"
