# The Live server as a Cloudflare Worker (docs/live/live-worker.md, and
# "Deploy" there for the runbook). Deploy with deploy.sh beside this file,
# never with a bare `wrangler deploy`:
#
#   ./deploy.sh staging                       h2-live-staging on workers.dev
#   ./deploy.sh cutover --yes-production      h2-live, live.forbes.red's id, no route yet
#   ./deploy.sh production --yes-production   h2-live with the live.forbes.red route
#
# Each environment is its own Worker with its own Durable Objects (so its
# own log), bucket and secret. `vars`, `r2_buckets` and `durable_objects`
# are not inherited by an environment, so each lists its own; the build,
# assets and migrations below are shared.
#
# The top level is for local runs only (smoke/run.sh writes its own config).
# Its name is not production's, so a bare `wrangler deploy` can't replace it.
name = "h2-live-local"
main = "build/index.js"
compatibility_date = "2026-11-01"

# No [build]: deploy.sh builds (the wasm with a toolchain of its own, and
# the web), so wrangler deploys what it built.

# Settings (crates/live-worker/src/settings.rs). H2_LIVE_SERVER_KEY is a
# secret in every environment (`wrangler secret put H2_LIVE_SERVER_KEY
# --env <env>`, which deploy.sh does when it is missing).
[vars]
H2_LIVE_ID = "live.example.net"

[[r2_buckets]]
binding = "BLOBS"
bucket_name = "h2-live-blobs-local"

# The hub keeps the event log in its own SQLite storage.
[durable_objects]
bindings = [
    { name = "LIVE_HUB", class_name = "LiveHub" },
    # One per co-op session: its relay (src/relay.rs).
    { name = "COOP_RELAY", class_name = "CoopRelay" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveHub"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["CoopRelay"]

# The web app (web/dist, `bun run build` in web/), served by Cloudflare
# ahead of the Worker: any path that is not a file is index.html (the app
# routes in the browser). The API, discovery, the health check and the
# game art go to the Worker first; so do the app's pages, which the Worker
# answers with index.html (read through ASSETS) carrying the page's link
# preview (live_server::page_meta; keep this list to its `is_page`).
# Cache rules: web/public/_headers.
[assets]
directory = "../../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
    "/v1/*", "/.well-known/*", "/healthz", "/art/game", "/art/game/*",
    "/", "/dash", "/dash/*", "/stats", "/stats/*", "/players", "/players/*",
    "/games", "/games/*", "/events", "/events/*", "/signin", "/signin/*",
]

# ---- staging: a server of its own, never confused with production ----
# A fresh id (no account, game or token from production is valid here) and
# a fresh key, which deploy.sh makes the first time.
[env.staging]
name = "h2-live-staging"
workers_dev = true

[env.staging.vars]
H2_LIVE_ID = "live-staging.forbes.red"
# Discovery's `url`. deploy.sh sets it to the workers.dev address when
# H2_LIVE_PUBLIC_URL is in its environment; otherwise https://<id>.
H2_LIVE_INVITE_ONLY = "1"
H2_LIVE_ADMINS = "afr"
# Published game art (`h2 live assets publish`), shared with production:
H2_LIVE_GAME_ART_URL = "https://live-art.forbes.red/art/4e353d2808245b6a"

[[env.staging.r2_buckets]]
binding = "BLOBS"
bucket_name = "h2-live-blobs-staging"

[env.staging.durable_objects]
bindings = [
    { name = "LIVE_HUB", class_name = "LiveHub" },
    { name = "COOP_RELAY", class_name = "CoopRelay" },
]

# Workers Logs and traces (docs/live/live-worker.md, "Observability").
[env.staging.observability]
enabled = true
head_sampling_rate = 1
[env.staging.observability.logs]
enabled = true
invocation_logs = true
[env.staging.observability.traces]
enabled = true
head_sampling_rate = 1

# ---- production: live.forbes.red ----
# The id is the one the machine's server has (its discovery document,
# https://live.forbes.red/.well-known/h2live.json), so every account's
# author id stays the same; the key is that server's server.key. Two
# environments deploy this one Worker, `h2-live`: `cutover` without the
# route (reachable on workers.dev only, to copy the log into), then
# `production` with it. Keep their settings the same.
[env.cutover]
name = "h2-live"
workers_dev = true

[env.cutover.vars]
H2_LIVE_ID = "live.forbes.red"
H2_LIVE_PUBLIC_URL = "https://live.forbes.red"
H2_LIVE_INVITE_ONLY = "1"
H2_LIVE_ADMINS = "afr"
H2_LIVE_GAME_ART_URL = "https://live-art.forbes.red/art/4e353d2808245b6a"

[[env.cutover.r2_buckets]]
binding = "BLOBS"
bucket_name = "h2-live-blobs"

[env.cutover.durable_objects]
bindings = [
    { name = "LIVE_HUB", class_name = "LiveHub" },
    { name = "COOP_RELAY", class_name = "CoopRelay" },
]

# Workers Logs and traces (docs/live/live-worker.md, "Observability").
[env.cutover.observability]
enabled = true
head_sampling_rate = 1
[env.cutover.observability.logs]
enabled = true
invocation_logs = true
[env.cutover.observability.traces]
enabled = true
head_sampling_rate = 1

[env.production]
name = "h2-live"
workers_dev = true
# The proxied live.forbes.red record (today the tunnel's) stays; the route
# puts the Worker in front of it. Removing the route is the rollback.
routes = [{ pattern = "live.forbes.red/*", zone_name = "forbes.red" }]

[env.production.vars]
H2_LIVE_ID = "live.forbes.red"
H2_LIVE_PUBLIC_URL = "https://live.forbes.red"
H2_LIVE_INVITE_ONLY = "1"
H2_LIVE_ADMINS = "afr"
H2_LIVE_GAME_ART_URL = "https://live-art.forbes.red/art/4e353d2808245b6a"

[[env.production.r2_buckets]]
binding = "BLOBS"
bucket_name = "h2-live-blobs"

[env.production.durable_objects]
bindings = [
    { name = "LIVE_HUB", class_name = "LiveHub" },
    { name = "COOP_RELAY", class_name = "CoopRelay" },
]

# Workers Logs and traces (docs/live/live-worker.md, "Observability").
[env.production.observability]
enabled = true
head_sampling_rate = 1
[env.production.observability.logs]
enabled = true
invocation_logs = true
[env.production.observability.traces]
enabled = true
head_sampling_rate = 0.1
