[package]
name = "live-server"
description = "The Xbox Live replacement service: signed events on SQLite or Postgres behind axum (docs/live/live.md, docs/live/live-api.md)"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
live-proto.workspace = true
# MapId, manifests and hashing for the content store (docs/game/maps.md §5).
content.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "sqlite", "runtime-tokio", "json", "macros"] }
# Blobs (content, cloud saves, game art) on the local disk or an S3-compatible
# bucket such as Cloudflare R2 (docs/live/live-hosting.md, "Free hosting").
# `aws-base` + `ring` rather than `aws`: the S3 client signs with ring and
# speaks TLS through rustls on ring, as the rest of the server does, so
# aws-lc (a large C build) stays out of the image.
object_store = { version = "0.14", default-features = false, features = ["fs", "aws-base", "reqwest", "ring"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
bytes = "1"
futures-util = "0.3"
mime_guess = "2"
percent-encoding = "2"
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.3"
time = "0.3"
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
# tests/relay.rs: two co-op peers through the relay.
coop = { path = "../coop" }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = "0.26"
base64 = "0.22"
# examples/fake_game.rs
ureq = { version = "2", default-features = false, features = ["json"] }
tungstenite = "0.26"
# tests/s3_server.rs: a real S3 protocol server (s3s, backed by a directory)
# for the blob store, in process.
s3s = "0.17"
s3s-fs = "0.17"
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
