[package]
name = "studio"
description = "h2-editor: the editor suite on Dear ImGui (docking) + wgpu + winit: scenario placements, game variants, playlists"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false
default-run = "h2-editor"

[[bin]]
name = "h2-editor"
path = "src/main.rs"

[dependencies]
mem-watch = { workspace = true, features = ["gpu"] }
# test-engine: the item hooks the headless screenshots aim input with.
dear-imgui-rs = { version = "0.22", features = ["test-engine"] }
dear-imgui-wgpu = "0.22"
dear-imgui-winit = "0.22"
dear-imguizmo = { version = "0.22", default-features = false }
wgpu = "30"
# The wgpu instance, with the backends per host (gfx::GpuHost).
gfx = { path = "../../platform/gfx", default-features = false, features = ["gpu"] }
winit = "0.30"
pollster = "1"
png = { workspace = true }
anyhow.workspace = true
# The Dock icon for the unbundled editor (art/app-icon).
app-icon = { path = "../app-icon" }
rfd = "0.18"
content.workspace = true
# The browser's package set (src/app/assets.rs): `GameSet`, edit files.
workspace = { path = "../../tools/workspace" }
editor-core = { path = "../../tools/editor-core" }
scenario-edit = { path = "../../tools/scenario-edit" }
starter-map = { path = "../../tools/starter-map" }
# The Modeling tool's targets, undo and in-place writes (docs/editor/modeling.md).
geometry-edit = { path = "../../tools/geometry-edit" }
# The Textures tool's canvas, brush, fill and PNG in and out (docs/editor/modeling.md).
bitmap-edit = { path = "../../tools/bitmap-edit" }
# The HUD tool's logic (docs/editor/hud-editor.md).
hud-edit = { path = "../../tools/hud-edit" }
# The HUD kit's checks over our kit HUDs (check.run; docs/game/hud-kit.md).
hud-kit = { path = "../../tools/hud-kit" }
# model.* on a map with the Pogo Stick's kit added as the game serves it
# (api/models.rs). `boot` already depends on it.
content-kit = { path = "../../tools/content-kit" }
# The content stage's subject pad (src/app/subject.rs; docs/editor/live-editors.md).
stage-kit = { path = "../../tools/stage-kit" }
variants = { path = "../../formats/variants" }
# The game type script editor: the language intelligence (`rules::ide`),
# the check report and the compiler (src/app/rules_edit.rs).
rules.workspace = true
hopper-edit = { path = "../../tools/hopper-edit" }
live-proto.workspace = true
# Convert to Halo 2: the Halo 1 converter, over Halo 1 and Halo 2 maps.
h1convert = { path = "../../tools/h1convert" }
# The Halo 1 sandbox's objects.
h1objects = { path = "../../tools/h1objects" }
h1map = { path = "../../tools/h1map" }
# The converted map card's PNG.
assets.workspace = true
map.workspace = true
# Sound audition (src/app/audition.rs): the ADPCM decoder, the host output
# (cpal, through the audio crate's DeviceSink) and the WMA decoder, whose
# tables come from the user's own default.xbe.
audio = { path = "../../platform/audio" }
wma = { path = "../../platform/wma" }
sound-clips = { path = "../../platform/sound-clips" }
# The tag editor's field registry (schema structure + definition names),
# and the tags tree the workspace keeps (src/app/workspace.rs).
tags.workspace = true
# Sparse animation documents and edit history (docs/editor/studio-redesign.md).
anim-edit.workspace = true
# Waveform edits and the permutation list of a package sound (api/sound_edit.rs).
sound-edit.workspace = true
# The tag workspace's disc images (src/app/workspace.rs).
xiso.workspace = true
# The Scripts tool: the scenario's script tables, decompiled with the
# source's own default.xbe (docs/editor/rich-editors.md, "Scripts").
hs.workspace = true
xbe.workspace = true
# The UI Screens tool: our game screens' pages, preview and checks
# (boot::ui_kit; docs/game/ui-builder.md).
boot.workspace = true
# The Navigation layers (src/app/bot_nav.rs): the bots' nav cache files,
# their builder, their spot files and the superbounce formats. `boot`
# already depends on both, so they add no crate to the build.
bots = { path = "../../live/bots" }
superbounce = { path = "../../live/superbounce" }
# Playtest's runner (src/app/playtest.rs): the match and batch files, the
# spatial traces and their measures.
sim-bench = { path = "../../live/sim-bench" }
# The Map Pack's content directory (`T:\$c`) on the host.
vfs.workspace = true
serde_json.workspace = true
# Playtest's static checks (src/app/playtest_static.rs): the start gate's
# census of the open scenario (docs/game/rules-start-gate.md).
forge-doc.workspace = true
# blockout.render and blockout.describe: a definition's shell, its render
# mesh with the dev plates and the dev rasters they are drawn from
# (api/blockout.rs; docs/game/forge-blockout.md).
forge-shapes = { path = "../../formats/forge-shapes" }
dev-texture = { path = "../../formats/dev-texture" }
blockout-kit = { path = "../../tools/blockout-kit" }
# The map variants on this machine a game variant may suggest
# (`forge::files::variants::suggestable`; src/api/variants.rs).
forge.workspace = true
# AI ground built over the open map (src/app/ground.rs): GM1's build.
firefight-kit = { path = "../../tools/firefight-kit" }
# The announcer voice: Fish Audio's text to speech over HTTPS (src/voice/fish.rs).
ureq = { version = "2", default-features = false, features = ["tls"] }

# Play and pair (src/play.rs): the agent API's wire types and client.
agent-proto = { path = "../../extensions/agent-proto" }
live-mirror = { path = "../live-mirror" }
guest-layout = { path = "../../hooking/guest-layout" }
ab_glyph = "0.2"
# The agent API (src/api): method names, short forms and the client.
studio-proto = { path = "../studio-proto" }

[target.'cfg(unix)'.dependencies]
# Check the lifetime of a discovered game after a deliberate Unpair.
libc = { workspace = true }

[dev-dependencies]
# ground.*'s tests build on the kit's invented court (api/tests/ground_tests.rs).
firefight-kit = { path = "../../tools/firefight-kit", features = ["testkit"] }
# The HUD tool's tests draw the invented HUD map.
hud-edit = { path = "../../tools/hud-edit", features = ["fixture"] }
# model.*'s tests put the kit into the kit's invented map.
content-kit = { path = "../../tools/content-kit", features = ["fixture"] }
# anim.*'s tests build the invented two-bone model and its graph with the
# Halo 1 converter's writers (api/anim/tests.rs).
h1-assets = { path = "../../tools/h1-assets" }
# The agent's real server behind an invented game (src/play/tests.rs).
agent = { path = "../../extensions/agent" }
# Invented script tables and an invented executable for the Scripts tool.
hs = { workspace = true, features = ["fixture"] }

[lints]
workspace = true
