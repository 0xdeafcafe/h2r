[package]
name = "boot"
description = "The composition root: a built module run on the runtime with the kernel HLE, the hooks and every feature attached"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
game = { path = "../../extensions/game", default-features = false }
# Build and load (docs/dev/crate-structure.md, S4).
recomp = { path = "../../runtime/recomp" }
h1-runtime = { path = "../../extensions/h1-runtime" }
# The native renderer's and the native simulation's guest halves
# (docs/dev/crate-structure.md, S3).
render-bridge = { path = "../../rewrites/render-bridge", default-features = false }
sim-bridge = { path = "../../rewrites/sim-bridge" }
film = { path = "../../live/film" }
rustc-hash = { workspace = true }
xbe.workspace = true
xiso.workspace = true
analyze.workspace = true
emit.workspace = true
runtime.workspace = true
kernel.workspace = true
vfs.workspace = true
# Map packages under <data>/maps (docs/game/maps.md).
content.workspace = true
# The controller-speaker sound index reads the player's map files (pad_speaker).
tags.workspace = true
hs.workspace = true
# The pogo stick's models, added to each multiplayer map as it is served.
content-kit = { path = "../../tools/content-kit" }
# The game's content packages and their one rewrite (packages.rs).
workspace = { path = "../../tools/workspace" }
# The stage, a baked package's `fresh` map (packages::prepare_maps).
stage-kit = { path = "../../tools/stage-kit" }
coop = { path = "../../live/coop" }
map.workspace = true
# What the Halo 1 converters write and the Halo 1 hooks read (h1_*.rs);
# no converter crate.
h1-contract.workspace = true
# Our settings (setting_defs, the ui model).
settings = { path = "../../formats/settings" }
hooks = { path = "../../hooking/hooks", default-features = false }
guest-layout = { path = "../../hooking/guest-layout", features = ["runtime-glue"] }
toml = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
font = { path = "../../formats/font" }
# Our added game variant choices (variant_options, docs/game/game-options.md).
variants = { path = "../../formats/variants" }
anyhow.workspace = true
libloading = { workspace = true }
gfx = { path = "../../platform/gfx", default-features = false }
png = { workspace = true }
# The native post's A/B readback (native_post_glue).
wgpu = { version = "30", optional = true }
# New maps' list previews from mainmenu.map's level pictures (new_maps).
assets = { path = "../../platform/assets" }
native-render = { path = "../../rewrites/native-render", optional = true }
# The frame step's scene (docs/graphics/framescene.md); pure, no GPU.
frame-scene = { path = "../../rewrites/frame-scene" }
shaders = { path = "../../formats/shaders", optional = true }
serde.workspace = true
dsound = { path = "../../platform/dsound", default-features = false }
# Voice chat's media objects (voice_glue); devices come from the host.
voice = { workspace = true, optional = true }
audio = { path = "../../platform/audio", default-features = false }
bink-hle = { path = "../../platform/bink-hle", default-features = false }
# Where `h2 movies` installs (movies_glue).
movies = { workspace = true, optional = true }
xapi = { path = "../../platform/xapi" }
live-hle = { path = "../../live/live-hle" }
live-telemetry = { path = "../../live/live-telemetry" }
live-proto.workspace = true
input = { path = "../../platform/input", default-features = false }
# Phantom bots (docs/game/bots.md).
bots = { path = "../../live/bots" }
# Sim mode's match, tuning and report files (docs/runtime/sim.md).
sim-bench = { path = "../../live/sim-bench" }
iced-x86 = { version = "1", default-features = false, features = ["std", "decoder", "instr_info"] }
timeline = { path = "../../runtime/timeline" }
# The determinism harness (H2_LOCKSTEP, H2_INPUT_RECORD, H2_INPUT_REPLAY).
lockstep = { path = "../../extensions/lockstep" }
# Machine snapshots: feature sections' codec (docs/runtime/snapshots.md).
snapshot = { path = "../../runtime/snapshot" }
# The agent API (H2_AGENT; docs/runtime/agent-api.md).
agent = { path = "../../extensions/agent", default-features = false }
agent-proto = { path = "../../extensions/agent-proto" }
# Our debug menu (debug_menu_glue.rs, docs/runtime/debug-menu.md).
debug-menu = { path = "../../extensions/debug-menu" }
# Hot iteration on the agent (src/hot_glue.rs, docs/graphics/hot-iteration.md).
hot-render = { path = "../../platform/hot-render", optional = true }
hot-tags = { path = "../../extensions/hot-tags" }
# The agent glue's host methods (input.pad, profile.sample.*).
serde_json.workspace = true
# `H2_PERF_FROM`: a profiler/timeline session over part of a run.
perf = { path = "../../tools/perf", optional = true }
# The Forge session's trait for that builder, and the document it builds over.
forge.workspace = true
forge-doc.workspace = true
# Test-map recipes built into packages (test_maps_recipes.rs).
scenario-edit = { path = "../../tools/scenario-edit", optional = true }
firefight-kit = { path = "../../tools/firefight-kit", optional = true }
# The AI ground builder Forge's rows run (ground_builder.rs).
forge-build = { path = "../../tools/forge-build", optional = true }
# The nav generator Forge's Generate nav row runs (nav_builder.rs).
forge-nav = { path = "../../tools/forge-nav", optional = true }

[features]
default = ["gpu", "movie-playback", "local-io", "test-maps", "rules"]
desktop-runtime = ["render-bridge/native-render", "recomp/desktop-runtime", "game/desktop-runtime"]
gpu = ["desktop-runtime", "gfx/gpu", "agent/render-overrides", "dep:wgpu", "dep:native-render", "dep:shaders", "dep:hot-render", "game/gpu"]
movie-playback = ["desktop-runtime", "bink-hle/playback", "dep:movies", "game/movie-playback"]
local-io = ["desktop-runtime", "dep:voice", "dsound/playback", "game/local-io"]
perf = ["dep:perf", "game/perf"]
# maps.test.* on the agent: test maps built from recipes (test_maps.rs,
# docs/game/test-maps.md). The scenario editor's crate pulls in wgpu.
test-maps = ["game/test-maps", "dep:scenario-edit", "dep:firefight-kit", "dep:forge-build", "dep:forge-nav"]
# The rules host runtime (docs/game/rules-engine.md); on at run time
# unless H2_FEATURES=-rules.
rules = ["game/rules"]

[dev-dependencies]
# The fixture generated module, for hooks run through the real Runner.
runtime-test-probe = { path = "../../runtime/runtime/test-probe" }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[[example]]
name = "menu_cpu"
required-features = ["gpu"]

[lints]
workspace = true
