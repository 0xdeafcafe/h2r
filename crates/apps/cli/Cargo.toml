[package]
name = "cli"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "h2"
path = "src/main.rs"
required-features = ["host"]

[dependencies]
mem-watch.workspace = true
film = { path = "../../live/film" }
# The disc and output helpers h2-tools shares (docs/runtime/cli-tools.md).
cli-common = { path = "../cli-common", optional = true }
# The default data root (`content::store::default_data_root`).
content.workspace = true
# The app data, cache and config directories (coop, Live, lab, follow).
host-dirs.workspace = true
hs = { workspace = true, optional = true }
tags = { workspace = true, optional = true }
shaders = { path = "../../formats/shaders", optional = true }
font = { path = "../../formats/font", optional = true }
assets = { workspace = true, optional = true }
map = { workspace = true, optional = true }
xiso = { workspace = true, optional = true }
# Halo 1 maps and disc (`h2 h1`, `h2 import halo1`).
h1map = { path = "../../tools/h1map", optional = true }
# Halo 1 multiplayer maps converted (`h2 h1 convert`).
h1convert = { path = "../../tools/h1convert", optional = true }
# `h2 lighting split`: the solver's shadow mask uses the state tables (CPU only).
gfx = { path = "../../platform/gfx", default-features = false, optional = true }
scenario-edit = { path = "../../tools/scenario-edit", optional = true }
# The built-in Firefight kits build themselves at start (firefight_kits.rs).
firefight-kit = { path = "../../tools/firefight-kit", optional = true }
content-kit = { path = "../../tools/content-kit", optional = true }
# `h2 flood-pod`: Firefight's Flood pod put into a map to look at.
forge = { workspace = true, optional = true }
# `h2 live maps census`: the start gate's census of a map file.
forge-doc = { workspace = true, optional = true }
# Halo 1 campaign levels converted (`h2 h1 convert <iso> a30`).
h1campaign = { path = "../../tools/h1campaign", optional = true }
h1-assets = { path = "../../tools/h1-assets", optional = true }
# Halo 1 objects for the Halo 1 sandbox (`h2 h1 convert --sandbox h1`).
h1objects = { path = "../../tools/h1objects", optional = true }
movies = { workspace = true, optional = true }
xbe = { workspace = true, optional = true }
analyze = { workspace = true, optional = true }
symbols = { workspace = true, optional = true }
lift = { workspace = true, optional = true }
emit = { workspace = true, optional = true }
ir = { workspace = true, optional = true }
anyhow.workspace = true
# The heap profiler behind the `dhat-heap` feature (docs/perf/profiling.md).
# Not optional, so the Buck rules always have it; unused without the feature.
dhat = "0.3.3"
sha2 = { workspace = true, optional = true }
boot = { path = "../boot", default-features = false }
# `h2 package prepare`: the convert items of the game's packages, run with
# the Halo 1 and Map Pack converters (docs/editor/studio-redesign.md).
workspace = { path = "../../tools/workspace" }
# The headless host only places bundled Firefight kits; the desktop build's
# `h2 host bundle` builds them (`host-data/firefight`).
host-data = { path = "../../live/host-data", default-features = false }
# Bots for sim runs and `h2 bots nav` (docs/game/bots.md).
bots = { path = "../../live/bots" }
# h2 sim: match, batch and report files, the comparison (docs/runtime/sim.md).
sim-bench = { path = "../../live/sim-bench" }
# `h2 agent` and `h2 serve` (docs/runtime/agent-api.md).
agent-proto = { path = "../../extensions/agent-proto" }
# `h2 agent frame compare`: render.compare run locally, with no game.
agent = { path = "../../extensions/agent", default-features = false }
# h2 studio: the editor's agent API client (docs/editor/agent-api.md).
studio-proto = { path = "../studio-proto", optional = true }
# Scripts in Live's map details and `h2 play --watch` (docs/game/rules-engine.md).
rules.workspace = true
# Our settings (play --set, h2 settings).
settings = { path = "../../formats/settings" }
timeline = { path = "../../runtime/timeline" }
app = { path = "../app", optional = true }
debug-menu = { path = "../../extensions/debug-menu", optional = true }
lockstep = { path = "../../extensions/lockstep", optional = true }
kernel = { workspace = true, optional = true }
input = { path = "../../platform/input", default-features = false, optional = true }
# The controller-speaker settings and side output (play_cmd).
dsound = { path = "../../platform/dsound", optional = true }
audio = { path = "../../platform/audio", optional = true }
# Voice chat's microphone and output (boot::voice_glue).
voice = { workspace = true, features = ["device"], optional = true }
vfs.workspace = true
iced-x86 = { version = "1", default-features = false, features = ["std", "decoder", "intel"], optional = true }
asf = { path = "../../formats/asf", optional = true }
wma = { path = "../../platform/wma", optional = true }
sound-clips = { path = "../../platform/sound-clips", optional = true }
live-hle = { path = "../../live/live-hle", optional = true }
live-proto.workspace = true
live-server.workspace = true
# Cloud saves while signed in to Live (docs/live/live-cloud-saves.md).
cloud-saves = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
# Sim configuration and `h2 live maps import` read TOML.
toml = { workspace = true }
# map.glb's surface pictures are JPEG where opaque (live_looks.rs).
image = { version = "0.25", default-features = false, features = ["jpeg"], optional = true }
# map.glb.gz beside map.glb, for the art server to send compressed.
flate2 = { version = "1", optional = true }
# `h2 live account/motd` talk to the service over HTTP or HTTPS.
ureq = { version = "2", default-features = false, features = ["tls"] }
# `h2 live q events --follow` reads the event stream.
tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
# `h2 play --watch` watches the checkout: FSEvents on macOS, inotify on
# Linux (docs/runtime/app.md, "Watching the checkout").
notify = { version = "9", default-features = false, features = ["macos_fsevent"], optional = true }
# `h2 profile` and `h2 bench` (docs/perf/profiling.md): off by default so ordinary
# builds skip the profiler's dependencies. `cargo run -p cli --features perf`.
perf = { path = "../../tools/perf", optional = true }

[dev-dependencies]
time = "0.3"
# live_geometry tests: an independent glTF reader for map.glb, and PNG
# decoding for the disc check's contact sheet.
gltf = { version = "1", default-features = false, features = ["names"] }
png = { workspace = true }
# `strip_keeps_squads_and_sectors`: a kit map to strip.
firefight-kit = { path = "../../tools/firefight-kit", features = ["testkit"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
# Paired LAN lab connections (TLS 1.3 and HMAC).
ring = { version = "0.17", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
subtle = { version = "2", optional = true }
# Enable runtime-detected ARM SHA instructions for full-image cache
# validation. sha2-asm has no MSVC build; Windows uses the portable code.
sha2 = { workspace = true, features = ["asm"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSAppleEventDescriptor", "NSAppleEventManager", "NSNotification", "NSString"], optional = true }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSAlert", "NSResponder"], optional = true }

[features]
default = ["desktop"]
# The runtime commands, agent client, simulation and dedicated-host entry point.
host = ["boot/rules"]
# dhat as the global allocator; writes dhat-heap.json when `h2` returns
# from `main` (`-c build_mode.dhat=true` under Buck).
dhat-heap = []
# The windowed client and authoring, import and diagnostic commands.
desktop = [
    "host",
    "boot/gpu",
    "boot/movie-playback",
    "boot/local-io",
    "boot/test-maps",
    "dep:cli-common",
    "dep:hs",
    "dep:tags",
    "dep:shaders",
    "dep:font",
    "dep:assets",
    "dep:map",
    "dep:xiso",
    "dep:h1map",
    "dep:h1convert",
    "dep:scenario-edit",
    "dep:firefight-kit",
    "host-data/firefight",
    "dep:content-kit",
    "dep:forge",
    "dep:forge-doc",
    "dep:gfx",
    "dep:h1campaign",
    "dep:h1-assets",
    "dep:h1objects",
    "dep:movies",
    "dep:xbe",
    "dep:analyze",
    "dep:symbols",
    "dep:lift",
    "dep:emit",
    "dep:ir",
    "dep:studio-proto",
    "dep:app",
    "dep:objc2",
    "dep:objc2-foundation",
    "dep:objc2-app-kit",
    "dep:debug-menu",
    "dep:lockstep",
    "dep:kernel",
    "dep:input",
    "dep:dsound",
    "dep:audio",
    "dep:voice",
    "dep:iced-x86",
    "dep:asf",
    "dep:wma",
    "dep:sound-clips",
    "dep:cloud-saves",
    "dep:image",
    "dep:flate2",
    "dep:notify",
    "dep:live-hle",
    "dep:sha2",
    "dep:ring",
    "dep:rustls",
    "dep:subtle",
]
perf = ["desktop", "dep:perf", "boot/perf"]

[[test]]
name = "emit_options"
required-features = ["desktop"]

[[test]]
name = "guard"
required-features = ["desktop"]

[[test]]
name = "lab"
required-features = ["desktop"]

[lints]
workspace = true
