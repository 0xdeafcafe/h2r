[package]
name = "uwp-host"
description = "The Xbox (UWP, Dev Mode) app: a CoreApplication view that runs the game into a composition swap chain, and the Mac-side packaging helpers (AppxManifest, package identity, the app-container API check)"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
# The app's executable (AppxManifest's Executable). On anything but Windows
# it only says so.
name = "h2uwp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
sha2 = { workspace = true }

[dev-dependencies]
# Decoding the package images (platform/xbox/Assets) in the manifest tests.
png = { workspace = true }

# The app itself: Windows only, so the Mac tests stay light.
[target.'cfg(windows)'.dependencies]
# With the sampling profiler (profile.sample.* over the agent API;
# docs/runtime/xbox.md, "Profiling on the console").
h2host = { path = "../h2host", features = ["perf"] }
# gilrs, whose Windows backend is Windows.Gaming.Input (the UWP pad API).
app = { path = "../app", default-features = false, features = ["gamepads"] }
vfs.workspace = true
gfx = { path = "../../platform/gfx" }
windows-core = "0.62"
windows-numerics = "0.3"
windows = { version = "0.62", features = [
    "ApplicationModel",
    "ApplicationModel_Activation",
    "ApplicationModel_Core",
    "Foundation",
    "Graphics_Display",
    "Storage",
    "Storage_Search",
    "UI_Composition",
    "UI_Core",
    "UI_ViewManagement",
    "Win32_System_WinRT_Composition",
    "Win32_Foundation",
    "Win32_System_Console",
] }

[lints]
workspace = true
