[package]
name = "feature"
description = "The feature registry: named points, ordered hook chains, conflicts at plan time, switches, a guest arena, and the frame and game bridges (docs/engine/feature-engine.md)"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = ["native-render"]
native-render = ["dep:native-render"]

[dependencies]
runtime.workspace = true
tags.workspace = true
engine = { path = "../engine", features = ["runtime-glue"] }
timeline = { path = "../timeline" }
# Shadow checks of the sim ports against the lifted original (shadow.rs).
lifted = { path = "../lifted" }
# The world skip and camera read (pure: no GPU, no map reader).
native-render = { path = "../native-render", default-features = false, optional = true }

[dev-dependencies]
runtime-test-probe = { path = "../runtime/test-probe" }
