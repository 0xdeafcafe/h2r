[package]
name = "live-telemetry"
description = "Non-invasive Halo 2 guest-state telemetry and live ingest"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
runtime.workspace = true
feature = { path = "../feature" }
engine = { path = "../engine", features = ["runtime-glue"] }
live-proto.workspace = true
map.workspace = true
# Animation names (jmad) for frames' `anim`.
tags.workspace = true
serde.workspace = true
serde_json.workspace = true
time = "0.3"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
runtime-test-probe = { path = "../runtime/test-probe" }
live-server = { path = "../live-server" }
