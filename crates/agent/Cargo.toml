[package]
name = "agent"
description = "The agent API server: a Unix socket in the game process, answered at tick boundaries (docs/runtime/agent-api.md)"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
agent-proto = { path = "../agent-proto" }
serde.workspace = true
serde_json.workspace = true
runtime.workspace = true
feature = { path = "../feature" }
engine = { path = "../engine", features = ["runtime-glue"] }
live-telemetry = { path = "../live-telemetry" }
timeline = { path = "../timeline" }
xapi = { path = "../xapi" }
input = { path = "../input", default-features = false }
# Hot iteration: live tag edits and render overrides (src/hot.rs).
hot-render = { path = "../hot-render" }
hot-tags = { path = "../hot-tags" }

[dev-dependencies]
live-proto.workspace = true
# Synthetic tags laid out by their definitions (src/hot/tests.rs).
tags.workspace = true
map.workspace = true
