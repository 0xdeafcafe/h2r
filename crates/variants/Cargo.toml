[package]
name = "variants"
description = "Halo 2 game variants: the 0x130-byte record, the settings schema, saved-variant files and the editor panel (docs/editor/variants.md)"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[features]
# The egui panel (`VariantEditor::ui`), for h2-editor. h2-studio builds
# without it.
default = ["egui"]
egui = ["dep:egui"]

[dependencies]
egui = { workspace = true, optional = true }
map.workspace = true
tags.workspace = true
xbe.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The runtime's default data root, shared with `h2 play`.
content.workspace = true

[dev-dependencies]
xiso = { path = "../xiso" }
iced-x86 = { version = "1", default-features = false, features = ["std", "decoder", "instr_info"] }
