[package]
name = "engine"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Hand-written Rust replacements for Halo 2 engine functions, over guest memory"

[dependencies]
# Field names for the accessors `record!` generates (src/view.rs).
paste = "1"
mopp = { path = "../mopp", optional = true }
# For src/light_constants.rs: the original's SSE and x87 arithmetic, bit
# for bit.
simd.workspace = true
x87.workspace = true
# For src/runtime_glue.rs (feature `runtime-glue`): registration of the
# adapters with the runtime's dispatch table.
runtime = { workspace = true, optional = true }
# For tests/differential.rs only.
analyze = { workspace = true, optional = true }
xbe = { workspace = true, optional = true }
ir = { workspace = true, optional = true }
lift = { workspace = true, optional = true }

[features]
runtime-glue = ["dep:runtime", "dep:mopp"]
# Seeded differential test against the lifted original (tests/differential.rs).
differential = ["runtime-glue", "dep:analyze", "dep:xbe", "dep:ir", "dep:lift"]
