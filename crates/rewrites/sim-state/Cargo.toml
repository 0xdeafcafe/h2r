[package]
name = "sim-state"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Typed, read-only views of the simulation for theater, stats, Live and the agent API (docs/engine/sim-rewrite-objects.md section 8)"

[dependencies]
# The layouts and the `Mem` trait the views read through.
guest-layout = { path = "../../hooking/guest-layout" }
# The objects pool: live-slot scan, handle resolution, child links.
sim-objects.workspace = true
# The players pool the player and first-person views read.
sim-players.workspace = true

[dev-dependencies]
sim-objects = { workspace = true, features = ["synth"] }

[lints]
workspace = true
