[package]
name = "sim-bridge"
description = "The guest side of the native simulation: adapters from hook entries to the sim crates, the installs under impl.sim.native, the tick driver (docs/engine/sim-rewrite.md)"
edition.workspace = true
version.workspace = true
license.workspace = true

[package.metadata.h2]
status = "in progress"

[features]
default = ["native-render"]
native-render = ["dep:native-render", "dep:frame-scene", "dep:scene-extract"]

[dependencies]
hooks = { path = "../../hooking/hooks" }
runtime.workspace = true
tags.workspace = true
engine = { path = "../engine", features = ["runtime-glue"] }
timeline = { path = "../../runtime/timeline" }
# Shadow checks of the sim ports against the lifted original (shadow.rs).
lifted = { path = "../../runtime/lifted" }
# The world skip and camera read (pure: no GPU, no map reader).
native-render = { path = "../native-render", default-features = false, optional = true }
# The frame step's scene (docs/graphics/framescene.md).
frame-scene = { path = "../frame-scene", optional = true }
scene-extract = { path = "../scene-extract", optional = true }

[dev-dependencies]
runtime-test-probe = { path = "../../runtime/runtime/test-probe" }
