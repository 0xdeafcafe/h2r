[package]
name = "sim-bridge"
description = "The guest side of the native simulation: adapters from hook entries to the sim crates, the installs under impl.sim.native, the tick driver, the shadow checks (docs/engine/sim-rewrite.md)"
edition.workspace = true
version.workspace = true
license.workspace = true

[package.metadata.h2]
status = "in progress"
doc = ["engine/sim-rewrite.md", "engine/shadow-exec.md"]

[dependencies]
hs.workspace = true
sim-core = { workspace = true, features = ["override"] }
simd.workspace = true
hooks = { path = "../../hooking/hooks" }
runtime.workspace = true
# The ports the installs place (engine::sim_native, engine::sim_physics).
engine = { path = "../engine", features = ["runtime-glue"] }
guest-layout = { path = "../../hooking/guest-layout" }
# Shadow checks of the sim ports against the lifted original (shadow.rs).
lifted = { path = "../../runtime/lifted" }
# The extension records the checkpoint hooks move (sim_ext.rs).
sim-ext.workspace = true
# The Havok heap the World holds as its physics store (world.rs).
sim-havok.workspace = true
# The object table the World holds (world.rs).
sim-objects.workspace = true
# The sound table and the host feed trait (sim_sound/entries.rs).
sim-sound.workspace = true
# The World that holds the sound table and is the snapshot section (world.rs).
sim-world.workspace = true
# The effect part split, damage chain and visual events (sim_effects_parts.rs).
sim-effects.workspace = true
# The guest's x87 state the coln and decal draws run on (sim_effects_parts.rs).
x87.workspace = true
# The host mixer the sound events feed (sim_sound/mixer_feed.rs).
audio = { path = "../../platform/audio", default-features = false }
# The clips the mixer feed plays, by the map's tag id (sim_sound/mixer_feed.rs).
sound-clips = { path = "../../platform/sound-clips" }
map.workspace = true

[dev-dependencies]
hs = { workspace = true, features = ["fixture"] }
ir.workspace = true

[lints]
workspace = true
