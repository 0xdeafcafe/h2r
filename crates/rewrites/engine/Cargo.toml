[package]
name = "engine"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Hand-written Rust replacements for Halo 2 engine functions, over guest memory"
# The test files build as one binary, tests/it.rs (docs/dev/build-speed.md).
autotests = false

[dependencies]
# Guest structure layouts, the globals table, the guest boundary and the
# named points; src/lib.rs re-exports the modules.
guest-layout = { path = "../../hooking/guest-layout" }
mopp = { path = "../../formats/mopp", optional = true }
# For src/light_constants.rs: the original's SSE and x87 arithmetic, bit
# for bit.
simd.workspace = true
x87.workspace = true
# The native simulation subsystems (docs/engine/sim-rewrite.md): float
# rules and host lanes, and animation sampling behind src/sim_anim.rs.
sim-core.workspace = true
sim-havok.workspace = true
sim-anim.workspace = true
# The collision world behind src/sim_collision (phase 2).
sim-collision.workspace = true
# The object update's kernels and views behind src/sim_objects (phase 3:
# docs/engine/sim-rewrite-objects.md).
sim-objects.workspace = true
# The effects phase's walk behind src/effects_phase.rs (docs/engine/effects-parts.md).
sim-effects.workspace = true
# For src/runtime_glue.rs (feature `runtime-glue`): registration of the
# adapters with the runtime's dispatch table.
runtime = { workspace = true, optional = true }
# For tests/differential.rs only.
analyze = { workspace = true, optional = true }
xbe = { workspace = true, optional = true }
ir = { workspace = true, optional = true }
lift = { workspace = true, optional = true }
# For tests/sim_tier_differential.rs: the reference and sim tiers.
emit = { workspace = true, optional = true }
# The shared lifted original (image fixture, register conversion,
# stepping) the differential tests run against.
lifted = { path = "../../runtime/lifted", optional = true }
# Owner-disc sweeps for the animation and collision differential oracles.
tags = { workspace = true, optional = true }
map = { workspace = true, optional = true }
xiso = { workspace = true, optional = true }
# For tests/variant_record_differential.rs: the record model the native
# clean-up and protocol answers come from.
variants = { path = "../../formats/variants", optional = true }

[features]
runtime-glue = ["dep:runtime", "dep:mopp", "guest-layout/runtime-glue"]
# Seeded differential test against the lifted original (tests/differential.rs).
differential = ["runtime-glue", "dep:analyze", "dep:xbe", "dep:ir", "dep:lift", "sim-core/override", "sim-collision/synth", "dep:tags", "dep:map", "dep:xiso", "dep:emit", "dep:lifted", "dep:variants"]

[dev-dependencies]
# Synthetic BSPs for the native adapter tests.
sim-collision = { workspace = true, features = ["synth"] }
# `lanes::with` for the unit tests that compare host lanes and the scalar loop.
sim-core = { workspace = true, features = ["override"] }

[[test]]
name = "it"
path = "tests/it.rs"

# Its own binary: it flips the marker kernel's process-global switch on,
# which `sim_native_differential`'s stubbed marker cases need off.
[[test]]
name = "marker_differential"
path = "tests/marker_differential.rs"

[lints]
workspace = true
