[package]
name = "sim-objects"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "The object update in Rust: typed views over the object pool, the definition table and the object kernels (docs/engine/sim-rewrite-objects.md)"

[dependencies]
# The object, header and unit layouts and the `Mem` trait views read
# through: offsets live there, once (docs/engine/guest-layout.md).
guest-layout = { path = "../../hooking/guest-layout" }
# Float rules, lanes and the epoch derived state is keyed by.
sim-core.workspace = true
# The slot pool, section kinds and save format the object table is held in.
sim-world.workspace = true

[features]
# `synth`: synthetic object pools and definition tags in guest form, for
# the tests here and in the readers built on this crate. No game data.
synth = []

[lints]
workspace = true
