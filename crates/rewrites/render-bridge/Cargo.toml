[package]
name = "render-bridge"
description = "The guest side of the native renderer: the frame step, its stage hooks, the guest D3D entries and the frame wait (docs/graphics/framescene.md)"
edition.workspace = true
version.workspace = true
license.workspace = true

[package.metadata.h2]
status = "in progress"
doc = ["graphics/native-renderer.md", "graphics/framescene.md"]

[features]
default = ["native-render"]
native-render = ["dep:native-render", "dep:frame-scene", "dep:scene-extract", "dep:sim-bridge"]

[dependencies]
hooks = { path = "../../hooking/hooks" }
# The one widescreen rule (docs/graphics/high-resolution.md).
canvas-fit = { path = "../../platform/canvas-fit" }
runtime.workspace = true
tags.workspace = true
engine = { path = "../engine", features = ["runtime-glue"] }
guest-layout = { path = "../../hooking/guest-layout" }
timeline = { path = "../../runtime/timeline" }
# The world skip and camera read (pure: no GPU, no map reader).
native-render = { path = "../native-render", default-features = false, optional = true }
# The frame step's scene (docs/graphics/framescene.md).
frame-scene = { path = "../frame-scene", optional = true }
scene-extract = { path = "../scene-extract", optional = true }
# The targets' roles.
frame-types = { path = "../../platform/frame-types" }
# The sim's visual effect parts, put in each scene (docs/engine/effects-parts.md).
sim-effects.workspace = true
# The fog effect's exact SSE and x87 (src/fog_effect.rs).
simd.workspace = true
x87.workspace = true
# The object and player tables scene extraction reads one way (docs/engine/engine-design.md R-12).
sim-bridge = { path = "../sim-bridge", optional = true }
sim-objects.workspace = true
sim-players.workspace = true

[dev-dependencies]
runtime-test-probe = { path = "../../runtime/runtime/test-probe" }

[lints]
workspace = true
