[package]
name = "render-bridge"
description = "The guest side of the native renderer until FrameScene replaces it: the stage hooks, admissions and the frame step's scene (docs/graphics/framescene.md)"
edition.workspace = true
version.workspace = true
license.workspace = true

[package.metadata.h2]
status = "in progress"
doc = ["graphics/native-renderer.md", "graphics/framescene.md"]

[features]
default = ["native-render"]
native-render = ["dep:native-render", "dep:frame-scene", "dep:scene-extract"]

[dependencies]
hooks = { path = "../../hooking/hooks" }
# The one widescreen rule (docs/graphics/high-resolution.md).
canvas-fit = { path = "../../platform/canvas-fit" }
runtime.workspace = true
tags.workspace = true
engine = { path = "../engine", features = ["runtime-glue"] }
timeline = { path = "../../runtime/timeline" }
# The world skip and camera read (pure: no GPU, no map reader).
native-render = { path = "../native-render", default-features = false, optional = true }
# The frame step's scene (docs/graphics/framescene.md).
frame-scene = { path = "../frame-scene", optional = true }
scene-extract = { path = "../scene-extract", optional = true }
# The targets' roles the device makes them by (docs/graphics/retire-d3d-display.md).
frame-types = { path = "../../platform/frame-types" }
# The sim's visual effect parts, put in each scene (docs/engine/effects-parts.md).
sim-effects.workspace = true

[dev-dependencies]
runtime-test-probe = { path = "../../runtime/runtime/test-probe" }
# The off arm's tests read `impl.render.native=off` (docs/graphics/retire-d3d.md, R9).
hooks = { path = "../../hooking/hooks", features = ["d3d-reference"] }

[lints]
workspace = true
