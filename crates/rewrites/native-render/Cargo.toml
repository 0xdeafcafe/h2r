[package]
name = "native-render"
description = "Native GPU renderer: the static world (structure BSP) loaded once from the map's tags, culled and drawn with indirect draws (docs/graphics/native-renderer.md)"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = ["gpu"]
# The map loader and the wgpu pass. Without it only the pure parts
# (world, camera, cull, skip) build: what the feature crate's hooks need.
gpu = ["dep:mem-watch", "dep:assets", "dep:map", "dep:tags", "dep:wgpu", "dep:shaders", "dep:gfx", "dep:pollster", "dep:background", "dep:timeline"]
# Seeded differential tests of the object lighting and model-row ports
# against the lifted original (tests/*_differential.rs; need the user's
# XBE). The lifter they run is a dev-dependency.
differential = []

[dependencies]
# The one widescreen rule (docs/graphics/high-resolution.md).
canvas-fit = { path = "../../platform/canvas-fit" }
mem-watch = { workspace = true, optional = true }
# Bitmap and lightmap page decodes for the hosts (load::decode_lightmap, decode_first).
assets = { workspace = true, optional = true }
background = { path = "../../runtime/background", optional = true }
timeline = { path = "../../runtime/timeline", optional = true }
map = { workspace = true, optional = true }
tags = { workspace = true, optional = true }
wgpu = { version = "30", optional = true }
shaders = { path = "../../formats/shaders", optional = true }
gfx = { path = "../../platform/gfx", optional = true }
pollster = { version = "1", optional = true }
bytemuck = { version = "1", features = ["derive"] }
# Reads the map's font tags into text::FontFace (text.rs).
font = { path = "../../formats/font" }
frame-scene = { path = "../frame-scene" }
frame-types = { path = "../../platform/frame-types" }
scene-extract = { path = "../scene-extract" }

[dev-dependencies]
lifted = { path = "../../runtime/lifted" }
# The lifted original for tests/*_differential.rs (feature `differential`).
analyze.workspace = true
xbe.workspace = true
ir.workspace = true
lift.workspace = true
timeline = { path = "../../runtime/timeline" }
gfx = { path = "../../platform/gfx" }
pollster = "1"

[lints]
workspace = true
