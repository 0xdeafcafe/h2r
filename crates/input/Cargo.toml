[package]
name = "input"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Xbox gamepad model (XINPUT_GAMEPAD), 4-port device model and host backends for h2recomp"

[features]
default = ["gilrs", "game-controller", "hid"]
# Physical gamepads through gilrs (IOKit HID on macOS).
gilrs = ["dep:gilrs"]
# Apple GameController (GCController): hot-plug, pressure buttons and rumble
# on macOS. The platform half is compiled only on macOS; the mapping layer is
# portable and always built with this feature.
game-controller = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-game-controller", "dep:objc2-core-haptics", "dep:block2", "dep:dispatch2"]
# The DualSense over raw HID (pad_hid): speaker path, mute button and LED.
# The IOKit half is compiled only on macOS; the state machine always is.
hid = ["dep:objc2-io-kit", "dep:objc2-core-foundation"]

[dependencies]
thiserror.workspace = true
serde = { version = "1", features = ["derive"] }
toml = "0.9"
gilrs = { version = "0.11", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-io-kit = { version = "0.3.2", optional = true, default-features = false, features = ["std", "libc", "hid"] }
objc2-core-foundation = { version = "0.3.2", optional = true, default-features = false, features = ["std", "CFArray", "CFDictionary", "CFNumber", "CFString", "CFRunLoop", "CFDate"] }
objc2 = { version = "0.6", optional = true }
block2 = { version = "0.6", optional = true }
dispatch2 = { version = "0.3", optional = true }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "NSArray", "NSString", "NSError", "NSSet", "NSObject", "NSEnumerator", "NSRunLoop", "NSDate", "NSObjCRuntime"] }
objc2-game-controller = { version = "0.3", optional = true, default-features = false, features = [
    "std", "GCController", "GCControllerElement", "GCControllerButtonInput", "GCControllerAxisInput",
    "GCControllerDirectionPad", "GCDevice", "GCDeviceHaptics", "GCExtendedGamepad", "GCPhysicalInputProfile", "block2", "dispatch2",
] }
objc2-core-haptics = { version = "0.3", optional = true, default-features = false, features = [
    "std", "block2", "CHHapticEngine", "CHHapticEvent", "CHHapticParameter", "CHHapticPattern", "CHHapticPatternPlayer",
] }
