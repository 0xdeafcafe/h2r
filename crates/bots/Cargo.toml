[package]
name = "bots"
description = "Multiplayer bots (Clankers): the brain that turns what a bot sees into controller input, and the input backend that puts bot pads on free controller ports (docs/game/bots.md)"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
input = { path = "../input", default-features = false }
engine = { path = "../engine" }
# The nav mesh's polygons come from the pathfinding generator's sectors,
# made from the structure BSP's collision.
tags = { path = "../tags" }
# Reading a map file's scenario and structure BSPs for the nav build
# (bots::autonav).
map = { path = "../map" }
pathfind = { path = "../pathfind" }

[dev-dependencies]
serde_json.workspace = true
xiso = { path = "../xiso" }
