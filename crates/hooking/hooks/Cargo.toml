[package]
name = "hooks"
description = "The feature registry: named points, ordered hook chains, conflicts at plan time, switches, a guest arena, and the frame and game bridges (docs/engine/feature-engine.md)"
edition.workspace = true
version.workspace = true
license.workspace = true

[package.metadata.h2]
status = "in progress"

[dependencies]
runtime.workspace = true
# The named points, the guest boundary, async entries and the override
# adapters with their runtime registration (src/leaves.rs).
guest-layout = { path = "../guest-layout", features = ["runtime-glue"] }
timeline = { path = "../../runtime/timeline" }

[dev-dependencies]
# tests/install.rs and tests/plan.rs time the render stages (render_timing).
render-bridge = { path = "../../rewrites/render-bridge" }
runtime-test-probe = { path = "../../runtime/runtime/test-probe" }

[features]
default = ["d3d-reference"]
# `impl.render.native=off`: the D3D draw path kept as the reference
# (docs/graphics/retire-d3d.md, R9). Without it the switch is not read and
# the native renderer is always on. Default until the zero gate passes.
d3d-reference = []

[lints]
workspace = true
