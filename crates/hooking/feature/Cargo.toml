[package]
name = "feature"
description = "The feature registry: named points, ordered hook chains, conflicts at plan time, switches, a guest arena, and the frame and game bridges (docs/engine/feature-engine.md)"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = ["native-render"]
native-render = ["dep:native-render", "dep:frame-scene", "dep:scene-extract"]

[dependencies]
runtime.workspace = true
tags.workspace = true
engine = { path = "../../rewrites/engine", features = ["runtime-glue"] }
timeline = { path = "../../runtime/timeline" }
# Shadow checks of the sim ports against the lifted original (shadow.rs).
lifted = { path = "../../runtime/lifted" }
# The world skip and camera read (pure: no GPU, no map reader).
native-render = { path = "../../rewrites/native-render", default-features = false, optional = true }
# The frame step's scene (docs/graphics/framescene.md).
frame-scene = { path = "../../rewrites/frame-scene", optional = true }
scene-extract = { path = "../../rewrites/scene-extract", optional = true }

[dev-dependencies]
runtime-test-probe = { path = "../../runtime/runtime/test-probe" }
