[package]
name = "shaders"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Xbox (NV2A) vertex microcode and register-combiner translation to WGSL"

[dependencies]
thiserror.workspace = true
naga = { version = "30", features = ["wgsl-in"] }

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in", "msl-out"] }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "metal", "vulkan", "wgsl"] }
pollster = "1"
# Corpus manifest check (tests/corpus.rs); `h2 extract-shaders` writes the corpus.
sha2 = "0.10"
