[package]
name = "studio"
description = "h2-editor: the editor suite on Dear ImGui (docking) + wgpu + winit: scenario placements, game variants, playlists"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false
default-run = "h2-editor"

[[bin]]
name = "h2-editor"
path = "src/main.rs"

[dependencies]
# test-engine: the item hooks the headless screenshots aim input with.
dear-imgui-rs = { version = "0.22", features = ["test-engine"] }
dear-imgui-wgpu = "0.22"
dear-imgui-winit = "0.22"
dear-imguizmo = { version = "0.22", default-features = false }
wgpu = "30"
winit = "0.30"
pollster = "1"
png = "0.18"
anyhow.workspace = true
rfd = "0.18"
content.workspace = true
editor-core = { path = "../editor-core" }
scenario-edit = { path = "../scenario-edit" }
variants = { path = "../variants" }
hopper-edit = { path = "../hopper-edit" }
live-proto.workspace = true
# Convert to Halo 2: the Halo 1 converter, over Halo 1 and Halo 2 maps.
h1convert = { path = "../h1convert" }
h1map = { path = "../h1map" }
map.workspace = true
