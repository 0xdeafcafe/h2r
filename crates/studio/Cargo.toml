[package]
name = "studio"
description = "h2-studio: the editor suite on Dear ImGui (docking) + wgpu + winit"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false
default-run = "h2-studio"

[[bin]]
name = "h2-studio"
path = "src/main.rs"

[dependencies]
dear-imgui-rs = "0.22"
dear-imgui-wgpu = "0.22"
dear-imgui-winit = "0.22"
dear-imguizmo = { version = "0.22", default-features = false }
wgpu = "30"
winit = "0.30"
pollster = "1"
png = "0.18"
anyhow.workspace = true
rfd = "0.18"
content.workspace = true
editor-core = { path = "../editor-core" }
scenario-edit = { path = "../scenario-edit", default-features = false }
variants = { path = "../variants", default-features = false }
hopper-edit = { path = "../hopper-edit" }
live-proto.workspace = true
