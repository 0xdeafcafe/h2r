[package]
name = "h1-runtime"
description = "Halo 1 in the running game: AI control, conversations, HUD text, script builtins, cinematics, and the hooks only converted maps need (docs/halo1/README.md)"
edition.workspace = true
version.workspace = true
license.workspace = true

[package.metadata.h2]
status = "in progress"
doc = ["halo1/README.md"]

[dependencies]
hooks = { path = "../../hooking/hooks" }
runtime.workspace = true
tags.workspace = true
engine = { path = "../../rewrites/engine", features = ["runtime-glue"] }
# The scope-zoom profile reads the native screen effect shares
# (render_bridge::scope_zoom_hud).
render-bridge = { path = "../../rewrites/render-bridge", default-features = false }
