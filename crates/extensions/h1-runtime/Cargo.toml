[package]
name = "h1-runtime"
description = "Hooks that only converted Halo 1 maps need: projectile velocity curves and the scope zoom (docs/halo1/README.md); the rest of Halo 1 in the game is game's h1_* modules"
edition.workspace = true
version.workspace = true
license.workspace = true

[package.metadata.h2]
status = "in progress"
doc = ["halo1/README.md"]

[dependencies]
hooks = { path = "../../hooking/hooks" }
runtime.workspace = true
tags.workspace = true
engine = { path = "../../rewrites/engine", features = ["runtime-glue"] }
guest-layout = { path = "../../hooking/guest-layout" }
# The scope-zoom profile reads the native screen effect shares
# (render_bridge::scope_zoom_hud).
render-bridge = { path = "../../rewrites/render-bridge", default-features = false }

[lints]
workspace = true
