[package]
name = "agent"
description = "The agent API server: a Unix socket in the game process, answered at tick boundaries (docs/runtime/agent-api.md)"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = ["render-overrides"]
render-overrides = ["dep:hot-render"]

[dependencies]
mem-watch.workspace = true
render-bridge = { path = "../../rewrites/render-bridge", default-features = false }
sim-bridge = { path = "../../rewrites/sim-bridge" }
agent-proto = { path = "../agent-proto" }
forge = { path = "../forge" }
forge-doc.workspace = true
serde.workspace = true
serde_json.workspace = true
runtime.workspace = true
hooks = { path = "../../hooking/hooks", default-features = false }
engine = { path = "../../rewrites/engine", features = ["runtime-glue"] }
# Typed guest views (src/sim/state.rs).
guest-layout = { path = "../../hooking/guest-layout" }
# The simulation's typed object views (src/sim/objects.rs, `sim.objects`).
sim-state.workspace = true
live-telemetry = { path = "../../live/live-telemetry" }
live-proto.workspace = true
timeline = { path = "../../runtime/timeline" }
xapi = { path = "../../platform/xapi" }
input = { path = "../../platform/input", default-features = false }
# The retail object types and their scenario placement/palette layout.
tags.workspace = true
# Hot iteration: live tag edits and render overrides (src/hot.rs).
hot-render = { path = "../../platform/hot-render", optional = true }
hot-tags = { path = "../hot-tags" }
# The debug menu is an in-process client (src/menu.rs), and lists settings.
debug-menu = { path = "../debug-menu" }
settings = { path = "../../formats/settings" }
# The agent's own section of a machine snapshot (Agent::save_state).
snapshot = { path = "../../runtime/snapshot" }
# render.compare reads and writes PNGs (src/compare.rs).
png = { workspace = true }
# render.picture's stream sends JPEGs (src/render/picture.rs).
image = { version = "0.25", default-features = false, features = ["jpeg"] }

background.workspace = true
map.workspace = true

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
# A synthetic lifted original for the shadow.* tests.
lifted = { path = "../../runtime/lifted" }
# sim.hashes' rows against the sim report's (src/sim/hashes.rs); renamed
# so it can't be mistaken for this crate's `sim` module.
sim-report = { package = "sim-bench", path = "../../live/sim-bench" }
# Synthetic maps for src/hot/tests.rs.
map.workspace = true

[lints]
workspace = true
