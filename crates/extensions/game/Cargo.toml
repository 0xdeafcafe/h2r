[package]
name = "game"
description = "Our additions to the game: menus and settings screens, skulls, variants, the campaign picker, gameplay hooks and the glue to the platform crates (docs/game/settings-menu.md)"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
mem-watch.workspace = true
forge.workspace = true
forge-doc.workspace = true
# The block-out shapes the monitor places and draws (forge_glue/pieces_world.rs).
forge-shapes = { path = "../../formats/forge-shapes" }
# The shapes Forge draws for a game type's parts (forge_glue/markers_world.rs).
game-markers = { path = "../../formats/game-markers" }
# The Firefight director and its host log (firefight/host.rs).
firefight = { path = "../../formats/firefight" }
host-log.workspace = true
# Rules scripts: the verifier and VM the host runtime runs (rules/).
rules = { workspace = true, optional = true }
# The RULES record the rules runtime keeps in the SimExt blob.
sim-ext.workspace = true
guest-layout = { path = "../../hooking/guest-layout" }
actor-net = { path = "../../live/actor-net" }
# Build and load (docs/dev/crate-structure.md, S4).
recomp = { path = "../../runtime/recomp" }
h1-runtime = { path = "../h1-runtime" }
# The native renderer's and the native simulation's guest halves
# (docs/dev/crate-structure.md, S3).
render-bridge = { path = "../../rewrites/render-bridge", default-features = false }
canvas-fit = { path = "../../platform/canvas-fit" }
sim-bridge = { path = "../../rewrites/sim-bridge" }
film = { path = "../../live/film" }
# Start points: the stored arena frames (theater/start_point.rs).
zstd = "0.11"
rustc-hash = { workspace = true }
xbe.workspace = true
xiso.workspace = true
runtime.workspace = true
kernel.workspace = true
vfs.workspace = true
# Map packages under <data>/maps (docs/game/maps.md).
content.workspace = true
# The controller-speaker sound index reads the player's map files (pad_speaker).
tags.workspace = true
hs.workspace = true
sim-state.workspace = true
coop = { path = "../../live/coop" }
map.workspace = true
# What the Halo 1 converters write and the Halo 1 hooks read (h1_*.rs);
# no converter crate.
h1-contract.workspace = true
# Our settings (setting_defs, the ui model).
settings = { path = "../../formats/settings" }
hooks = { path = "../../hooking/hooks", default-features = false }
engine = { path = "../../rewrites/engine", features = ["runtime-glue"] }
toml = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
font = { path = "../../formats/font" }
# Our added game variant choices (variant_options, docs/game/game-options.md).
variants = { path = "../../formats/variants" }
anyhow.workspace = true
libloading = { workspace = true }
gfx = { path = "../../platform/gfx", default-features = false }
png = { workspace = true }
# The native post's A/B readback (native_post_glue).
wgpu = { version = "30", optional = true }
# New maps' list previews from mainmenu.map's level pictures (new_maps).
assets = { path = "../../platform/assets" }
native-render = { path = "../../rewrites/native-render", optional = true }
# The frame step's scene (docs/graphics/framescene.md); pure, no GPU.
frame-scene = { path = "../../rewrites/frame-scene" }
# The HUD walk the overlay stage draws the HUD from (hud_overlay.rs,
# docs/graphics/native-post-hud.md "The HUD on the overlay").
hud-edit = { path = "../../tools/hud-edit", optional = true }
shaders = { path = "../../formats/shaders", optional = true }
serde.workspace = true
# Screens' presentation in YAML (ui_kit::data).
serde_yaml_ng.workspace = true
indexmap.workspace = true
dsound = { path = "../../platform/dsound", default-features = false }
# Voice chat's media objects (voice_glue); devices come from the host.
voice = { workspace = true, optional = true }
audio = { path = "../../platform/audio", default-features = false }
# The sound table's clips (sound_feed.rs).
sound-clips = { path = "../../platform/sound-clips" }
wma = { path = "../../platform/wma" }
bink-hle = { path = "../../platform/bink-hle", default-features = false }
# Where `h2 movies` installs (movies_glue).
movies = { workspace = true, optional = true }
xapi = { path = "../../platform/xapi" }
live-hle = { path = "../../live/live-hle" }
live-telemetry = { path = "../../live/live-telemetry" }
# The superbounce game type's spot scan (superbounce_mode).
superbounce = { path = "../../live/superbounce" }
# The Pogo Stick's styles and where the map rewrite placed its tags
# (pogo_loadout; docs/game/pogo-stick.md).
pogo = { path = "../../formats/pogo" }
# The HUD kit's model, templates and record compiler (hud_kit,
# superbounce_hud; docs/game/hud-kit.md).
hud-kit-core.workspace = true
live-proto.workspace = true
input = { path = "../../platform/input", default-features = false }
# Phantom bots (docs/game/bots.md).
bots = { path = "../../live/bots" }
# Threads below the game's priority for background work
# (docs/runtime/background-work.md).
background.workspace = true
# Sim mode's match, tuning and report files (docs/runtime/sim.md).
sim-bench = { path = "../../live/sim-bench" }
iced-x86 = { version = "1", default-features = false, features = ["std", "decoder", "instr_info"] }
timeline = { path = "../../runtime/timeline" }
# The determinism harness (H2_LOCKSTEP, H2_INPUT_RECORD, H2_INPUT_REPLAY).
lockstep = { path = "../lockstep" }
# Machine snapshots: feature sections' codec (docs/runtime/snapshots.md).
snapshot = { path = "../../runtime/snapshot" }
# The agent API (H2_AGENT; docs/runtime/agent-api.md).
agent = { path = "../agent", default-features = false }
agent-proto = { path = "../agent-proto" }
# Our debug menu (debug_menu_glue.rs, docs/runtime/debug-menu.md).
debug-menu = { path = "../debug-menu" }
# Hot iteration on the agent (src/hot_glue.rs, docs/graphics/hot-iteration.md).
hot-render = { path = "../../platform/hot-render", optional = true }
hot-tags = { path = "../hot-tags" }
# The agent glue's host methods (input.pad, profile.sample.*).
serde_json.workspace = true
# `H2_PERF_FROM`: a profiler/timeline session over part of a run.
perf = { path = "../../tools/perf", optional = true }

[features]
# Invented UI map templates for the package parity tests.
ui-fixture = []
default = ["gpu", "movie-playback", "local-io", "test-maps", "rules"]
desktop-runtime = ["render-bridge/native-render", "recomp/desktop-runtime"]
gpu = ["desktop-runtime", "gfx/gpu", "agent/render-overrides", "dep:wgpu", "dep:native-render", "dep:shaders", "dep:hot-render", "dep:hud-edit"]
movie-playback = ["desktop-runtime", "bink-hle/playback", "dep:movies"]
local-io = ["desktop-runtime", "dep:voice", "dsound/playback"]
perf = ["dep:perf"]
# maps.test.* on the agent: test maps built from recipes (test_maps.rs,
# docs/game/test-maps.md). The recipes come from the caller (`Recipes`);
# boot supplies the scenario editor's.
test-maps = []
# The rules host runtime (src/rules/, docs/game/rules-engine.md): compiled
# in; the `rules` entry of H2_FEATURES turns it on.
rules = ["dep:rules"]

[dev-dependencies]
# The fixture generated module, for hooks run through the real Runner.
runtime-test-probe = { path = "../../runtime/runtime/test-probe" }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[lints]
workspace = true
