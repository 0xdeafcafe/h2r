[package]
name = "app-icon"
description = "The app icon for the unbundled Mac windows (h2 play, h2-editor) and the menu bar template glyph, from art/app-icon"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
png = "0.18"

# The Dock icon: NSApplication's applicationIconImage. The same objc2
# versions tray-icon and rfd already pull in.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
