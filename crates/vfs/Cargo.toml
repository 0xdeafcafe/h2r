[package]
name = "vfs"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
xiso.workspace = true
memmap2 = "0.9"
thiserror.workspace = true
# Map packages (PackageBackend): manifests, patches, the resolver.
content.workspace = true

[target.'cfg(unix)'.dependencies]
# fd-anchored traversal for HostBackend::format (openat/unlinkat, no symlink following).
rustix = { version = "1", default-features = false, features = ["fs", "std"] }
