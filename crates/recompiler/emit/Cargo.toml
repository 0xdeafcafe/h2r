[package]
name = "emit"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
ir.workspace = true
opt.workspace = true
lift.workspace = true
analyze.workspace = true
xbe.workspace = true
x87.workspace = true
libloading = "0.8"
# The test host's flat RAM window (src/host.rs, contract slice F3).
libc = "0.2"
hostfault = { path = "../hostfault" }
# Independent execution only for opt-in native-lowering validation.
oracle = { path = "../oracle", optional = true, features = ["unicorn"] }

[features]
oracle-tests = ["dep:oracle"]

[dev-dependencies]
simd.workspace = true
sse-oracle = { path = "../sse-oracle" }
iced-x86 = { version = "1", default-features = false, features = ["std", "decoder", "instr_info", "code_asm"] }
runtime = { path = "../../runtime/runtime" }
