[package]
name = "hostfault"
description = "The process-wide host fault handler: regions with in-handler callbacks, and fixup tables that send a faulting access to its slow path"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
# sigaction, siginfo and the saved machine context; as the other crates pin it.
libc = "0.2"

[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Diagnostics_Debug", "Win32_System_Kernel"] }

[target.'cfg(all(windows, target_arch = "x86_64"))'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Memory"] }
