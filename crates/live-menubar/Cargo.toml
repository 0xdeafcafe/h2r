[package]
name = "live-menubar"
description = "The optional menu bar (tray) app for a Live server on this machine: launchd agents, status polling, the menu"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = "0.9"
# /healthz of the local server and the public URL.
ureq = { version = "2", default-features = false, features = ["tls"] }
# The tray icon and its menu (muda, re-exported as tray_icon::menu), on a
# winit event loop as tray-icon's docs recommend on macOS.
tray-icon = "0.26"
# The status glyph (art/app-icon).
app-icon = { path = "../app-icon" }
winit = "0.30"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
