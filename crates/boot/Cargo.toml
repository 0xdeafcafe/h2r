[package]
name = "boot"
description = "Boot glue: lift, emit and compile the whole XBE, then run it on the runtime with kernel HLE"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
rustc-hash = "2"
xbe.workspace = true
xiso.workspace = true
analyze.workspace = true
lift.workspace = true
emit.workspace = true
# The Cranelift fast tier (tier.rs, docs/lifter/cranelift-tier.md).
clif.workspace = true
ir.workspace = true
runtime.workspace = true
kernel.workspace = true
vfs.workspace = true
# Map packages under <data>/maps (docs/game/maps.md).
content.workspace = true
# The controller-speaker sound index reads the player's map files (pad_speaker).
tags.workspace = true
map.workspace = true
# Our settings (setting_defs, the ui model).
settings = { path = "../settings" }
feature = { path = "../feature" }
engine = { path = "../engine", features = ["runtime-glue"] }
toml = "0.9"
font = { path = "../font" }
# Our added game variant choices (variant_options, docs/game/game-options.md).
variants = { path = "../variants" }
anyhow.workspace = true
libloading = "0.8"
d3d = { path = "../d3d" }
gfx = { path = "../gfx" }
png = "0.18"
# The native post's A/B readback (native_post_glue).
wgpu = "30"
# New maps' list previews from mainmenu.map's level pictures (new_maps).
assets = { path = "../assets" }
native-render = { path = "../native-render" }
serde.workspace = true
x87 = { path = "../x87" }
dsound = { path = "../dsound" }
# Voice chat's media objects (voice_glue); devices come from the host.
voice.workspace = true
audio = { path = "../audio", default-features = false }
bink-hle = { path = "../bink-hle" }
# Where `h2 movies` installs (movies_glue).
movies.workspace = true
xapi = { path = "../xapi" }
live-hle = { path = "../live-hle" }
live-telemetry = { path = "../live-telemetry" }
live-proto.workspace = true
input = { path = "../input", default-features = false }
# Local bots (docs/game/bots.md).
bots = { path = "../bots" }
# Sim mode's match, tuning and report files (docs/runtime/sim.md).
sim = { path = "../sim" }
iced-x86 = { version = "1", default-features = false, features = ["std", "decoder", "instr_info"] }
timeline = { path = "../timeline" }
# The determinism harness (H2_LOCKSTEP, H2_INPUT_RECORD, H2_INPUT_REPLAY).
lockstep = { path = "../lockstep" }
# Machine snapshots: feature sections' codec (docs/runtime/snapshots.md).
snapshot = { path = "../snapshot" }
# The agent API (H2_AGENT; docs/runtime/agent-api.md).
agent = { path = "../agent" }
agent-proto = { path = "../agent-proto" }
# Our debug menu (debug_menu_glue.rs, docs/runtime/debug-menu.md).
debug-menu = { path = "../debug-menu" }
# Hot iteration on the agent (src/hot_glue.rs, docs/graphics/hot-iteration.md).
hot-render = { path = "../hot-render" }
hot-tags = { path = "../hot-tags" }
# The agent glue's host methods (input.pad, profile.sample.*).
serde_json.workspace = true
# `H2_PERF_FROM`: a profiler/timeline session over part of a run.
perf = { path = "../perf", optional = true }

[features]
perf = ["dep:perf"]

[dev-dependencies]
# The fixture generated module, for hooks run through the real Runner.
runtime-test-probe = { path = "../runtime/test-probe" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
