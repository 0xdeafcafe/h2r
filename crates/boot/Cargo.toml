[package]
name = "boot"
description = "Boot glue: lift, emit and compile the whole XBE, then run it on the runtime with kernel HLE"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
rustc-hash = "2"
xbe.workspace = true
xiso.workspace = true
analyze.workspace = true
lift.workspace = true
emit.workspace = true
ir.workspace = true
runtime.workspace = true
kernel.workspace = true
vfs.workspace = true
# The controller-speaker sound index reads the player's map files (pad_speaker).
tags.workspace = true
map.workspace = true
# Our settings (setting_defs, the ui model).
settings = { path = "../settings" }
toml = "0.9"
font = { path = "../font" }
anyhow.workspace = true
libloading = "0.8"
d3d = { path = "../d3d" }
gfx = { path = "../gfx" }
png = "0.18"
x87 = { path = "../x87" }
dsound = { path = "../dsound" }
audio = { path = "../audio", default-features = false }
bink-hle = { path = "../bink-hle" }
xapi = { path = "../xapi" }
live-hle = { path = "../live-hle" }
live-telemetry = { path = "../live-telemetry" }
input = { path = "../input", default-features = false }
iced-x86 = { version = "1", default-features = false, features = ["std", "decoder", "instr_info"] }
timeline = { path = "../timeline" }
# The determinism harness (H2_LOCKSTEP, H2_INPUT_RECORD, H2_INPUT_REPLAY).
lockstep = { path = "../lockstep" }
# `H2_PERF_FROM`: a profiler/timeline session over part of a run.
perf = { path = "../perf", optional = true }

[features]
perf = ["dep:perf"]

[dev-dependencies]
# The fixture generated module, for hooks run through the real Runner.
runtime-test-probe = { path = "../runtime/test-probe" }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
