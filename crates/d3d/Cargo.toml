[package]
name = "d3d"
description = "Guest-facing Direct3D 8 (Xbox, XDK 5849 LTCG) replacement for Halo 2, on top of gfx"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
gfx = { path = "../gfx" }
wgpu = "30"
thiserror.workspace = true
runtime.workspace = true
# Swap/KickOff/drain/submit spans and the frame counter (docs/perf.md).
timeline = { path = "../timeline" }
# NV2A program translation behind `nv2a::Nv2aShaders` (the ShaderProvider).
shaders = { path = "../shaders" }
# Pipeline and program keys are persisted (d3d::pipeline_store).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Per-draw program-key lookups (nv2a::Nv2aShaders).
rustc-hash = "2"

[dev-dependencies]
pollster = "1"
# The MSL back end alone, timed in tests/pipeline_cost.rs.
naga = { version = "30", features = ["wgsl-in", "msl-out"] }
# The windowed example (examples/window.rs) presents through the host shell.
app = { path = "../app" }
anyhow.workspace = true
# Decoding the retail image in the ignored $H2_XBE tests.
iced-x86 = { version = "1", default-features = false, features = ["std", "decoder", "instr_info"] }
# The NV2A window tests: find every device+0x934 site in $H2_XBE (analyze,
# xbe) and run the sites' lifted IR against the runtime (lift, ir).
analyze.workspace = true
xbe.workspace = true
lift.workspace = true
ir.workspace = true
# The clocked vertical blank end to end: a kernel periodic source and the
# kernel's NtYieldExecution under Machine (tests/vblank_clock.rs).
kernel = { path = "../kernel" }

# Replays a synthetic frame (docs/perf.md, "Device CPU cost"). Plain timed
# loop, no Criterion: `cargo bench -p d3d --bench pushbuf`.
[[bench]]
name = "pushbuf"
harness = false

[[bench]]
name = "draw_churn"
harness = false

[[bench]]
name = "streams"
harness = false
