[package]
name = "kernel"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
runtime = { workspace = true, features = ["guest-file-reads"] }
xbe.workspace = true
thiserror.workspace = true
vfs = { path = "../vfs" }
# Machine snapshots: the kcore and machine sections (src/snapshot.rs).
snapshot = { path = "../snapshot" }
# Slice, wait, DPC and idle events (docs/perf/profiling.md).
timeline = { path = "../timeline" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "thread", "time"] }

[dev-dependencies]
analyze.workspace = true
iced-x86 = { version = "1", default-features = false, features = ["std", "decoder", "instr_info", "code_asm"] }
# tests/preempt.rs lifts, emits and compiles synthetic guest loops.
emit.workspace = true
ir.workspace = true
lift.workspace = true
libloading = "0.8"
