[package]
name = "vfs"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
xiso.workspace = true
memmap2 = "0.9"
thiserror.workspace = true
# Map packages (PackageBackend): manifests, patches, the resolver.
content.workspace = true

[target.'cfg(unix)'.dependencies]
# Page size for a disc mapping's bulk-read span (rustix::param::page_size in disc.rs).
rustix = { version = "1", default-features = false, features = ["param", "std"] }
# Dropping a disc mapping's pages after a bulk read (msync/madvise/fadvise).
libc = "0.2"
