[package]
name = "vfs"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
xiso.workspace = true
memmap2 = "0.9"
thiserror.workspace = true
mem-watch.workspace = true
# Map packages (PackageBackend): manifests, patches, the resolver.
content.workspace = true
# `Config::for_title`: the app data directory.
host-dirs.workspace = true
# Maps served from the tag store (store_map.rs): its skeletons and extents.
tags.workspace = true

[target.'cfg(unix)'.dependencies]
# Anchored format operations and page size for disc mappings.
rustix = { version = "1", default-features = false, features = ["fs", "param", "std"] }
# Dropping a disc mapping's pages after a bulk read (msync/madvise/fadvise).
libc = { workspace = true }

[lints]
workspace = true
