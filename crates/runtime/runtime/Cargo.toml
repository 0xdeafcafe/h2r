[package]
name = "runtime"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
guest-file-reads = ["dep:vfs"]

[dependencies]
# The kernel can supply a range pinned and certified immutable by the VFS.
vfs = { workspace = true, optional = true }
thiserror.workspace = true
xbe.workspace = true
x87.workspace = true
# Interrupt and HLE-call events (docs/perf/profiling.md); dependency-free.
timeline = { path = "../timeline" }
rustc-hash = { workspace = true }
# mmap of guest RAM and its copy-on-write bases (src/cow.rs); as the
# other crates pin it.
libc = { workspace = true }
# The flat RAM window's fault region (src/window.rs).
hostfault = { path = "../../recompiler/hostfault" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_System_Memory", "Win32_System_SystemInformation"] }

[dev-dependencies]
iced-x86 = { version = "1", default-features = false, features = ["std", "decoder"] }
runtime-test-probe = { path = "test-probe" }

[lints]
workspace = true
