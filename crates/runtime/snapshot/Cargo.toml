[package]
name = "snapshot"
description = "Machine snapshots: the versioned container, compressed guest RAM pages and the snapshot store (docs/runtime/snapshots.md)"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
runtime.workspace = true
thiserror.workspace = true
# Already in the lock file through sse-oracle; level 1 compresses a 64 MB
# RAM image in well under a second.
zstd = "0.11"
crc32fast = "1"

[dev-dependencies]
# The post-load determinism check is lockstep's own whole-RAM hash.
lockstep = { path = "../../extensions/lockstep" }
