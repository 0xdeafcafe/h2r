[package]
name = "runtime"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
xbe.workspace = true
x87.workspace = true
# Interrupt and HLE-call events (docs/perf/profiling.md); dependency-free.
timeline = { path = "../timeline" }
rustc-hash = "2"

[target.'cfg(any(target_os = "macos", all(target_os = "linux", target_arch = "x86_64")))'.dependencies]
libc = "0.2"

[dev-dependencies]
iced-x86 = { version = "1", default-features = false, features = ["std", "decoder"] }
runtime-test-probe = { path = "test-probe" }
