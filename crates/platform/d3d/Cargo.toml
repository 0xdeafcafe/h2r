[package]
name = "d3d"
description = "Guest-facing Direct3D 8 (Xbox, XDK 5849 LTCG) replacement for Halo 2, on top of gfx"
edition.workspace = true
version.workspace = true
license.workspace = true
# The test files build as one binary, tests/it.rs (docs/dev/build-speed.md).
autotests = false

[features]
default = ["gpu"]
# The guest device and software recorder need no GPU or window system.
gpu = ["gfx/gpu", "dep:wgpu", "dep:hot-render", "dep:serde_json", "dep:pollster"]

[dependencies]
gfx = { path = "../gfx", default-features = false }
wgpu = { version = "30", optional = true }
thiserror.workspace = true
runtime.workspace = true
# Swap/KickOff/drain/submit spans and the frame counter (docs/perf/profiling.md).
timeline = { path = "../../runtime/timeline" }
# NV2A program translation behind `nv2a::Nv2aShaders` (the ShaderProvider).
shaders = { path = "../../formats/shaders" }
# WGSL overrides, parameters and dumps, hot (src/nv2a_hot.rs, docs/graphics/hot-iteration.md).
hot-render = { path = "../hot-render", optional = true }
# Pipeline and program keys are persisted (d3d::pipeline_store).
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
# Per-draw program-key lookups (nv2a::Nv2aShaders).
rustc-hash = "2"
# Guest words read straight into `u32` arrays (state::read_words_into).
bytemuck = "1"
# Machine snapshots: the d3d section (src/device/snap.rs).
snapshot = { path = "../../runtime/snapshot" }
# The frame's carried part, by slot (src/scene_sink.rs, docs/graphics/framescene.md slice 6).
frame-scene = { path = "../../rewrites/frame-scene" }

pollster = { version = "1", optional = true }

[dev-dependencies]
# The synthetic text before and after (tests/glyph_text.rs, H2_FONT_HD_PNG).
png = "0.18"
# The MSL back end alone, timed in tests/pipeline_cost.rs.
naga = { version = "30", features = ["wgsl-in", "msl-out"] }
# The windowed example (examples/window.rs) presents through the host shell.
app = { path = "../../apps/app" }
anyhow.workspace = true
# Decoding the retail image in the ignored $H2_XBE tests.
iced-x86 = { version = "1", default-features = false, features = ["std", "decoder", "instr_info"] }
# The NV2A window tests: find every device+0x934 site in $H2_XBE (analyze,
# xbe) and run the sites' lifted IR against the runtime (lift, ir).
analyze.workspace = true
xbe.workspace = true
lift.workspace = true
ir.workspace = true
# The clocked vertical blank end to end: a kernel periodic source and the
# kernel's NtYieldExecution under Machine (tests/vblank_clock.rs).
kernel = { path = "../../runtime/kernel" }

# Replays a synthetic frame (docs/perf/profiling.md, "Device CPU cost"). Plain timed
# loop, no Criterion: `cargo bench -p d3d --bench pushbuf`.
[[bench]]
name = "pushbuf"
harness = false

[[bench]]
name = "draw_churn"
harness = false

[[bench]]
name = "streams"
harness = false

[[bench]]
name = "visibility_wait"
harness = false

[[bench]]
name = "vertex_fetch"
harness = false

[[bench]]
name = "render_churn"
harness = false

# Guest-thread us per draw, draw sharing on and off (tests/draw_frame).
[[bench]]
name = "draw_main"
harness = false

[[test]]
name = "it"
path = "tests/it.rs"

[[test]]
name = "alias_mirror"
path = "tests/alias_mirror.rs"

[[test]]
name = "draw_bench"
path = "tests/draw_bench.rs"

[[test]]
name = "draw_churn"
path = "tests/draw_churn.rs"

[[test]]
name = "gpu_depth_alias"
path = "tests/gpu_depth_alias.rs"

[[test]]
name = "hot_overrides"
path = "tests/hot_overrides.rs"

[[test]]
name = "pipeline_cache"
path = "tests/pipeline_cache.rs"

[[test]]
name = "pipeline_cost"
path = "tests/pipeline_cost.rs"

[[test]]
name = "render_churn"
path = "tests/render_churn.rs"

[[test]]
name = "shader_corpus"
path = "tests/shader_corpus.rs"

[[test]]
name = "threaded"
path = "tests/threaded.rs"

[[test]]
name = "threaded_frame_stats"
path = "tests/threaded_frame_stats.rs"

[[test]]
name = "vblank_clock"
path = "tests/vblank_clock.rs"

[[test]]
name = "visibility_async"
path = "tests/visibility_async.rs"
