[package]
name = "audio"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DirectSound-level audio model, Xbox ADPCM decoder and software mixer for h2recomp"

[features]
default = ["device"]
# Host output through cpal. The core (everything outside `output`) never
# touches a device, so a tvOS or Xbox port can disable this and supply its own.
device = ["dep:cpal"]

[dependencies]
thiserror.workspace = true
# Machine snapshots: the mixer's section (src/snap.rs).
snapshot = { path = "../../runtime/snapshot" }
cpal = { version = "0.18", optional = true }

[[example]]
name = "tone"
required-features = ["device"]

[[example]]
name = "latency"
required-features = ["device"]
