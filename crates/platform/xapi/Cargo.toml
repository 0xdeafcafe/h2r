[package]
name = "xapi"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Guest XAPI service replacements for Halo 2"

[dependencies]
input = { path = "../input", default-features = false }
runtime.workspace = true
vfs = { path = "../../runtime/vfs" }
# Machine snapshots: the xapi section (src/snapshot.rs).
snapshot = { path = "../../runtime/snapshot" }

[dev-dependencies]
# The real raw-disk cache database, for tests/host_boot.rs only.
kernel = { path = "../../runtime/kernel" }
iced-x86 = { version = "1", default-features = false, features = ["std", "decoder", "instr_info"] }

# Ignored retail checkpoint acceptance compiles only its reached generated owners.
analyze.workspace = true
emit.workspace = true
ir.workspace = true
lift.workspace = true
xbe.workspace = true
libloading = "0.8"
