[package]
name = "gfx"
description = "Direct3D 8 (Xbox flavour) replacement on wgpu: texture decoding, state model, presenter"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = ["gpu"]
# Guest formats, texture decoding, state and vertex declarations are CPU-only.
gpu = ["dep:wgpu", "dep:bytemuck", "dep:pollster", "dep:hashbrown", "dep:timeline", "mem-watch/gpu"]

[dependencies]
mem-watch.workspace = true
# `serde`: pipeline keys are persisted (d3d::pipeline_store).
wgpu = { version = "30", features = ["serde"], optional = true }
bytemuck = { version = "1", optional = true }
# Borrowed pipeline entries avoid cloning keys and hashing twice on hits.
hashbrown = { version = "0.17", default-features = false, features = ["default-hasher", "inline-more"], optional = true }
# Pipeline and program keys are persisted (d3d::pipeline_store).
serde = { version = "1", features = ["derive"] }
pollster = { version = "1", optional = true }
smallvec = "1"
# The one widescreen rule (UiFit; docs/graphics/high-resolution.md).
canvas-fit = { path = "../canvas-fit" }
# Pixel combiner definitions and fog parameters (guest_program).
shaders = { path = "../../formats/shaders" }
# The one cache directory the pipeline store lives in (pipeline_store).
host-dirs.workspace = true
# The render camera `present_camera` carries.
frame-types = { path = "../frame-types" }
thiserror.workspace = true
# Pipeline-creation spans (docs/perf/profiling.md); no dependencies of its own.
timeline = { path = "../../runtime/timeline", optional = true }

[dev-dependencies]
serde_json.workspace = true
winit = "0.30"
anyhow.workspace = true

[[example]]
name = "window"
path = "examples/window.rs"
required-features = ["gpu"]

[lints]
workspace = true
