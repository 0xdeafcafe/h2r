[package]
name = "mem-watch"
description = "Process footprint history, memory limits, diagnostic reports and the memory flight recorder"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
# The GPU census reads wgpu's resource report from registered devices.
gpu = ["dep:wgpu", "dep:objc2-metal"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
# Sampled allocation stacks (H2_MEM_SAMPLE); capture and symbolization only.
backtrace = "0.3"
wgpu = { version = "30", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# Metal's driver allocation total, read through wgpu's HAL device.
objc2-metal = { version = "0.3.2", optional = true, default-features = false, features = ["std", "MTLDevice"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading"] }
