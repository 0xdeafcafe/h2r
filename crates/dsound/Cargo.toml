[package]
name = "dsound"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Guest-facing DirectSound replacement for h2recomp: guest memory in, crates/audio out"

[dependencies]
# The device (cpal) feature is the host's business, not the shim's.
audio = { path = "../audio", default-features = false }
thiserror.workspace = true
runtime.workspace = true

[dev-dependencies]
iced-x86 = { version = "1", default-features = false, features = ["std", "decoder", "instr_info"] }
