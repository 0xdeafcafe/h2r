[package]
name = "dsound"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Guest-facing DirectSound replacement for h2recomp: guest memory in, crates/audio out"

[features]
default = ["playback"]
# A dedicated host only advances DirectSound's guest-visible clock.
playback = []

[dependencies]
# The device (cpal) feature is the host's business, not the shim's.
audio = { path = "../audio", default-features = false }
thiserror.workspace = true
runtime.workspace = true
# The clean-room WMA decoder registered at the game's codec boundary (xwma).
wma = { path = "../wma" }
# Machine snapshots: the dsound and audioout sections (src/register/snap.rs).
snapshot = { path = "../snapshot" }
# The controller-speaker settings (padroute), in the input bindings' style.
serde = { workspace = true }
toml = "0.9"

[dev-dependencies]
wma = { path = "../wma", features = ["synthetic"] }
asf = { path = "../asf", features = ["disc"] }
iced-x86 = { version = "1", default-features = false, features = ["std", "decoder", "instr_info"] }
# tests/stream_feed.rs: stream feeding on the real scheduler and logical clock.
kernel.workspace = true
