[package]
name = "bots"
description = "Multiplayer bots (Clankers): the brain that turns what a bot sees into controller input, and the phantom peers that play through the host simulation (docs/game/bots.md)"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
rustc-hash = "2"
serde.workspace = true
live-proto.workspace = true
input = { path = "../../platform/input", default-features = false }
engine = { path = "../../rewrites/engine" }
# The nav mesh's polygons come from the pathfinding generator's sectors,
# made from the structure BSP's collision.
tags = { path = "../../formats/tags" }
# Reading a map file's scenario and structure BSPs for the nav build
# (bots::autonav).
map = { path = "../../formats/map" }
pathfind = { path = "../../formats/pathfind" }
# The game's nav worker builds its visibility grids as background work
# (vis::Threads::background).
background.workspace = true

[dev-dependencies]
serde_json.workspace = true
xiso = { path = "../../formats/xiso" }
