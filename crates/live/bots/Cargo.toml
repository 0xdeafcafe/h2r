[package]
name = "bots"
description = "Multiplayer bots (Clankers): the brain that turns what a bot sees into controller input, and the phantom peers that play through the host simulation (docs/game/bots.md)"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
rustc-hash = { workspace = true }
serde.workspace = true
live-proto.workspace = true
input = { path = "../../platform/input", default-features = false }
engine = { path = "../../rewrites/engine" }
# A hill's area, the zone a script scores (bots::objective::Hill).
game-markers = { path = "../../formats/game-markers" }
# The actor pool Firefight's bots read their enemies from (bots::firefight).
guest-layout = { path = "../../hooking/guest-layout" }
# The nav mesh's polygons come from the pathfinding generator's sectors,
# made from the structure BSP's collision.
tags = { path = "../../formats/tags" }
# Reading a map file's scenario and structure BSPs for the nav build
# (bots::autonav).
map = { path = "../../formats/map" }
pathfind = { path = "../../formats/pathfind" }
# The superbounce and forced-crouch spots the bots use (bots::spots).
superbounce = { path = "../superbounce" }
# The shared nav cache keys map regions and verifies output with SHA-256.
content.workspace = true
# The game's nav worker runs parallel build phases as background work
# (vis::Threads::background).
background.workspace = true
# The cache directory the shared nav cache lives in (autonav::shared_cache).
host-dirs.workspace = true
timeline = { path = "../../runtime/timeline" }

[dev-dependencies]
h1map = { path = "../../tools/h1map" }
serde_json.workspace = true
xiso = { path = "../../formats/xiso" }

[lints]
workspace = true
