[package]
name = "show-lan"
description = "The show channel's LAN carrier: authenticated actor-channel datagrams between System Link peers (docs/game/rules-world-api.md, slice W11)"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[package.metadata.h2]
doc = ["game/rules-world-api.md"]

[dependencies]
# The records the carrier moves; it adds no record of its own.
actor-net = { path = "../actor-net" }
# The host's session key, the key agreement and the per-packet tag.
ed25519-dalek = "2"
curve25519-dalek = "4"
hkdf = "0.12"
hmac = "0.12"
sha2 = { workspace = true }

[lints]
workspace = true
