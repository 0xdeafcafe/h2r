[package]
name = "host-data"
description = "The dedicated host's game data: build the owner's bundle from their disc, and fetch, verify and cache it on a host (docs/live/dedicated-host.md, Game data bundle)"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
# The bots' nav meshes and visibility grids for every bundled multiplayer
# map: built with the nav worker, checked against the map, placed in the
# host's data root (docs/live/dedicated-host.md, Game data bundle).
bots = { path = "../bots" }
# The default data root whose bots directory `h2 host bundle` builds into.
content.workspace = true
map.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
xiso.workspace = true
vfs.workspace = true
# Match versions already used by the CLI and other workspace crates.
sha2 = { workspace = true }
ureq = { version = "2", default-features = false, features = ["tls"] }
zstd = "0.11"
# `h2 host bundle` builds each multiplayer map's Firefight kit from the
# disc (docs/live/dedicated-host.md, Game data bundle). The headless host
# only places a bundled kit, so its build leaves the builder out.
firefight-kit = { path = "../../tools/firefight-kit", optional = true }

[features]
default = ["firefight"]
firefight = ["dep:firefight-kit"]

[dev-dependencies]
# An invented map the kit builds on.
firefight-kit = { path = "../../tools/firefight-kit", features = ["testkit"] }

[lints]
workspace = true
