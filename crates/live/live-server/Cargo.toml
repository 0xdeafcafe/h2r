[package]
name = "live-server"
description = "The Xbox Live replacement service: signed events on SQLite or Postgres behind axum (docs/live/live.md, docs/live/live-api.md)"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
live-proto.workspace = true
# MapId, manifests and hashing for the content store (docs/game/maps.md §5).
content.workspace = true
anyhow.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
# Without `native` (default-features = false), the routes, the read model
# and the store trait build for wasm32-unknown-unknown, for the Cloudflare
# Worker (crates/live/live-worker, docs/live/live-worker.md): no sockets, no
# SQL drivers, no TLS, no file serving. `rt` has the timers and tasks.
tokio = { version = "1", default-features = false, features = ["sync", "macros", "io-util", "rt", "time"] }
tokio-tungstenite = { version = "0.26", optional = true }
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["json", "query", "form", "matched-path", "original-uri"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "sqlite", "runtime-tokio", "json", "macros"], optional = true }
# Blobs (content, cloud saves, game art) on the local disk or an S3-compatible
# bucket such as Cloudflare R2 (docs/live/live-hosting.md, "Free hosting").
# `aws-base` + `ring` rather than `aws`: the S3 client signs with ring and
# speaks TLS through rustls on ring, as the rest of the server does, so
# aws-lc (a large C build) stays out of the image. Without `native`, only
# the trait and the in-memory store (the Worker brings R2).
object_store = { version = "0.14", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"], optional = true }
bytes = "1"
futures-util = "0.3"
mime_guess = "2"
percent-encoding = "2"
png = "0.18"
sha2 = "0.10"
# Persistent multipart inspection needs RustCrypto's serialisable SHA-256 state.
sha2-checkpoint = { package = "sha2", version = "0.11" }
# Decode bounded film metadata and chronological chunks on both native and wasm.
ruzstd = "0.9.1"
hmac = "0.12"
getrandom = "0.3"
time = "0.3"
tower-http = { version = "0.6", features = ["fs"], optional = true }
# Packing extracted game art for the web (art_pack.rs): meshoptimizer's
# codecs for glb geometry, Brotli and gzip copies of everything else.
meshopt = { version = "0.7", optional = true }
brotli = { version = "9", optional = true }
flate2 = { version = "1", optional = true }
# The extractor's pictures (surface textures, pre-drawn views) as WebP.
webp = { version = "0.3", default-features = false, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
time = { version = "0.3", features = ["wasm-bindgen"] }
web-time = "1"
wasm-bindgen-futures = "0.4"
gloo-timers = { version = "0.3", features = ["futures"] }
# A JavaScript timer is not `Send`; a Worker has one thread, and axum wants
# `Send` handler futures.
send_wrapper = { version = "0.6", features = ["futures"] }

[features]
default = ["native"]
# The store tests every EventStore must pass, for stores in other crates
# (the Worker's D1 store).
conformance = []
native = [
    "dep:axum-server",
    "dep:rustls",
    "dep:sqlx",
    "dep:reqwest",
    "dep:tower-http",
    "dep:meshopt",
    "dep:brotli",
    "dep:flate2",
    "dep:webp",
    "object_store/fs",
    "object_store/aws-base",
    "object_store/reqwest",
    "object_store/ring",
    "tokio/fs",
    "tokio/net",
    "dep:tokio-tungstenite",
    "tokio/rt-multi-thread",
    "axum/ws",
    "axum/tokio",
    "axum/http1",
    "axum/http2",
    "axum/tower-log",
    "axum/tracing",
]

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "rt-multi-thread", "macros"] }
# tests/relay.rs: two co-op peers through the relay.
coop = { path = "../coop" }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio-tungstenite = "0.26"
base64 = "0.22"
# examples/fake_game.rs
ureq = { version = "2", default-features = false, features = ["json"] }
tungstenite = "0.26"
# tests/s3_server.rs: a real S3 protocol server (s3s, backed by a directory)
# for the blob store, in process.
s3s = "0.17"
s3s-fs = "0.17"
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
# benches/telemetry.rs: process CPU time (getrusage).
libc = "0.2"

# Plain-loop benches, no Criterion (as crates/platform/d3d):
# `cargo bench -p live-server --bench telemetry`.
[[bench]]
name = "telemetry"
harness = false
required-features = ["native"]

[[bin]]
name = "h2-live-server"
path = "src/bin/h2-live-server.rs"
required-features = ["native"]
