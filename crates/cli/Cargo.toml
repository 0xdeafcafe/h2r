[package]
name = "cli"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "h2"
path = "src/main.rs"

[dependencies]
hs.workspace = true
tags.workspace = true
shaders = { path = "../shaders" }
font = { path = "../font" }
assets.workspace = true
map.workspace = true
xiso.workspace = true
movies.workspace = true
xbe.workspace = true
analyze.workspace = true
symbols.workspace = true
lift.workspace = true
emit.workspace = true
ir.workspace = true
anyhow.workspace = true
sha2 = "0.10"
audio = { path = "../audio", default-features = false }
iced-x86 = { version = "1", default-features = false, features = ["std", "decoder", "intel"] }
asf = { path = "../asf" }
wma = { path = "../wma" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
