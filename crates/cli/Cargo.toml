[package]
name = "cli"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "h2"
path = "src/main.rs"

[dependencies]
# The default data root (`content::store::default_data_root`).
content.workspace = true
hs.workspace = true
tags.workspace = true
shaders = { path = "../shaders" }
font = { path = "../font" }
assets.workspace = true
map.workspace = true
xiso.workspace = true
movies.workspace = true
xbe.workspace = true
analyze.workspace = true
symbols.workspace = true
lift.workspace = true
emit.workspace = true
ir.workspace = true
anyhow.workspace = true
# Enable runtime-detected ARM SHA instructions for full-image cache validation.
sha2 = { version = "0.10", features = ["asm"] }
boot.workspace = true
# Our settings (play --set, h2 settings).
settings = { path = "../settings" }
timeline = { path = "../timeline" }
app = { path = "../app" }
lockstep = { path = "../lockstep" }
d3d = { path = "../d3d" }
kernel.workspace = true
input = { path = "../input", default-features = false }
# The controller-speaker settings and side output (play_cmd).
dsound = { path = "../dsound" }
audio = { path = "../audio" }
vfs.workspace = true
iced-x86 = { version = "1", default-features = false, features = ["std", "decoder", "intel"] }
asf = { path = "../asf" }
wma = { path = "../wma" }
live-proto.workspace = true
content.workspace = true
live-server.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
# `h2 live account/motd` talk to the service over HTTP or HTTPS.
ureq = { version = "2", default-features = false, features = ["tls"] }
# `h2 live q events --follow` reads the event stream.
tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
# `h2 profile` and `h2 bench` (docs/perf.md): off by default so ordinary
# builds skip the profiler's dependencies. `cargo run -p cli --features perf`.
perf = { path = "../perf", optional = true }

[dev-dependencies]
time = "0.3"
# live_geometry tests: an independent glTF reader for map.glb, and PNG
# decoding for the disc check's contact sheet.
gltf = { version = "1", default-features = false, features = ["names"] }
png = "0.18"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
perf = ["dep:perf", "boot/perf"]
