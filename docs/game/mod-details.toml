[[mod]]
map_id = "ae58d622bc293c026baa1df91ef4d9c6f859670444262b6ce0fd8f803fded6aa"
name = "Cool Dune Mash Pit Mod"
slug = "cool-dune-mash-pit-mod"
description = '''
Cool Dune Mash Pit Mod was uploaded to assassin4hire.com in March 2006 as a DotHalo PPF for Relic (dune.map), about 8 MB, so a large change. The description is a weapon-swap list: BR becomes a full-auto sniper with 360 auto-aim; uncharged plasma pistol becomes a flying turret that looks like a Wraith, charged one makes a warthog fly for you; magnum becomes a frag grenade; plasma rifle a sticky; frag a fuel rod; sticky a Wraith shot; carbine a very strong weapon; SMG a rocket; and rocket a sniper tower base. The uploader is unknown and the post's wording confused its own commenters.'''
original_description = '''
assassin4hire (17/03/2006): "br= sniper 360 aa+fa ... smg=rocket / rocket=sniper tower base / and more try it"'''
description_sources = ["https://web.archive.org/web/20060721074109/http://www.assassin4hire.com:80/upload/details.php?file=233"]

[[mod]]
map_id = "5b5b00e376a1c3349943f718743c167d39c8e3b5862b9a6b6fb09f717d6bc67a"
name = "DKong"
slug = "kong-extreme"
pack = "phantom-mappack"
description = '''
Donkey Kong Extreme is a Containment map by killershard and A G1mp, released on Se7ensins on 2007-06-29: a six-level obstacle course where you climb each level to a flag that teleports you to the next. It uses Warthog and Ghost jumps, exploding barrels, falling cores and plasma grenades, rockets, wraith shots and moving bridges, ending in an area with a plasma pistol, sniper and rockets. Extras are a Mario-themed Warthog, a golden sand skin, a switch that disables spawners for 40 seconds, a secret modders' area and Mario tunes in the hog. It was included in Phantom Mappack v1 as DKong and was SLC compatible.'''
original_description = '''
Release post: "This map consists of 6 Levels, at the top of each level the player must walk into the flag, of which teleports them to the next corresponding level."'''
description_sources = ["https://web.archive.org/web/20200921160926/https://www.se7ensins.com/forums/threads/donkey-kong-extreme-edition.21701/", "https://web.archive.org/web/20120126045314/http://www.se7ensins.com/forums/threads/phantom-map-pack-v1-and-v2.185536/"]

