name = "Wake_Island"
slug = "pm2-wake"
pack = "phantom-mappack"
description = '''
Wake_Island is a Phantom Mappack v2 map built on Waterworks, retextured into a rainy, pine-covered island with the Waterworks base structure on the shore; Connor Tumbleson wrote that he could only tell it was Waterworks after patching it. The Phantom release list credits Darkshallfall, though Connor's 2021 photo post labelled it Ace Mods. Beyond the look, what else changed is undocumented.'''
