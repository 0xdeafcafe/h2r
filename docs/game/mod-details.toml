[[mod]]
map_id = "28e4e22a1b06ad30263b4ab7320776ca61dc823155668c2e8a2b46969bab716e"
name = "Nightwinder 2"
slug = "nightwinder-2"
description = '''
Nightwinder 2 by MrMurder brings the snowy, atmospheric Halo 1 Nightwinder look to Halo 2 on top of Containment: new weather, a darker lightmap, extra working containment gates and scenery, six teleporter pairs, new weapon models and skins, and a rebalanced sandbox. Connor Tumbleson called it polished and excellent to play with friends. It was first posted on halomods.com on 2007-03-18, re-uploaded to Remnantmods as an updated version, and included in the Phantom Mappack. Phantom Mappack is the iBotModz-community pack compiled by iBotPeaches (Connor Tumbleson, posting as BrainHacker): 90 community maps split into v1 and v2 of 45 each, with a custom main menu and an auto-patcher, finished in January 2010 and announced on Se7enSins on 2010-03-31. It was distributed as Serenity patches; the map here is the pre-built version from the archived pack.'''
original_description = '''
Connor Tumbleson: "This was Nightwinder 2 by MrMurder. This modification had new models for weapons, new skins and an entire new balanced sandbox of weapons."'''
description_sources = ["https://connortumbleson.com/2016/05/06/phantom-mappack-project/", "https://archive.org/details/nightwinder2", "https://web.archive.org/web/20120126045314/http://www.se7ensins.com/forums/threads/phantom-map-pack-v1-and-v2.185536/"]

