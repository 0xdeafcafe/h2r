[[pack]]
id = "group-bocked"
name = "Group Bocked PPFs"
description = '''
Early Halo 2 weapon and vehicle mods from Group Bocked, a modding group founded in 2004 by norulezapply and hosted on halomods.com: new guns made from existing tags (the Gravity Rifle, Fusion Coil Gun, Coconut Gun, a nuke launcher), Wraith grenades, a beefed-up Warthog and dual wielding anything. Released as PPF patches through 2005.'''
authors = ["Group Bocked"]
released = "2005"
source_url = "https://web.archive.org/web/2005/http://www.halomods.com/bocked/index.php?id=ppfs"

[[pack]]
id = "doorm4n-legacy"
name = "DoorM4n's Legacy Map-Pack"
description = '''
DoorM4n's custom Halo 2 maps from 2011 to 2014 (first posted on Remnantmods), compiled as the Legacy Map-Pack v1.1 in June 2019 with a custom main menu. Whole modded maps: new layouts on retail geometry, ported vehicles and heavy scenery work.'''
authors = ["DoorM4n"]
released = "2019-06-02"
source_url = "https://www.se7ensins.com/forums/threads/xbox-halo-2-modded-map-pack-repository-active-2026.1754281/"

[[pack]]
