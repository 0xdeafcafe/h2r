[[mod]]
map_id = "b6e74c842a981a904a0001f14c92753ac550681f8055ec50d6a16c7f6ada0599"
name = "Marines vs Teh Flood"
slug = "marines-vs-teh-flood"
pack = "ai-revision"
description = '''
Marines vs Teh Flood is a Halo 2 Remapped AI Revision map by T Beezie on Lockout: marines and Flood as AI opponents. Specifics are otherwise undocumented. Halo 2 Remapped AI Revision is the 17-map pack Zone 117 released on 2007-06-16 (halomods.com and Se7enSins). Every map is a multiplayer map with AI added, so you can play CTF, Team Slayer or Territories alongside AI bots; the pack requires launching through the Xored trainer launcher with Yelo, which enables AI, and its auto-patcher was written by Detox.'''
description_sources = ["https://web.archive.org/web/20090208202552/http://www.halomods.com/forums/viewtopic.php?t=61177", "https://www.se7ensins.com/forums/threads/halo-2-remapped-ai-revision.20413/"]

[[mod]]
map_id = "5982c604386af8441a75082238a05ad257ffe61d69c7c23f18b1803a10a52251"
name = "Lockout Paintball"
slug = "lockout-paintball"
pack = "phantom-mappack"
description = '''
Lockout Paintball by Barringer is a paintball-style mod of Lockout, from Phantom Mappack v2; a gameplay video shows Slayer on the map. No readme is known, so the exact changes are undocumented. Phantom Mappack is the iBotModz-community pack compiled by iBotPeaches (Connor Tumbleson, posting as BrainHacker): 90 community maps split into v1 and v2 of 45 each, with a custom main menu and an auto-patcher, finished in January 2010 and announced on Se7enSins on 2010-03-31. It was distributed as Serenity patches; the map here is the pre-built version from the archived pack.'''
description_sources = ["https://web.archive.org/web/20120126045314/http://www.se7ensins.com/forums/threads/phantom-map-pack-v1-and-v2.185536/", "https://www.youtube.com/watch?v=HbSHUtpBPlE"]

