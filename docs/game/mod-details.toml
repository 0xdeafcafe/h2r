# Published mods' details for h2 live (live.forbes.red), as of 2026-11-19:
# a better description per package, its screenshots and where they came from,
# the map pack it came out in, and each pack's own info.
#
# Apply with an admin account (images are uploaded as content by --as):
#
#   h2 live maps details --file docs/game/mod-details.toml \
#     --images "$TMPDIR/mod-images" --contents "$TMPDIR/mod-contents" --as afr --dry-run
#
# then the same without --dry-run. Images are not in git: [[mod.image]] and
# [[pack.image]] name files in IMAGES/<slug>/ and IMAGES/pack-<id>/, which
# image_url says where they were downloaded from. Reports come from
# `h2 live maps analyze --map-id ID --out CONTENTS/<slug>.toml`.
#
# Keys read (crates/apps/cli/src/live_maps_details.rs): [[pack]] id, name, description,
# authors, released, source_url, [[pack.image]]; [[mod]] map_id, name, slug, pack,
# description, features, [[mod.image]] file, caption, source_url, credit, licence.
# original_description, description_sources and image_url are for the reader.
# Image licences are unknown unless stated: each is credited to who made it and
# linked to where it was posted. Descriptions are our own words over the sources
# listed; "undocumented" means nothing more was found.
#
# Researched 2026-11-19: release posts and readmes (archive.org copies of
# halomods.com, assassin4hire.com, theppfnoobs.com, se7ensins.com), Connor
# Tumbleson's Phantom Mappack posts, and YouTube videos clearly of the map.

[[pack]]
id = "phantom-mappack"
name = "Phantom Mappack"
description = '''
The iBotModz community's collection of custom Halo 2 maps, compiled by iBotPeaches (Connor Tumbleson, posting as BrainHacker) and released in two volumes from January 2010. Each map is credited to its own author; iBotPeaches compiled the pack and its custom main menu. The maps were first shared as Serenity patches; these packages are the pre-built maps from the archived pack.'''
authors = ["iBotPeaches"]
released = "2010-01-08"
source_url = "https://web.archive.org/web/20120126045314/http://www.se7ensins.com/forums/threads/phantom-map-pack-v1-and-v2.185536/"

[[pack]]
id = "ai-revision"
name = "Halo 2 Remapped AI Revision"
description = '''
A pack of multiplayer maps with AI added (Flood, Covenant and Marines fighting in multiplayer levels), released on halomods.com in June 2007. Zone 117 compiled it and made its main menu; Detox wrote the auto-patcher. On the original Xbox the AI only ran when the pack was launched through the Xored launcher with the Yelo trainer.'''
authors = ["Zone 117", "Detox"]
released = "2007-06-16"
source_url = "https://web.archive.org/web/20090208202552/http://www.halomods.com/forums/viewtopic.php?t=61177"

[[pack]]
id = "ownage-modz"
name = "Ownage Modz"
description = '''
Synch's set of PPF patches for the Multiplayer Map Pack maps (Backwash, Containment, Elongation, Gemini, Relic, Sanctuary, Terminal, Turf, Warlock), dated 1 January 2006 in its readme and shared on assassin4hire.com.'''
authors = ["Synch"]
released = "2006-01-01"
source_url = "https://web.archive.org/web/2007/http://www.assassin4hire.com/upload/uploads/upload-1136181867-Ownage%20Modz.rar"

[[pack]]
id = "ppfnoobs-map-package"
name = "The PPF Noobs Map Package"
description = '''
The PPF Noobs' PPF patches for the twelve original Halo 2 multiplayer maps, released in autumn 2006 on theppfnoobs.com (site run by l PPF l NeoN, l PPF l H3MP and l PPF l JXModz). Fun and cheat-style changes for playing with friends: weapon and vehicle swaps, auto-aim and the like.'''
authors = ["The PPF Noobs"]
released = "2006-10"
source_url = "https://web.archive.org/web/20070112055613/http://www.theppfnoobs.com/"

[[pack]]
id = "ppfnoobs-old-map-pack-v2"
name = "The PPF Noobs Old Map Package v2"
description = '''
l PPF l NeoN's 2007 package of the original Halo 2 maps for playing on Xbox Live: 360 auto-aim, infinite ammo and rapid fire on every weapon, wall walking, most invisible walls removed, teleporters on some maps, Banshee bombs and a Carbine spawn for the host. The maps are not reskinned; the pack's main menu patch adds the PPF Noobs logo.'''
authors = ["l PPF l NeoN"]
released = "2007"
source_url = "https://web.archive.org/web/20070212045131/http://theppfnoobs.com:80/modz.html"

