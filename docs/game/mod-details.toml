Night Ops is a Halo 2 Remapped AI Revision map by T Beezie built on Containment; a gameplay video shows a green night-vision-style filter over Team Slayer with AI on the field. No written description survives, so the AI setup is otherwise undocumented. Halo 2 Remapped AI Revision is the 17-map pack Zone 117 released on 2007-06-16 (halomods.com and Se7enSins). Every map is a multiplayer map with AI added, so you can play CTF, Team Slayer or Territories alongside AI bots; the pack requires launching through the Xored trainer launcher with Yelo, which enables AI, and its auto-patcher was written by Detox.'''
