pack = "group-bocked"
description = '''
The Landfill (also called The Secret Level) is a 2005 patch by NRA, hosted with the Group Bocked patches on halomods.com. It patches the UK PAL mainmenu.map to add a secret level reachable from the main menu. The patch has no block check, so it applies blindly; confirm it against your own disc's map.'''
original_description = '''
Group Bocked PPFs page: "The Landfill AKA The Secret Level. Map: Mainmenu (UK PAL). Effect: Adds a secret level."'''
description_sources = ["https://web.archive.org/web/2005/http://www.halomods.com/bocked/index.php?id=ppfs"]

