[[mod]]
map_id = "eb81955720abd5bca3a3e17cdd7046db8ed2540808d8ada930208dc72f13fda7"
name = "Zanzibar Squads"
slug = "air-zanzibar-squads"
pack = "ai-revision"
description = '''
Zanzibar Squads is a Halo 2 Remapped AI Revision map by MilyardoX2 that adds squads of AI to Zanzibar, so you play the usual modes alongside AI bots. Specifics are undocumented; the map's scenario is named zanzibar_squads. Halo 2 Remapped AI Revision is the 17-map pack Zone 117 released on 2007-06-16 (halomods.com and Se7enSins). Every map is a multiplayer map with AI added, so you can play CTF, Team Slayer or Territories alongside AI bots; the pack requires launching through the Xored trainer launcher with Yelo, which enables AI, and its auto-patcher was written by Detox.'''
description_sources = ["https://web.archive.org/web/20090208202552/http://www.halomods.com/forums/viewtopic.php?t=61177", "https://www.se7ensins.com/forums/threads/halo-2-remapped-ai-revision.20413/", "https://ibotmodz.net/topic/147-halo-2-ai-revision-mappack/"]

[[mod]]
map_id = "5acdecdfbbfb69c69c4b1ca4b275134c5077766fd1603132c116bd6f3d5765b0"
name = "Zombiebar"
slug = "zombiebar"
pack = "ai-revision"
description = '''
Zombiebar is a Halo 2 Remapped AI Revision map by Badsmiley that is, by name, a zombie take on Zanzibar with AI; no description survives. Halo 2 Remapped AI Revision is the 17-map pack Zone 117 released on 2007-06-16 (halomods.com and Se7enSins). Every map is a multiplayer map with AI added, so you can play CTF, Team Slayer or Territories alongside AI bots; the pack requires launching through the Xored trainer launcher with Yelo, which enables AI, and its auto-patcher was written by Detox.'''
description_sources = ["https://web.archive.org/web/20090208202552/http://www.halomods.com/forums/viewtopic.php?t=61177", "https://www.se7ensins.com/forums/threads/halo-2-remapped-ai-revision.20413/"]

[[mod]]
map_id = "9143891a7eb36edf3862e91a2d8a19a74e520fcc0432535c4c967540bf827329"
name = "Canyon (Relic)"
slug = "canyon-relic"
description = '''
Canyon was uploaded to assassin4hire.com on 2006-03-29 as a DotHalo PPF patch of Relic (dune.map), about 7 MB uncompressed, so it changes a lot. The upload had no description or credited author and commenters at the time could not tell which map it was for, with guesses ranging from Coagulation to an old map. Its patch data opens like Cool Dune Mash Pit Mod, so the two may share an author, but that is unproven. What it does is undocumented.'''
original_description = '''
assassin4hire details page: title "Canyon", no description; commenters: "what map is this for".'''
description_sources = ["https://web.archive.org/web/2006/http://www.assassin4hire.com/upload/details.php?file=247"]

[[mod]]
map_id = "cf0df3b82a7720c0b15eb05afdc0060f1dac35d5a5268310f1c9aa8f9c744fb5"
name = "Q*bert"
slug = "qbert"
pack = "phantom-mappack"
description = '''
Q*bert is a Q*bert-themed map by CaptPoopface on Containment, listed as qBert v3 in the Phantom Mappack v1 release list. No readme or description is known, so the gameplay is undocumented. Phantom Mappack is the iBotModz-community pack compiled by iBotPeaches (Connor Tumbleson, posting as BrainHacker): 90 community maps split into v1 and v2 of 45 each, with a custom main menu and an auto-patcher, finished in January 2010 and announced on Se7enSins on 2010-03-31. It was distributed as Serenity patches; the map here is the pre-built version from the archived pack.'''
description_sources = ["https://web.archive.org/web/20120126045314/http://www.se7ensins.com/forums/threads/phantom-map-pack-v1-and-v2.185536/", "https://connortumbleson.com/2016/05/06/phantom-mappack-project/"]

[[mod]]
map_id = "ae915ea40fe543f5d73ea8bda5e71e7319b43892f59f3b94c2433538d49fbb02"
name = "Ownage Modz Warlock"
slug = "ownage-modz-warlock"
pack = "ownage-modz"
description = '''
Ownage Modz Warlock is one of nine Live matchmaking cheat patches in Ownage Modz by Synch (1 Jan 2006), made for the Multiplayer Map Pack maps; this one patches Warlock and adds superspeed, superjump, 360 auto-aim on the BR, a fully automatic dual-wieldable BR with 10,000 rounds, and dual-wieldable bomb, ball and flag. The readme is blunt that these are not 'fun' mods: using them in matchmaking will get you banned within hours, and the patched map must be re-signed with CMR to load. The pack was posted on assassin4hire.com.'''
original_description = '''
Read Me: "Ownage Modz By Synch - 1/1/06. These mods are made specifically for Halo 2 Matchmaking on Xbox Live, they are not FUN mods."'''
description_sources = ["https://web.archive.org/web/2007/http://www.assassin4hire.com/upload/uploads/upload-1136181867-Ownage%20Modz.rar"]

