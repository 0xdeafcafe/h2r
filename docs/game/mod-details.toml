A pack of the twelve original Halo 2 multiplayer maps, modified, from the Se7ensins Halo 2 modded map pack repository. It has no readme and nobody is credited; what each map changes is read off the maps themselves.'''
authors = []
source_url = "https://www.se7ensins.com/forums/threads/xbox-halo-2-modded-map-pack-repository-active-2026.1754281/"

[[pack]]
id = "justcallmesteves"
name = "Justcallmesteves Mappack"
description = '''
A cheat-style pack of the original Halo 2 multiplayer maps from the Se7ensins repository's cheating map packs. Its readme only says how to launch it ("Feel free to modify as you wish. I got lazy."); what each map changes is read off the maps themselves.'''
authors = []
source_url = "https://www.se7ensins.com/forums/threads/xbox-halo-2-modded-map-pack-repository-active-2026.1754281/"

[[mod]]
map_id = "87b89ba841c37fd0ac71ee6ff19dc542d170478962cf7def6ab3d849e4c9553d"
name = "Skyline (Real Time Shadows)"
slug = "doorm4n-skylinerts"
pack = "doorm4n-legacy"
description = '''
The Real Time Shadows (RTS) variant of DoorM4n's Skyline, a custom rooftop map built on the Ivory Tower (Cyclotron) geometry. The difference from plain Skyline is lighting: the spotlights cast real-time shadows, which looks better but is buggier and lags more. DoorM4n himself recommends the original for combat and says he included RTS only because he had debated making it. It ships in DoorM4n's Legacy Map-Pack v1.1 (compiled 2019-06-02); the original release was posted on Remnantmods on 2014-07-30.'''
original_description = '''
Readme: "With the Skyline (Real Time Shadows aka RTS) patch, the map has real lighting coming from the spotlights. RTS is buggy at times, but it adds a much more real environment... I prefer the original."'''
description_sources = ["https://www.se7ensins.com/forums/threads/xbox-halo-2-modded-map-pack-repository-active-2026.1754281/", "https://www.remnantmods.com/forums/viewforum.php?f=11"]

[[mod]]
map_id = "cb7de68f008b8e133ca4a93bf5599785563f2008f89963c6b02eeef07d30271a"
name = "Skyline"
slug = "doorm4n-skyline"
pack = "doorm4n-legacy"
description = '''
Skyline is DoorM4n's custom rooftop combat map built on the Ivory Tower (Cyclotron) geometry, with a Wasp ported from Halo CE that you can fly over the rooftops. The readme calls this version best for SLC and multiplayer combat, and notes an added banshee barrier that stops players flying out through the BSP. Known problems are falling off the Wasp mid-flight, CTF probably not working and poor team spawning; Territories, Oddball and King of the Hill should work. DoorM4n released it on Remnantmods in July 2014, and it is in his Legacy Map-Pack v1.1.'''
original_description = '''
Readme: "Skyline (original) is best for SLC and multiplayer combat... CTF gametypes may not work. Territories, oddball, and King of Hill should work."'''
description_sources = ["https://www.se7ensins.com/forums/threads/xbox-halo-2-modded-map-pack-repository-active-2026.1754281/", "https://www.remnantmods.com/forums/viewforum.php?f=11"]

[[mod]]
map_id = "9d7c803dec1364ad281b55ee0afc37e67f83c1d53dc630aa32344deb492b7cd7"
name = "Lego"
slug = "doorm4n-lego"
pack = "doorm4n-legacy"
description = '''
Lego is a custom map by DoorM4n from his Legacy Map-Pack v1.1; the Se7ensins repository lists it as Lego Halo. It is a whole map the same size as retail Lockout and the map data shows changed vehicles, weapons and textures, but no readme or release post describing it has been found. Beyond the name, what it contains is undocumented.'''
description_sources = ["https://www.se7ensins.com/forums/threads/xbox-halo-2-modded-map-pack-repository-active-2026.1754281/"]

[[mod]]
map_id = "fc9a5c7785e1f776307eb23474bd7fad3a2101ee4a3ad3b93c23b13796d12855"
name = "Jurassic Ravine"
slug = "doorm4n-jurrasic"
pack = "doorm4n-legacy"
description = '''
Jurassic Ravine is an ambience mod for Beaver Creek: DoorM4n filled the map with over 50 palm trees, 100+ shrubs and a giant canopy, and added jungle and temple sounds to give it a prehistoric feel. It is not a new layout, just a new look and a more tactical Slayer match as players push through the undergrowth. The one known bug is lag from the volume of spawned scenery. This is the whole-map version from his Legacy Map-Pack; the standalone patch was posted on Remnantmods on 2014-08-02, crediting the Remnantmods team for the item-spawning technique.'''
original_description = '''
Readme: "Jurassic Ravine, an ambiance mod for beavercreek... spawning over 50 palm trees, 100+ shrubs, and the giant canopy... Minor Bugs: Some gameplay lag from all of the items spawned."'''
description_sources = ["https://www.se7ensins.com/forums/threads/xbox-halo-2-modded-map-pack-repository-active-2026.1754281/", "https://www.remnantmods.com/forums/viewforum.php?f=11"]

