# Halo 2 (Xbox) map mods found for h2 live, 2026-11-19: candidates to import.
# Metadata only: no mod files are kept in git. Researched from ibotmodz.net,
# halomaps, se7ensins and archive.org copies; formats checked on downloads.
#
# fit: good = the importer takes it (PPF/IPS/BPS or a whole .map of a disc or
#   Map Pack map); whole-map = a whole .map whose map header names a retail map
#   (imports over that base; a total conversion makes a large BPS delta);
#   unknown-base = no base map known yet (download missing or header unread);
#   unsupported-format = SPPF / Serenity / xdelta (no reader yet, maps.md §6);
#   needs-shared = patches mainmenu/shared (not a playable map package).
# authors: as the release credits them; [] = not found.

