source_url = "https://ibotmodz.net/files/file/36-biohazard-ii-the-breach/"
fit = "unsupported-format"
description = "Flood outbreak map on Zanzibar: dead bodies, Glock, M16, M4+M203, FloodFlame, Fuel Rod Rifle, Disruptor Beam."
notes = "Download link is dead (MediaFire file removed, ibotfiles.com gone, FileFront gone, or ibotmodz gives no redirect), nothing downloaded. Format is not PPF/IPS/BPS: .sppf is a Super PPF \"sized\" patch (observed header bytes are raw little-endian u32 records, no PPF magic) and .serenity is a Serenity patch (observed to start 14 00 00 0f). The importer would need an sppf or serenity reader."

