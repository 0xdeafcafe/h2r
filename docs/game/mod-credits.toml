# Who made each mod published on h2 live (live.forbes.red), as of 2026-11-19.
#
# Every package below was imported and published by the account "afr", which
# is the uploader, not the author. This file is the correction: the original
# author(s) as the release credited them (handles kept as written), the
# original release's name and date when known, and where it came from.
#
# Apply it with an admin account (or the operator's key, --data DIR):
#
#   h2 live maps credit --file docs/game/mod-credits.toml --dry-run
#   h2 live maps credit --file docs/game/mod-credits.toml
#
# Each [[mod]] is checked against the server first (the map_id must be listed
# under that name); packages already credited so are left alone. The server
# records an admin's credit as a server-signed MapCredited event; the
# manifest the uploader signed, and its MapId, are unchanged
# (docs/game/maps.md section 5, "Credits").
#
# Keys read: map_id, name, authors, release, released (YYYY, YYYY-MM or
# YYYY-MM-DD), source_url, notes. `base`, `confidence` and `evidence` are for
# the reader. authors = [] means nobody could be found: the package then
# says "unknown author", never the uploader.
#
# Researched 2026-11-19 from the original release posts, readmes and patch
# headers (archive.org / web.archive.org copies of halomods.com,
# assassin4hire.com, theppfnoobs.com, se7ensins.com); see each `evidence`.

