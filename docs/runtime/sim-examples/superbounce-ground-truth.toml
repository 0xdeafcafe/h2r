# The bounce drill's ground truth (docs/runtime/sim.md, "The bounce
# drill"): `h2 sim run` this file. One bot on Ascension tries the
# measured spot only, the recipe's way (docs/game/superbounce.md, "The
# forced crouch leaves state"): it walks to the takeoff on the upper level,
# the sim sets its pair word to -3 there (as `havok.pair.set` does), and
# the try is the running jump off the level onto the patch at -5.4. Each
# try starts again from the takeoff, so the report's `bounce` block counts
# the final approach and the jump alone: a try that doesn't bounce here is
# the bot's execution, not its prime.
map = "ascension"
game_type = "slayer"
time_limit_s = 900    # longer than max_ticks: the tick limit ends it
score_limit = 50      # nobody scores: a practising bot never fights
team_play = true      # free-for-all sims end at tick 0 (a sim bug)
seed = 1
max_ticks = 9000      # 5 minutes at 30 ticks a second
max_wall_s = 900
render_every = 0
pace = "unpaced"
superbounce = true

[drill]
site = [-10.62, 3.88, -3.19]   # glitches::SPOTS[0], the measured patch
# start: unset, the spot's takeoff (-8.4, 2.5, -0.76)

[[bot]]
name = "Bouncer 1"
team = 0
kind = "phantom"
skill = "legendary"
params = "tuning/bounce-base.toml"
