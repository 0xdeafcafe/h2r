# The default hopper's playlists: a classic Halo 2 lineup written as data
# (crates/live/live-proto/src/hopper/defaults.rs builds the same lineup in
# Rust; docs/live/live-matchmaking.md, "6.8 The default set"). A map is
# named as the level list names it; the server resolves each name to its
# map id. An entry's `variant` is the key of a matchmaking script
# (`rules/matchmaking/<key>.rules`) and `maps` is a list or the name of one
# of the lists below. A playlist with `entries_of` plays the entries of
# the playlist with that id. The first eight are the human playlists, the
# rest Clankermatch's.

[maps]
small_ffa = ["Lockout", "Midship", "Ivory Tower", "Beaver Creek", "Ascension", "Foundation", "Warlock", "Sanctuary", "Elongation", "Gemini"]
small_team = ["Lockout", "Midship", "Ivory Tower", "Beaver Creek", "Ascension", "Colossus", "Foundation", "Warlock", "Sanctuary", "Turf", "Elongation", "Backwash", "Relic"]
big = ["Coagulation", "Headlong", "Zanzibar", "Waterworks", "Burial Mounds", "Containment", "Terminal", "Relic", "Gemini"]

[[playlist]]
id = 1
title = "Rumble Pit"
description = "Every player for themselves, up to 8. Slayer, with some Oddball and King of the Hill."
rules = { kind = "free-for-all", ranked = true, players = [4, 8] }
base_wait_ms = 30000
search_timeout_ms = 150000

[[playlist.entry]]
variant = "rumble_slayer"
maps = "small_ffa"
weight = 10

[[playlist.entry]]
variant = "oddball"
maps = ["Lockout", "Midship", "Warlock"]
weight = 3

[[playlist.entry]]
variant = "king_of_the_hill"
maps = ["Ivory Tower", "Ascension", "Sanctuary"]
weight = 3

[[playlist]]
id = 2
title = "Team Slayer"
