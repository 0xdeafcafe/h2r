# The Forge readout (docs/game/forge-map-variants-ui.md): three rows of
# text under the aimed thing, as the superbounce readout's, then marks on
# the level: the selection's bracket, the placement ring, the facing arrow,
# the mark under and the one it came from, twelve near marks and eight
# zone lines. Elements in draw order.
name: forge-readout
elements:
  - id: fgr.name
    kind: text
    font: hud
    justify: start
    longest: "Assault Rifle Ammo Cache Crate"
    at: {anchor: bottom-left, full: [101, -68]}
  - id: fgr.facts
    kind: text
    font: hud
    justify: start
    longest: "Starting point  Neutral  Slayer, CTF, KotH"
    at: {anchor: bottom-left, full: [101, -47]}
  - id: fgr.guide
    kind: text
    font: hud
    justify: start
    longest: "Item spawners are full (100) in this map."
    at: {anchor: bottom-left, full: [101, -26]}
  - id: fgr.sel
    kind: world-mark
    shape: bracket
    longest: "Assault Rifle Ammo Cache Crate"
  - id: fgr.ring
    kind: world-mark
    shape: pipper
  - id: fgr.face
    kind: world-mark
    shape: arrow
  - id: fgr.under
    kind: world-mark
    shape: pipper
  - id: fgr.from
    kind: world-mark
    shape: bracket
  - id: fgr.near.1
    kind: world-mark
