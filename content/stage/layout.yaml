# The content stage's layout (docs/editor/content-stage.md, "Layout").
#
# World units (1 = 3.048 m): +x forward, +y left, +z up; angles in degrees.
# Everything below `bays` is one bay's furniture, relative to the bay's
# origin, and every bay has it. `player` and `player_width` are the player
# biped's standing height and diameter, read from the base map when the
# stage is built. content_kit::stage::layout refuses overlapping footprints.

floor:
  size: 64          # the slab's side, centred on the origin
  label_every: 5    # distance labels and heavy lines
  texels: 1024      # the grid texture's side: 16 texels a unit

# The lights of the three bays (content_kit::stage::light). Levels are in units of
# full light. The sun is the day bay's, and the sky's disc is drawn where
# it is: azimuth in degrees counter-clockwise from +x seen from above,
# elevation over the horizon. The sky fill is what a face looking up takes.
lights:
  sun: { azimuth: 215, elevation: 45, color: [1.0, 0.95, 0.85], power: 1.0 }
  fill: [0.26, 0.30, 0.38]
  flat: 1.0
  dark: 0.03

bays:
  - name: flat
    origin: [0, 0, 0]
    light: flat
  - name: day
    origin: [80, 0, 0]
    light: day
  - name: dark
    origin: [160, 0, 0]
    light: dark
    enclosure: { height: 12, thickness: 1 }

spawn: { at: [0, 0], facing: 0 }

# The pad the content under test stands on.
subject: { at: [3, 0], radius: 1 }

# Numbered pads 1 to 8 for things placed beside the subject.
pads: { first: [-4, -7], step: [2, 0], count: 8, radius: 0.5 }

references:
  # Scale
  - { name: wall, at: [3, 3], box: { size: [4, 0.2, 2] } }
  - { name: pillar, at: [6, 3], box: { size: [0.2, 0.2, player] } }
  - { name: cube, at: [8, 3], box: { size: [1, 1, 1] } }
  - { name: doorway, at: [12, 3], doorway: { opening: [1, 1], post: 0.2, depth: 0.4 } }
  # Movement: the ramps and stairs rise along +y
  - { name: ramp-15, at: [0, 8], facing: 90, ramp: { width: 2, rise: 1, angle: 15 } }
  - { name: ramp-30, at: [4, 8], facing: 90, ramp: { width: 2, rise: 1, angle: 30 } }
  - { name: ramp-45, at: [8, 8], facing: 90, ramp: { width: 2, rise: 1, angle: 45 } }
  - { name: stair-0.1, at: [12, 8], facing: 90, stair: { width: 2, rise: 0.1, tread: 0.4, steps: 5 } }
  - { name: stair-0.2, at: [16, 8], facing: 90, stair: { width: 2, rise: 0.2, tread: 0.4, steps: 5 } }
  - { name: stair-0.3, at: [20, 8], facing: 90, stair: { width: 2, rise: 0.3, tread: 0.4, steps: 5 } }
  - { name: ledge-0.3, at: [0, 14], box: { size: [2, 1, 0.3] } }
  - { name: ledge-0.6, at: [3, 14], box: { size: [2, 1, 0.6] } }
  - { name: ledge-0.9, at: [6, 14], box: { size: [2, 1, 0.9] } }
  - { name: ledge-1.2, at: [9, 14], box: { size: [2, 1, 1.2] } }
  - { name: drop-tower, at: [16, 14], box: { size: [2, 2, 10] } }

cameras:
  fov: 70     # horizontal, degrees
  aim: 0.3    # every camera looks at this height over the subject pad
  eyes:       # from the subject pad's centre
    - { name: ground, at: [-1.5, 0.5, 0.08] }
    - { name: front, at: [2.5, 0, 0.5] }
    - { name: side, at: [0, -2.5, 0.5] }
    - { name: ruler, at: [0, -4, 0.3] }
    - { name: third, at: [-4.5, 0, 0.8] }
  # orbit-0 to orbit-7, round the subject pad from +x towards +y
  orbit: { count: 8, radius: 2, height: 0.6 }
