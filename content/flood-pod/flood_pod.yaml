# The Flood pod (content/flood-pod/README.md): a fleshy seed that falls root
# first and bursts open. A ribbed root bulb on a bone tip, a collar where
# four petals of shell hinge, a sac under them that the squad comes out of,
# ribs and tendrils down the root. Model space, world units (1 = 3.048 m):
# +X forward, +Y left, +Z up, the origin the point of the tip, which is
# where the pod meets the ground. The petals are drawn shut.
