screen: firefight
kind: dialog
layout: settings
backing: over
opener: game-setup.firefight
states:
  focus-0:
    focus: 0
  focus-2:
    focus: 2
  focus-3:
    focus: 3
  focus-5:
    focus: 5
settings:
  host: menu
  icon: skull
  name: "Firefight rules"
  caller:
    label: "Firefight Options..."
    help: "Fight waves of enemies: set the waves, difficulty and lives."
widgets:
  title:
    component: title
    text: "FIREFIGHT"
rows:
  row.0:
    kind: value
    text: "Firefight"
    help: "Fight waves of enemies on a Firefight map."
    setting: firefight.enabled
    explain: "On starts Firefight when the map carries its kit: waves of enemies, shared lives and a score. Off plays the game's own rules."
  row.1:
    kind: value
    text: "Wave set"
    help: "Which set of waves you fight."
    bind: waveset
    explain: "Endless runs sets of three rounds until the team is out. The map's own set follows if any. Holdout is steady, Attrition sends more for fewer lives, Last Stand is hardest, Crossfire is two teams."
  row.2:
    kind: value
    text: "Teams"
    help: "One team, or two that also fight each other."
    setting: firefight.teams
    explain: "One team fights the waves together. Two teams each hold a base and fight the waves and each other. Default is the wave set's own."
  row.3:
    kind: value
    text: "Difficulty"
    help: "How much a kill scores, by difficulty."
    setting: firefight.difficulty
    explain: "Harder difficulties score more for each kill: Easy 75%, Normal 100%, Heroic 125% and Legendary 150%."
  row.4:
    kind: value
    text: "Starting lives"
    help: "How many lives each team starts with."
    setting: firefight.lives
    explain: "Each team's pool of lives. Each death takes one, and each round adds a few more. Default uses the wave set's own pool."
  row.5:
    kind: value
    text: "Skulls"
    help: "Whether each round switches on a skull."
    setting: firefight.skulls
    explain: "Each round switches on another skull, and Endless adds one each new set, which makes the fight harder and scores a little more. Off keeps every round plain."
