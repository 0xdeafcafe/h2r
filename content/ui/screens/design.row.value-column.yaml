screen: design.row.value-column
kind: list
layout: controls
backing: shell
states:
  focused:
    focus: 0
  unfocused:
    focus: 1
  long:
    focus: 2
widgets:
  title:
    component: title
    text: "Column Values"
  legend:
    component: legend
    prompts: [[[Left, Right], "CHANGE"], [B, "BACK"]]
rows:
  row.0:
    kind: value
    text: "Value Row"
    values: ["On", "Off"]
    current: 0
  row.1:
    kind: value
    text: "Second Value Row"
    values: ["Easy", "Normal", "Heroic", "Legendary"]
    current: 1
  row.2:
    kind: value
    text: "A Longer Value Row"
    values: ["Off", "On"]
    current: 0
