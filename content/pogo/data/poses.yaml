# The Pogo Stick's rider poses (docs/game/pogo-stick.md, "The pose"),
# read by crates/extensions/game/src/pogo_pose.rs.
#
# Every number here is hand-keyed and unseen: nothing has been run in a
# game, so the look of each pose is not checked. The tests hold the
# contacts (feet on pegs, hands on grips) on a made-up skeleton, not the
# look.
#
# Space: the body frame. Its origin is the pelvis joint where the game has
# it, +X the way the body faces, +Y its left, +Z up. Lengths are world
# units (1 = 3.048 m). Angles are degrees; a pitch is about the left axis
# and positive leans forward. A vector given for one side is the LEFT
# side's; the right side's is its mirror (Y negated), unless it says so.
#
# bones: the skeleton's node names by role. Each role is a list of names,
#   the first one found is used, compared in lower case. The retail
#   models' names are not recorded in the repository, so the lists are the
#   usual Halo 2 spellings first and other plausible ones after. pelvis,
#   and each side's six, are required: a model lacking one is not posed.
#   spine is a list of segments, lowest first, each its own list of names;
#   spine, neck and head may be absent.
#
# mounted: the rider on the stick.
#   pelvis_over_pegs  height of the pelvis joint over the pegs' tops
#   stick_forward     how far ahead of the pelvis joint the stick stands
#   tuck_lift         how far the pegs (and the stick) come up toward the
#                     pelvis at full tuck, in flight
#   pelvis_pitch      the pelvis' lean
#   spine_pitch       added at each spine segment
#   neck_pitch, head_pitch  added at the neck and at the head
#   sole              the point of the foot that sits on a peg, from the
#                     foot's joint, model space
#   palm              the point of the hand that sits on a grip, from the
#                     hand's joint, model space
#   hand_yaw          the hand's turn about the up axis from its rest
#                     pose, left hand positive, right mirrored
#   knee              where the left knee points
#   elbow             where the left elbow points
#
# tricks: what each trick changes at its height (the flips are whole
#   turns of the mounted pose and have no numbers).
#   no_hander.hand         the left hand's joint, from the pelvis joint
#   no_hander.spine_pitch  added at each spine segment (chest up)
#   can_can.foot           the RIGHT foot's joint, from the pelvis joint,
#                          as written (not mirrored): across to the left
#   bar_spin.hand_lift     how far the left hand's joint lifts off its
#                          grip while the stick turns under it
#   bar_spin.hop           how far the feet's joints lift off the pegs
#   superman.pelvis        the pelvis joint's move, back and up
#   superman.pelvis_pitch, spine_pitch, head_pitch  the lean, in place of
#                          the mounted pose's
#   superman.foot_pitch    the feet's pitch (toes back)
#   superman.foot          the left foot's joint, from the moved pelvis

bones:
  pelvis: [pelvis, bip01 pelvis, hips, root]
  spine:
    - [spine, spine0, bip01 spine, torso]
    - [spine1, bip01 spine1, chest]
  neck: [neck, bip01 neck]
  head: [head, bip01 head]
  left:
    thigh: [l_thigh, left_thigh, bip01 l thigh, l_upperleg]
    calf: [l_calf, left_calf, bip01 l calf, l_lowerleg, l_shin]
    foot: [l_foot, left_foot, bip01 l foot]
    upper_arm: [l_upperarm, left_upperarm, bip01 l upperarm, l_upper_arm]
    forearm: [l_forearm, left_forearm, bip01 l forearm, l_lowerarm]
    hand: [l_hand, left_hand, bip01 l hand]
  right:
    thigh: [r_thigh, right_thigh, bip01 r thigh, r_upperleg]
    calf: [r_calf, right_calf, bip01 r calf, r_lowerleg, r_shin]
    foot: [r_foot, right_foot, bip01 r foot]
    upper_arm: [r_upperarm, right_upperarm, bip01 r upperarm, r_upper_arm]
    forearm: [r_forearm, right_forearm, bip01 r forearm, r_lowerarm]
    hand: [r_hand, right_hand, bip01 r hand]

mounted:
  pelvis_over_pegs: 0.24
  stick_forward: 0.07
  tuck_lift: 0.07
  pelvis_pitch: 5
  spine_pitch: 6
  neck_pitch: -4
  head_pitch: -6
  sole: [0.03, 0.0, -0.03]
  palm: [0.0, 0.0, -0.012]
  hand_yaw: 0
  knee: [1.0, 0.25, 0.3]
  elbow: [-0.3, 1.0, -0.6]

tricks:
  no_hander:
    hand: [0.0, 0.24, 0.22]
    spine_pitch: -8
  can_can:
    foot: [0.2, 0.1, -0.12]
  bar_spin:
    hand_lift: [-0.03, 0.05, 0.08]
    hop: 0.03
  superman:
    pelvis: [-0.27, 0.0, 0.06]
    pelvis_pitch: 80
    spine_pitch: 0
    head_pitch: -45
    foot_pitch: 80
    foot: [-0.27, 0.05, 0.02]
