# The Covenant "grav hopper" (content/pogo/README.md): an iridescent carapace
# with two curved prongs where a spring would be, a column of plasma for a
# piston and a plasma cushion for a foot. Model space, world units
# (1 = 3.048 m): +X forward, +Y left, +Z up, the origin the right grip. The
# shaft's axis is x 0, y 0.059.
name: pogo_covenant
atlas: covenant
nodes:
  - { name: frame, at: [0, 0, 0] }
  - { name: piston, parent: frame, at: [0, 0.059, -0.2] }
markers:
  - { name: grip_right, node: frame, at: [0, 0, 0] }
  - { name: grip_left, node: frame, at: [0, 0.118, 0] }
  - { name: peg_right, node: frame, at: [0, 0.023, -0.279] }
  - { name: peg_left, node: frame, at: [0, 0.095, -0.279] }
  - { name: foot, node: piston, at: [0, 0.059, -0.361] }
parts:
  - sweep:
      what: the bar, arched forward and up between the grips
      node: frame
      region: body_dark
      section: { circle: { radius: 0.0065, sides: 8 } }
      path: [[0, 0.012, 0], [0.004, 0.034, 0.011], [0.006, 0.059, 0.016], [0.004, 0.084, 0.011], [0, 0.106, 0]]
      caps: false
  - lathe:
      what: the right grip, a bulb
      node: frame
      region: grip
      origin: [0, 0, 0]
      axis: [0, 1, 0]
      segments: 10
      caps: true
      profile: [[0.004, -0.017], [0.008, -0.012], [0.0095, -0.004], [0.0085, 0.006], [0.007, 0.013]]
  - lathe:
      what: the left grip
      node: frame
      region: grip
      origin: [0, 0.118, 0]
      axis: [0, 1, 0]
      segments: 10
      caps: true
      profile: [[0.007, -0.013], [0.0085, -0.006], [0.0095, 0.004], [0.008, 0.012], [0.004, 0.017]]
  - lathe:
      what: the carapace
      node: frame
      region: body
      origin: [0, 0.059, 0]
      segments: 16
      profile: [[0.0, 0.026], [0.008, 0.022], [0.0155, 0.010], [0.018, -0.010], [0.015, -0.040], [0.0125, -0.075], [0.016, -0.105], [0.0185, -0.130], [0.015, -0.165], [0.011, -0.190]]
  - lathe:
      what: the lower shell the column comes out of
      node: frame
      region: accent
      origin: [0, 0.059, 0]
      segments: 12
      caps: true
      profile: [[0.012, -0.185], [0.0155, -0.205], [0.016, -0.245], [0.0135, -0.280], [0.010, -0.292]]
  - sweep:
      what: the front prong
      node: frame
      region: body_dark
      section: { polygon: [[0.007, 0], [0.0035, 0.004], [-0.0035, 0.004], [-0.007, 0], [-0.0035, -0.004], [0.0035, -0.004]] }
      path: [[0.012, 0.059, -0.200], [0.030, 0.059, -0.225], [0.038, 0.059, -0.258], [0.034, 0.059, -0.292], [0.024, 0.059, -0.318], [0.016, 0.059, -0.332]]
      scales: [1.0, 1.15, 1.1, 0.9, 0.65, 0.3]
  - sweep:
      what: the back prong
      node: frame
      region: body_dark
      section: { polygon: [[0.007, 0], [0.0035, 0.004], [-0.0035, 0.004], [-0.007, 0], [-0.0035, -0.004], [0.0035, -0.004]] }
      path: [[-0.012, 0.059, -0.200], [-0.030, 0.059, -0.225], [-0.038, 0.059, -0.258], [-0.034, 0.059, -0.292], [-0.024, 0.059, -0.318], [-0.016, 0.059, -0.332]]
      scales: [1.0, 1.15, 1.1, 0.9, 0.65, 0.3]
  - box:
      what: the right peg, a leaf of the shell
      node: frame
      region: peg
      min: [-0.011, 0.004, -0.286]
      max: [0.011, 0.046, -0.279]
      bevel: 0.0025
  - box:
      what: the left peg
      node: frame
      region: peg
      min: [-0.011, 0.072, -0.286]
      max: [0.011, 0.114, -0.279]
      bevel: 0.0025
  - lathe:
      what: the top light on the carapace's back
      node: frame
      region: glow
      origin: [-0.0165, 0.059, 0]
      segments: 8
      profile: [[0.0, -0.036], [0.0042, -0.0342], [0.006, -0.030], [0.0042, -0.0258], [0.0, -0.024]]
  - lathe:
      what: the middle light
      node: frame
      region: glow
      origin: [-0.0135, 0.059, 0]
      segments: 8
      profile: [[0.0, -0.066], [0.0042, -0.0642], [0.006, -0.060], [0.0042, -0.0558], [0.0, -0.054]]
  - lathe:
      what: the low light
      node: frame
      region: glow
      origin: [-0.0155, 0.059, 0]
      segments: 8
      profile: [[0.0, -0.106], [0.0042, -0.1042], [0.006, -0.100], [0.0042, -0.0958], [0.0, -0.094]]
  - lathe:
      what: the plasma column
      node: piston
      region: piston
      origin: [0, 0.059, 0]
      segments: 8
      profile: [[0.005, -0.340], [0.005, -0.245]]
  - lathe:
      what: the plasma cushion
      node: piston
      region: foot
      origin: [0, 0.059, 0]
      segments: 14
      profile: [[0.0, -0.361], [0.009, -0.360], [0.0155, -0.355], [0.017, -0.349], [0.013, -0.343], [0.006, -0.338]]
  - lathe:
      what: the ring around the cushion
      node: piston
      region: glow
      origin: [0, 0.059, 0]
      segments: 14
      closed: true
      profile: [[0.0195, -0.347], [0.021, -0.3485], [0.0225, -0.347], [0.021, -0.3455]]
