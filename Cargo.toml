[workspace]
resolver = "2"
members = [
    "crates/formats/*",
    "crates/recompiler/*",
    "crates/runtime/*",
    "crates/platform/*",
    "crates/hooking/*",
    "crates/rewrites/*",
    "crates/live/*",
    "crates/extensions/*",
    "crates/tools/*",
    "crates/apps/*",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "WTFPL"

[workspace.dependencies]
mem-watch = { path = "crates/runtime/mem-watch" }
hs = { path = "crates/formats/hs" }
tags = { path = "crates/formats/tags" }
anim-edit = { path = "crates/tools/anim-edit" }
sound-edit = { path = "crates/tools/sound-edit" }
map = { path = "crates/formats/map" }
assets = { path = "crates/platform/assets" }
xiso = { path = "crates/formats/xiso" }
movies = { path = "crates/formats/movies" }
xbe = { path = "crates/formats/xbe" }
h1-contract = { path = "crates/formats/h1-contract" }
host-log = { path = "crates/formats/host-log" }
analyze = { path = "crates/recompiler/analyze" }
symbols = { path = "crates/recompiler/symbols" }
runtime = { path = "crates/runtime/runtime" }
ir = { path = "crates/recompiler/ir" }
opt = { path = "crates/recompiler/opt" }
lift = { path = "crates/recompiler/lift" }
emit = { path = "crates/recompiler/emit" }
clif = { path = "crates/recompiler/clif" }
simd = { path = "crates/recompiler/simd" }
sim-core = { path = "crates/rewrites/sim-core" }
sim-effects = { path = "crates/rewrites/sim-effects" }
hud-kit-core = { path = "crates/rewrites/hud-kit-core" }
sim-anim = { path = "crates/rewrites/sim-anim" }
sim-collision = { path = "crates/rewrites/sim-collision" }
sim-havok = { path = "crates/rewrites/sim-havok" }
sim-objects = { path = "crates/rewrites/sim-objects" }
sim-script = { path = "crates/rewrites/sim-script" }
sim-sound = { path = "crates/rewrites/sim-sound" }
sim-state = { path = "crates/rewrites/sim-state" }
sim-world = { path = "crates/rewrites/sim-world" }
x87 = { path = "crates/recompiler/x87" }
kernel = { path = "crates/runtime/kernel" }
voice = { path = "crates/platform/voice" }
vfs = { path = "crates/runtime/vfs" }
background = { path = "crates/runtime/background" }
boot = { path = "crates/apps/boot" }
content = { path = "crates/formats/content" }
forge = { path = "crates/extensions/forge" }
forge-doc = { path = "crates/formats/forge-doc" }
rules = { path = "crates/formats/rules" }
forge-build = { path = "crates/tools/forge-build" }
host-dirs = { path = "crates/formats/host-dirs" }
live-proto = { path = "crates/live/live-proto" }
live-server = { path = "crates/live/live-server" }
cloud-saves = { path = "crates/live/cloud-saves" }
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Our screens' presentation (assets/ui/, docs/game/ui-builder.md "Screens in YAML"):
# the maintained fork of serde_yaml, and maps that keep the files' key order.
serde_yaml_ng = "0.10"
indexmap = { version = "2", features = ["serde"] }
png = "0.18"
libc = "0.2"
toml = "0.9"
sha2 = "0.10"
libloading = "0.8"
rustc-hash = "2"
# `h2 rules lsp`: the rules language server (docs/game/rules-engine.md, "Tooling").
lsp-server = "0.7"
lsp-types = "0.97"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }

# The style lints the workspace doesn't follow: guest-shaped code keeps wide
# signatures, tuple results and index loops that mirror the original.
[workspace.lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"
needless_range_loop = "allow"
identity_op = "allow"
chunks_exact_to_as_chunks = "allow"
manual_is_multiple_of = "allow"
large_enum_variant = "allow"
collapsible_if = "allow"
# `!(x > y)` is how this code refuses NaN along with the small values.
neg_cmp_op_on_partial_ord = "allow"
# Tests pin layout constants against each other with plain asserts.
assertions_on_constants = "allow"
field_reassign_with_default = "allow"

# Debug builds keep file/line backtraces but drop full debug info, which is
# most of a debug target (test binaries shrink several times over). For
# variables in a debugger, build with CARGO_PROFILE_DEV_DEBUG=2.
# No debug info in dev builds, workspace crates included: macOS keeps it in
# each codegen unit's object file and in a dSYM per test executable, about
# 12 GB per target directory. A panic still names its file and line; a
# backtrace names functions, not lines (docs/dev/build-speed.md).
# `cargo run --profile play -p cli -- play ...`: optimised like release, but
# incremental and in many codegen units, so a one-line fix in a big crate
# (game) rebuilds in seconds, not minutes. Perf numbers still come from
# release builds on the lab (docs/dev/build-speed.md).
[profile.play]
inherits = "release"
incremental = true
codegen-units = 256

[profile.dev]
debug = false

# The fixture tests decode ~5M rows; keep them quick in debug builds.
[profile.dev.package.sse-oracle]
opt-level = 3
[profile.dev.package.zstd-sys]
opt-level = 3

# The disc-gated tests analyse the whole image; unoptimised that takes minutes.
[profile.dev.package.analyze]
opt-level = 2

[profile.dev.package.iced-x86]
opt-level = 2

# Small codec and checksum crates that tests push whole images and maps
# through. Unoptimised they run 10 to 50 times slower, and they compile in
# seconds either way.
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.zlib-rs]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.ruzstd]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.adler2]
opt-level = 3
[profile.dev.package.simd-adler32]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
