[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
hs = { path = "crates/hs" }
tags = { path = "crates/tags" }
map = { path = "crates/map" }
assets = { path = "crates/assets" }
xiso = { path = "crates/xiso" }
movies = { path = "crates/movies" }
xbe = { path = "crates/xbe" }
analyze = { path = "crates/analyze" }
symbols = { path = "crates/symbols" }
runtime = { path = "crates/runtime" }
bink-hle = { path = "crates/bink-hle" }
ir = { path = "crates/ir" }
lift = { path = "crates/lift" }
emit = { path = "crates/emit" }
simd = { path = "crates/simd" }
x87 = { path = "crates/x87" }
kernel = { path = "crates/kernel" }
vfs = { path = "crates/vfs" }
boot = { path = "crates/boot" }
thiserror = "2"
anyhow = "1"

# The fixture tests decode ~5M rows; keep them quick in debug builds.
[profile.dev.package.sse-oracle]
opt-level = 3
[profile.dev.package.zstd-sys]
opt-level = 3

# The disc-gated tests analyse the whole image; unoptimised that takes minutes.
[profile.dev.package.analyze]
opt-level = 2

[profile.dev.package.iced-x86]
opt-level = 2
