[workspace]
resolver = "2"
members = [
    "crates/host-data", # dh-provision (contract 7)
    "crates/*",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
hs = { path = "crates/hs" }
tags = { path = "crates/tags" }
map = { path = "crates/map" }
assets = { path = "crates/assets" }
xiso = { path = "crates/xiso" }
movies = { path = "crates/movies" }
xbe = { path = "crates/xbe" }
analyze = { path = "crates/analyze" }
symbols = { path = "crates/symbols" }
runtime = { path = "crates/runtime" }
ir = { path = "crates/ir" }
opt = { path = "crates/opt" }
lift = { path = "crates/lift" }
emit = { path = "crates/emit" }
clif = { path = "crates/clif" }
simd = { path = "crates/simd" }
x87 = { path = "crates/x87" }
kernel = { path = "crates/kernel" }
voice = { path = "crates/voice" }
vfs = { path = "crates/vfs" }
boot = { path = "crates/boot" }
content = { path = "crates/content" }
live-proto = { path = "crates/live-proto" }
live-server = { path = "crates/live-server" }
cloud-saves = { path = "crates/cloud-saves" }
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }

# Debug builds keep file/line backtraces but drop full debug info, which is
# most of a debug target (test binaries shrink several times over). For
# variables in a debugger, build with CARGO_PROFILE_DEV_DEBUG=2.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = "line-tables-only"

# The fixture tests decode ~5M rows; keep them quick in debug builds.
[profile.dev.package.sse-oracle]
opt-level = 3
[profile.dev.package.zstd-sys]
opt-level = 3

# The disc-gated tests analyse the whole image; unoptimised that takes minutes.
[profile.dev.package.analyze]
opt-level = 2

[profile.dev.package.iced-x86]
opt-level = 2
