# The Live server behind a named Cloudflare tunnel (docs/live/live-hosting.md,
# "Docker with a named tunnel" and "Free hosting"). From this directory:
#
#   cp .env.example .env      # then fill in TUNNEL_TOKEN (and R2, optionally)
#   docker compose up -d
#
# cloudflared owns the network namespace; the server joins it (network_mode:
# service:cloudflared) and binds 127.0.0.1, so the only way in is the
# tunnel, nothing is published on the host, and the server sees the same
# thing it sees behind `h2 live serve --tunnel`: requests from loopback
# carrying Cloudflare's headers, which its this-machine-only routes refuse.
#
# The event log is SQLite in ./data (live.db): no database container. Blobs
# (content, cloud saves) are in ./data too, or in an R2 bucket when
# H2_LIVE_BLOBS=s3://BUCKET. With COMPOSE_PROFILES=backup, Litestream copies
# live.db to R2 continuously. A server on Postgres instead: add
# compose.postgres.yaml (`docker compose -f compose.yaml -f compose.postgres.yaml`).

name: h2live

x-r2: &r2
  H2_LIVE_S3_ENDPOINT: ${H2_LIVE_S3_ENDPOINT:-}
  H2_LIVE_S3_ACCESS_KEY_ID: ${H2_LIVE_S3_ACCESS_KEY_ID:-}
  H2_LIVE_S3_SECRET_ACCESS_KEY: ${H2_LIVE_S3_SECRET_ACCESS_KEY:-}

services:
  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-latest}
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      # Read by `cloudflared tunnel run`; kept out of the command line.
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env (the tunnel's token from the Cloudflare dashboard)}
    restart: unless-stopped

  server:
    build:
      context: ../..
      dockerfile: deploy/live/Dockerfile
    image: h2live:local
    network_mode: service:cloudflared
    depends_on:
      cloudflared:
        condition: service_started
        # A recreated cloudflared is a new namespace; follow it.
        restart: true
    command:
      - --listen
      - 127.0.0.1:8074
      - --data
      - /data
      - --game-art
      - /art
      - --share-game-art
      - --public-url
      - ${H2_LIVE_PUBLIC_URL:-https://live.forbes.red}
      - --behind-cloudflared
    environment:
      <<: *r2
      # Empty: sqlite:///data/live.db.
      H2_LIVE_DB: ${H2_LIVE_DB:-}
      # Empty: /data. s3://BUCKET: the private R2 bucket.
      H2_LIVE_BLOBS: ${H2_LIVE_BLOBS:-}
      # The public bucket the shared art is published to, and its URL.
      H2_LIVE_PUBLIC_BLOBS: ${H2_LIVE_PUBLIC_BLOBS:-}
      H2_LIVE_PUBLIC_BLOBS_URL: ${H2_LIVE_PUBLIC_BLOBS_URL:-}
      H2_LIVE_ADMINS: ${H2_LIVE_ADMINS:-}
      # 1: sign-up needs an invite code (setup.sh asks; off by default).
      H2_LIVE_INVITE_ONLY: ${H2_LIVE_INVITE_ONLY:-}
    volumes:
      - ${H2_LIVE_DATA_DIR:-./data}:/data
      - ${H2_LIVE_ART_DIR:-./art}:/art:ro
    # On Linux, set these to your own uid/gid so ./data stays yours (the
    # host's `h2 live invite create --data ./data` reads the key in it).
    user: "${H2_LIVE_UID:-65532}:${H2_LIVE_GID:-65532}"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  # Continuous backup of live.db to R2 (COMPOSE_PROFILES=backup): every
  # write reaches the bucket within a second; restore with
  # `docker compose run --rm litestream restore -if-replica-exists /data/live.db`.
  litestream:
    profiles: [backup]
    image: litestream/litestream:${LITESTREAM_VERSION:-0.3}
    command: ["replicate", "-config", "/etc/litestream.yml"]
    environment:
      <<: *r2
      LITESTREAM_DB: /data/live.db
      LITESTREAM_BUCKET: ${LITESTREAM_BUCKET:-}
    volumes:
      - ${H2_LIVE_DATA_DIR:-./data}:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    user: "${H2_LIVE_UID:-65532}:${H2_LIVE_GID:-65532}"
    restart: unless-stopped
